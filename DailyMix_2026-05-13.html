<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>SARFERPROD Daily Mix</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
    background: url('001.png') center/cover fixed;
    font-family: 'Inter', sans-serif;
    color: rgba(255,245,220,.9);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 20px;
    position: relative;
}
body::before {
    content: ''; position: fixed; inset: 0;
    background: rgba(20,15,8,.45);
    backdrop-filter: blur(4px);
    z-index: 0;
}
.container { max-width: 920px; width: 100%; position: relative; z-index: 1; }

.header {
    text-align: center;
    background: rgba(15,12,8,.5);
    backdrop-filter: blur(20px);
    border: 1px solid rgba(255,255,255,.1);
    border-radius: 24px;
    padding: 20px;
    margin-bottom: 20px;
    box-shadow: 0 8px 32px rgba(0,0,0,.3);
}
.header h1 {
    font-family: 'Cormorant Garamond', serif;
    font-size: 2.6rem;
    letter-spacing: 4px;
    text-shadow: 0 0 20px rgba(255,200,100,.4);
}
.header-date { font-size: 0.95rem; opacity: 0.7; letter-spacing: 2px; }

.glass {
    background: rgba(255,248,235,.12);
    backdrop-filter: blur(24px);
    border: 1px solid rgba(255,255,255,.18);
    border-radius: 28px;
    padding: 24px;
    margin-bottom: 20px;
    box-shadow: 0 10px 30px rgba(0,0,0,.25),
                inset 0 1px 0 rgba(255,255,255,.3);
}

.portrait-wrap { display: flex; justify-content: center; margin: 10px 0 20px; }
.portrait-outer {
    position: relative;
    width: 128px;
    height: 128px;
}
.portrait-ring {
    position: absolute;
    inset: -12px;
    border: 3px solid rgba(255,255,255,.25);
    border-radius: 50%;
    box-shadow: 0 0 40px rgba(255,200,100,.3);
    animation: ringPulse 4s ease-in-out infinite;
}
@keyframes ringPulse { 50% { box-shadow: 0 0 60px rgba(255,200,100,.5); } }

.portrait-img {
    width: 100%; height: 100%;
    border-radius: 50%;
    object-fit: cover;
    filter: url(#fisheye);
    transition: all .4s;
}
.portrait-outer:hover .portrait-img { animation: blink 0.6s forwards; }

@keyframes blink { 40%,60% { transform: scaleY(0.08); } }

.marquee-wrap {
    border: 2px solid rgba(139,69,19,.4);
    border-radius: 50px;
    padding: 12px 24px;
    background: rgba(0,0,0,.25);
    overflow: hidden;
    margin-bottom: 20px;
}
.marquee {
    white-space: nowrap;
    overflow: hidden;
}
.marquee span {
    display: inline-block;
    padding-left: 100%;
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: 1.15rem;
    animation: marquee 18s linear infinite;
}
@keyframes marquee { to { transform: translateX(-100%); } }

.controls { display: flex; justify-content: center; align-items: center; gap: 40px; margin: 20px 0; }

.soap-btn {
    width: 78px; height: 78px;
    border-radius: 50%;
    border: none;
    background: radial-gradient(circle at 40% 30%, rgba(255,255,255,.7), rgba(255,255,255,.1) 60%, rgba(180,140,80,.2));
    box-shadow: 0 4px 20px rgba(0,0,0,.3),
                inset 0 4px 12px rgba(255,255,255,.6),
                0 0 0 3px rgba(255,255,255,.15);
    cursor: pointer;
    transition: all .3s;
}
.soap-btn:hover { transform: scale(1.08); }

.spectro { height: 90px; background: rgba(0,0,0,.3); border-radius: 20px; overflow: hidden; margin: 15px 0; }
#specCanvas { width: 100%; height: 100%; }

.progress-bar-wrap { height: 6px; background: rgba(255,255,255,.15); border-radius: 3px; position: relative; cursor: pointer; }
#progressFill { height: 100%; background: linear-gradient(90deg, #ffcc66, #ffaa33); box-shadow: 0 0 12px #ffaa33; }

.markers-strip { position: relative; height: 42px; margin: 12px 0; }
.mkr { position: absolute; top: 50%; transform: translate(-50%, -50%); width: 10px; height: 10px; border-radius: 50%; background: rgba(255,220,120,.9); cursor: pointer; transition: all .2s; }
.mkr:hover { width: 18px; height: 18px; background: #ffdd88; box-shadow: 0 0 15px #ffcc66; }

.tl-title { font-family: 'Cormorant Garamond', serif; font-size: 1.4rem; text-align: center; margin-bottom: 12px; letter-spacing: 2px; opacity: 0.85; }

.tl-row { display: flex; align-items: center; gap: 14px; padding: 10px 12px; border-radius: 12px; cursor: pointer; }
.tl-row:hover { background: rgba(255,255,255,.08); }
.tl-row.active { background: rgba(255,200,80,.12); border-left: 3px solid #ffcc66; }

.share-row { display: flex; justify-content: center; gap: 12px; flex-wrap: wrap; margin-top: 20px; }
.share-btn {
    padding: 10px 22px;
    border-radius: 50px;
    background: rgba(255,255,255,.1);
    backdrop-filter: blur(12px);
    border: 1px solid rgba(255,255,255,.2);
    color: inherit;
    text-decoration: none;
    font-size: 0.9rem;
}
</style>
<svg style="display:none"><defs><filter id="fisheye"><feDisplacementMap in="SourceGraphic" scale="18" xChannelSelector="R" yChannelSelector="G"/></filter></defs></svg>
</head>
<body>
<div class="container">

  <div class="header">
    <h1>SARFERPROD DAILY MIX</h1>
    <div class="header-date">13/05/2026 — 08:58</div>
  </div>

  <div class="glass">
    <div class="portrait-wrap">
      <div class="portrait-outer">
        <div class="portrait-ring"></div>
        <img class="portrait-img" src="Radio_SARFERPROD.jpeg" alt="Sarferprod">
      </div>
    </div>

    <div class="marquee-wrap">
      <div class="marquee"><span id="marquee">Sarferprod Daily Mix</span></div>
    </div>

    <div class="controls">
      <button class="soap-btn" id="playBtn">▶</button>
      <button class="soap-btn" id="pauseBtn" style="display:none">⏸</button>
      <input type="range" id="volSlider" min="0" max="1" step="0.01" value="0.85">
    </div>

    <div class="spectro"><canvas id="specCanvas"></canvas></div>

    <div class="progress-bar-wrap" id="progressWrap">
      <div id="progressFill"></div>
    </div>

    <div class="markers-strip" id="markers"></div>
  </div>

  <div class="glass">
    <div class="tl-title">TRACKLIST</div>
    <div id="tracklist"></div>
  </div>

  <div class="share-row">
    <a href="https://wa.me/?text=Sarferprod%20Daily%20Mix" class="share-btn" target="_blank">WhatsApp</a>
    <a href="mailto:?subject=Daily Mix" class="share-btn">Email</a>
    <a href="https://soundcloud.com/user-403414255" class="share-btn" target="_blank">SoundCloud</a>
  </div>
</div>

<audio id="audio" src="DailyMix_2026-05-13.mp3"></audio>

<script>
const audio = document.getElementById('audio');
const playBtn = document.getElementById('playBtn');
const pauseBtn = document.getElementById('pauseBtn');
const volSlider = document.getElementById('volSlider');
const canvas = document.getElementById('specCanvas');
const ctx = canvas.getContext('2d');
const progressWrap = document.getElementById('progressWrap');
const progressFill = document.getElementById('progressFill');
const markersDiv = document.getElementById('markers');
const tlDiv = document.getElementById('tracklist');
const marquee = document.getElementById('marquee');

const TRACKS = [];

let audioCtx, analyser, dataArray;

function initAudio() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const source = audioCtx.createMediaElementSource(audio);
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 256;
    dataArray = new Uint8Array(analyser.frequencyBinCount);
    source.connect(analyser);
    analyser.connect(audioCtx.destination);
  }
}

playBtn.onclick = () => { initAudio(); audio.play(); playBtn.style.display='none'; pauseBtn.style.display='inline'; };
pauseBtn.onclick = () => { audio.pause(); playBtn.style.display='inline'; pauseBtn.style.display='none'; };
volSlider.oninput = () => audio.volume = volSlider.value;

audio.ontimeupdate = () => {
  const pct = audio.currentTime / audio.duration || 0;
  progressFill.style.width = (pct * 100) + '%';
  updateActiveTrack();
  updateMarquee();
};

progressWrap.onclick = e => {
  const rect = progressWrap.getBoundingClientRect();
  audio.currentTime = ((e.clientX - rect.left) / rect.width) * audio.duration;
};

// Marqueurs
TRACKS.forEach((t, i) => {
  const m = document.createElement('div');
  m.className = 'mkr';
  m.style.left = (t.seconds / (audio.duration || 1) * 100) + '%';
  m.title = t.artist + " - " + t.title;
  m.onclick = () => {
    audio.currentTime = t.seconds;
    m.style.transform = 'translate(-50%, -50%) scale(1.6)';
    setTimeout(() => { m.style.transform = 'translate(-50%, -50%)'; }, 250);
    window.open(t.url, '_blank');
  };
  markersDiv.appendChild(m);
});

// Tracklist
TRACKS.forEach(t => {
  const row = document.createElement('div');
  row.className = 'tl-row';
  row.innerHTML = `
    <span>${t.timestamp}</span>
    <img src="${t.thumbnail}" width="48" style="border-radius:6px;" onerror="this.style.display='none'">
    <div>
      <strong>${t.artist}</strong><br>
      <small>${t.title}</small>
    </div>
    <a href="${t.url}" target="_blank" style="margin-left:auto; color:#ffcc88;">YT →</a>
  `;
  row.onclick = () => audio.currentTime = t.seconds;
  tlDiv.appendChild(row);
});

function updateActiveTrack() {
  document.querySelectorAll('.tl-row').forEach((row, i) => {
    if (i < TRACKS.length) {
      const start = TRACKS[i].seconds;
      const end = i + 1 < TRACKS.length ? TRACKS[i+1].seconds : 999999;
      row.classList.toggle('active', audio.currentTime >= start && audio.currentTime < end);
    }
  });
}

function updateMarquee() {
  const current = TRACKS.findLast(t => t.seconds <= audio.currentTime) || TRACKS[0];
  if (current) marquee.textContent = current.artist + " — " + current.title;
}

// Spectrogramme
function draw() {
  requestAnimationFrame(draw);
  if (!analyser) return;
  analyser.getByteFrequencyData(dataArray);
  ctx.clearRect(0,0,canvas.width,canvas.height);
  const barWidth = canvas.width / dataArray.length * 1.8;
  for (let i = 0; i < dataArray.length; i++) {
    const height = (dataArray[i] / 255) * canvas.height * 0.9;
    ctx.fillStyle = `hsl(${30 + i}, 88%, 68%)`;
    ctx.fillRect(i * barWidth, canvas.height - height, barWidth - 2, height);
  }
}
canvas.width = 820;
canvas.height = 90;
draw();
</script>
</body>
</html>
