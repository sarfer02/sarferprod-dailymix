    const audio = document.getElementById('audio');
    const playBtn = document.getElementById('playBtn');
    const pauseBtn = document.getElementById('pauseBtn');
    const volumeSlider = document.getElementById('volumeSlider');
    const volumePercent = document.getElementById('volumePercent');
    const volumeIcon = document.getElementById('volumeIcon');
    const marqueeSpan = document.getElementById('marqueeText');
    const currentTimeSpan = document.getElementById('currentTime');
    const durationSpan = document.getElementById('duration');
    const progressBar = document.getElementById('progressBar');
    const progressFill = document.getElementById('progressFill');
    const canvas = document.getElementById('waveformCanvas');
    const ctx = canvas.getContext('2d');
    const markersLayer = document.getElementById('markersLayer');
    const tracklistGrid = document.getElementById('tracklistGrid');
    
    let audioContext = null, analyser = null, source = null, animId = null;
    let currentTrackIndex = -1;
    let lastVolume = 0.7;
    
    function resizeCanvas() {
        canvas.width = canvas.parentElement.clientWidth;
        canvas.height = 90;
        drawEmptyWaveform();
        setTimeout(updateMarkers, 150);
    }
    
    window.addEventListener('resize', resizeCanvas);
    setTimeout(resizeCanvas, 200);
    
    function formatTime(sec) {
        if (isNaN(sec) || !isFinite(sec)) return '00:00';
        const m = Math.floor(sec / 60);
        const s = Math.floor(sec % 60);
        return m.toString().padStart(2,'0') + ':' + s.toString().padStart(2,'0');
    }
    
    function initAudioContext() {
        if (audioContext) return;
        try {
            audioContext = new (window.AudioContext || window.webkitAudioContext)();
            analyser = audioContext.createAnalyser();
            analyser.fftSize = 256;
            source = audioContext.createMediaElementSource(audio);
            source.connect(analyser);
            analyser.connect(audioContext.destination);
            visualize();
        } catch(e) {
            console.log('AudioContext initialisé en fallback standard.');
        }
    }
    
    function visualize() {
        if (!analyser) return;
        const dataArray = new Uint8Array(analyser.frequencyBinCount);
        function update() {
            if (!audio.paused && !audio.ended) {
                analyser.getByteFrequencyData(dataArray);
                drawSpectrogram(dataArray);
            }
            animId = requestAnimationFrame(update);
        }
        update();
    }
    
    function drawSpectrogram(dataArray) {
        const width = canvas.width, height = canvas.height;
        const bufferLength = dataArray.length;
        const barWidth = width / bufferLength;
        ctx.clearRect(0, 0, width, height);
        
        const progress = audio.currentTime / (audio.duration || 1);
        
        for (let i = 0; i < bufferLength; i++) {
            const value = dataArray[i];
            const barHeight = (value / 255) * height * 0.85;
            const x = i * barWidth;
            const y = height - barHeight;
            const isPlayed = (i / bufferLength) < progress;
            
            if (isPlayed) {
                ctx.fillStyle = 'rgba(255, 140, 0, 0.85)';
                ctx.shadowBlur = 6;
                ctx.shadowColor = '#ff8c00';
            } else {
                ctx.fillStyle = 'rgba(255, 255, 255, 0.15)';
                ctx.shadowBlur = 0;
            }
            ctx.fillRect(x, y, Math.max(1, barWidth - 2), barHeight);
        }
        ctx.shadowBlur = 0;
    }
    
    function drawEmptyWaveform() {
        const width = canvas.width, height = canvas.height;
        ctx.clearRect(0, 0, width, height);
        ctx.fillStyle = 'rgba(255, 140, 0, 0.15)';
        const barCount = 60;
        const barWidth = width / barCount;
        for (let i = 0; i < barCount; i++) {
            const h = 15 + Math.sin(i * 0.2) * 10 + Math.cos(i * 0.05) * 5;
            ctx.fillRect(i * barWidth, height - h, Math.max(1, barWidth - 3), h);
        }
    }
    
    function updateMarkers() {
        if (!audio.duration || isNaN(audio.duration)) return;
        markersLayer.innerHTML = '';
        
        tracks.forEach((track, index) => {
            const pct = (track.seconds / audio.duration) * 100;
            if (pct > 100) return;
            
            const marker = document.createElement('div');
            marker.className = 'timeline-marker';
            marker.style.left = pct + '%';
            
            const tooltip = document.createElement('div');
            tooltip.className = 'marker-tooltip';
            tooltip.innerHTML = `
                <img src="${track.thumbnail}" onerror="this.src='Radio_SARFERPROD.jpeg'">
                <div class="tooltip-title">${escapeHtml(track.title)}</div>
                <div class="tooltip-artist">${escapeHtml(track.artist)}</div>
                <div class="tooltip-time">➔ ${track.timestamp}</div>
            `;
            
            marker.appendChild(tooltip);
            
            // Clic sur le repère : saute au morceau directement dans le mix
            marker.addEventListener('click', (e) => {
                e.stopPropagation();
                initAudioContext();
                audio.currentTime = track.seconds;
                playAudio();
            });
            
            markersLayer.appendChild(marker);
        });
    }
    
    function updateProgress() {
        if (audio.duration && !isNaN(audio.duration)) {
            const percent = (audio.currentTime / audio.duration) * 100;
            progressFill.style.width = percent + '%';
            updateActiveTrack();
        }
        currentTimeSpan.textContent = formatTime(audio.currentTime);
    }
    
    function updateActiveTrack() {
        const currentTime = audio.currentTime;
        let activeIndex = -1;
        
        for (let i = 0; i < tracks.length; i++) {
            const startTime = tracks[i].seconds;
            const endTime = (i < tracks.length - 1) ? tracks[i + 1].seconds : audio.duration;
            
            if (currentTime >= startTime - 0.3 && currentTime < endTime) {
                activeIndex = i;
                break;
            }
        }
        
        if (activeIndex !== currentTrackIndex && activeIndex !== -1) {
            currentTrackIndex = activeIndex;
            document.querySelectorAll('.track-row').forEach((row, idx) => {
                if (idx === activeIndex) {
                    row.classList.add('active');
                    row.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                } else {
                    row.classList.remove('active');
                }
            });
            if (tracks[activeIndex]) {
                marqueeSpan.textContent = tracks[activeIndex].artist.toUpperCase() + ' — ' + tracks[activeIndex].title;
            }
        }
    }
    
    function buildUI() {
        tracklistGrid.innerHTML = '';
        tracks.forEach((track, idx) => {
            const row = document.createElement('div');
            row.className = 'track-row';
            
            // Clic sur la ligne -> Lecture directe dans le mixeur au bon timestamp
            row.addEventListener('click', () => {
                initAudioContext();
                audio.currentTime = track.seconds;
                playAudio();
            });
            
            row.innerHTML = `
                <div class="track-vignette" style="background-image: url(${track.thumbnail}), url('Radio_SARFERPROD.jpeg');"></div>
                <div class="track-details">
                    <div class="track-artist-name">${escapeHtml(track.artist)}</div>
                    <div class="track-song-title">${escapeHtml(track.title)}</div>
                </div>
                <div class="track-right-zone">
                    <div class="track-duration">${track.timestamp}</div>
                    <a href="${track.url}" target="_blank" class="track-link" onclick="event.stopPropagation()">Source</a>
                </div>
            `;
            tracklistGrid.appendChild(row);
        });
    }
    
    function escapeHtml(str) { 
        if (!str) return ''; 
        return str.replace(/[&<>"]/g, m => {
            switch (m) {
                case '&': return '&amp;';
                case '<': return '&lt;';
                case '>': return '&gt;';
                case '"': return '&quot;';
                default: return m;
            }
        }); 
    }
    
    function playAudio() { 
        if (audioContext && audioContext.state === 'suspended') audioContext.resume(); 
        initAudioContext(); 
        audio.play().catch(e => console.log('Lecture bloquée par le navigateur', e));
    }
    
    function pauseAudio() { audio.pause(); }
    
    function updateVolume() { 
        const val = volumeSlider.value;
        audio.volume = val / 100; 
        volumePercent.textContent = val + '%'; 
        if (val == 0) {
            volumeIcon.textContent = '🔈';
        } else if (val < 50) {
            volumeIcon.textContent = '🔉';
        } else {
            volumeIcon.textContent = '🔊';
        }
    }
    
    volumeIcon.addEventListener('click', () => {
        if (audio.volume > 0) {
            lastVolume = audio.volume;
            volumeSlider.value = 0;
        } else {
            volumeSlider.value = lastVolume * 100;
        }
        updateVolume();
    });
    
    function setProgress(e) { 
        const rect = progressBar.getBoundingClientRect(); 
        const percent = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width)); 
        if (audio.duration) {
            audio.currentTime = percent * audio.duration;
            updateProgress();
        }
    }
    
    playBtn.addEventListener('click', playAudio);
    pauseBtn.addEventListener('click', pauseAudio);
    progressBar.addEventListener('click', setProgress);
    volumeSlider.addEventListener('input', updateVolume);
    audio.addEventListener('timeupdate', updateProgress);
    
    audio.addEventListener('loadedmetadata', () => { 
        durationSpan.textContent = formatTime(audio.duration); 
        setTimeout(updateMarkers, 200); 
    });
    
    audio.addEventListener('ended', () => {
        marqueeSpan.textContent = 'Mix terminé ! Merci de votre écoute — SARFERPROD';
        progressFill.style.width = '100%';
    });
    
    // Partage & Liens
    document.getElementById('whatsappBtn').addEventListener('click', e => {
        e.preventDefault();
        window.open('https://wa.me/?text=' + encodeURIComponent('Écoute le Sarferprod Daily Mix du jour ➔ ' + 'https://sarferprod.github.io/sarferprod-dailymix/'), '_blank');
    });
    
    document.getElementById('emailBtn').addEventListener('click', e => {
        e.preventDefault();
        window.location.href = 'mailto:?subject=' + encodeURIComponent('Sarferprod Daily Mix') + '&body=' + encodeURIComponent('Découvre le mix du jour ici : ' + 'https://sarferprod.github.io/sarferprod-dailymix/');
    });
    
    document.getElementById('copyBtn').addEventListener('click', e => {
        e.preventDefault();
        navigator.clipboard.writeText('https://sarferprod.github.io/sarferprod-dailymix/');
        const btn = document.getElementById('copyBtn');
        const originalText = btn.textContent;
        btn.textContent = 'Copié !';
        setTimeout(() => btn.textContent = originalText, 2000);
    });
    
    // Initialisation
    buildUI();
    updateVolume();
    document.body.addEventListener('click', () => { 
        if (audioContext && audioContext.state === 'suspended') audioContext.resume(); 
    }, { once: true });
</script>
</body>
</html>
