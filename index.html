<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet">
<title>Sarferprod Daily Mix — {meta['date']}</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f5f0e8;--bg2:#ede8de;--bg3:#e4ddd2;--card:#ffffff;
  --text:#2a2218;--text2:#7a6e60;--text3:#b0a898;
  --accent:#8b6f47;--accent2:#c4a882;--accent3:#e8d5b7;
  --border:#ddd5c5;--shadow:rgba(100,80,50,.10);
}
body{background:var(--bg);color:var(--text);font-family:'Cormorant Garamond',Georgia,serif;min-height:100vh}
.page{max-width:760px;margin:0 auto;padding:32px 18px 60px}

/* ── Titre 3D ── */
.brand{text-align:center;margin-bottom:6px;padding:28px 0 10px}
.brand h1{
  font-size:clamp(2em,6vw,3.4em);font-weight:600;letter-spacing:.06em;
  color:var(--text);
  text-shadow:
    1px 1px 0 var(--accent3),
    2px 2px 0 var(--accent2),
    3px 3px 0 var(--accent),
    4px 4px 0 rgba(139,111,71,.35),
    5px 5px 8px rgba(100,80,50,.20);
  line-height:1.1
}
.brand .sub{font-family:'DM Mono',monospace;font-size:.78em;color:var(--text3);letter-spacing:.14em;margin-top:6px}

/* ── Bento grid ── */
.bento{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}
.bento .card{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:18px;box-shadow:0 2px 12px var(--shadow)}
.card-full{grid-column:1/-1}

/* ── Now Playing ── */
.np{display:flex;align-items:center;gap:14px}
.np-thumb{width:70px;height:52px;border-radius:10px;object-fit:cover;border:1px solid var(--border);flex-shrink:0;transition:transform .2s;cursor:pointer}
.np-thumb:hover{transform:scale(1.06)}
.np-label{font-family:'DM Mono',monospace;font-size:.6em;letter-spacing:.15em;color:var(--text3);text-transform:uppercase;margin-bottom:4px}
.np-title{font-size:1em;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.np-artist{font-size:.78em;color:var(--text2);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ── Spectrogramme ── */
.spectro-wrap{position:relative;height:80px;border-radius:12px;overflow:hidden;background:var(--bg3)}
canvas#cv{position:absolute;inset:0;width:100%;height:100%}
.spectro-cursor{position:absolute;top:0;bottom:0;width:2px;background:var(--accent);opacity:.7;pointer-events:none;transition:left .25s linear}

/* ── Player custom ── */
.player-block{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:18px 20px;box-shadow:0 2px 12px var(--shadow);margin-bottom:14px}
.progress-wrap{position:relative;margin-bottom:14px}
.progress-bar{width:100%;height:6px;border-radius:3px;background:var(--bg3);-webkit-appearance:none;appearance:none;cursor:pointer;outline:none}
.progress-bar::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:var(--accent);border:2px solid var(--card);box-shadow:0 1px 4px var(--shadow);cursor:pointer;margin-top:-4px}
.progress-bar::-webkit-slider-runnable-track{height:6px;border-radius:3px;background:linear-gradient(to right,var(--accent) var(--prog,0%),var(--bg3) var(--prog,0%))}

/* ── Repères sur la barre ── */
.markers{position:absolute;top:0;left:0;right:0;height:6px;pointer-events:none}
.marker{position:absolute;top:-3px;width:2px;height:12px;background:var(--accent2);border-radius:1px;transform:translateX(-50%);pointer-events:all;cursor:pointer;transition:all .18s;z-index:10}
.marker:hover{width:4px;height:18px;top:-6px;background:var(--accent);z-index:20}
.marker-tooltip{display:none;position:absolute;bottom:22px;left:50%;transform:translateX(-50%);width:130px;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:7px;box-shadow:0 4px 16px var(--shadow);pointer-events:none;z-index:30}
.marker:hover .marker-tooltip{display:block}
.marker-tooltip img{width:100%;height:60px;object-fit:cover;border-radius:6px;display:block;margin-bottom:4px}
.marker-tooltip .mt-title{font-size:.7em;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.marker-tooltip .mt-ts{font-family:'DM Mono',monospace;font-size:.62em;color:var(--text3)}
.marker.clicked{animation:vibrate .3s ease}
@keyframes vibrate{0%,100%{transform:translateX(-50%)}20%{transform:translateX(calc(-50% - 3px))}40%{transform:translateX(calc(-50% + 3px))}60%{transform:translateX(calc(-50% - 2px))}80%{transform:translateX(calc(-50% + 2px))}}

.controls{display:flex;align-items:center;gap:14px}
.btn-play{width:44px;height:44px;border-radius:50%;background:var(--accent);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:0 2px 8px var(--shadow);transition:transform .15s}
.btn-play:hover{transform:scale(1.08)}
.btn-play svg{fill:#fff;width:18px;height:18px}
.time-disp{font-family:'DM Mono',monospace;font-size:.75em;color:var(--text2);white-space:nowrap}
.vol-wrap{display:flex;align-items:center;gap:7px;margin-left:auto}
.vol-wrap svg{width:16px;height:16px;fill:var(--text3)}
.vol-slider{width:72px;height:4px;border-radius:2px;-webkit-appearance:none;appearance:none;background:var(--bg3);cursor:pointer;outline:none}
.vol-slider::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;border-radius:50%;background:var(--accent2);border:none;cursor:pointer}

/* ── Tracklist ── */
.tl-card{background:var(--card);border:1px solid var(--border);border-radius:18px;overflow:hidden;box-shadow:0 2px 12px var(--shadow);margin-bottom:14px}
.tl-head{padding:12px 18px;background:var(--bg2);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.tl-head span{font-family:'DM Mono',monospace;font-size:.68em;letter-spacing:.12em;text-transform:uppercase;color:var(--text3)}
.tl-body{max-height:340px;overflow-y:auto}
.tl-body::-webkit-scrollbar{width:4px}
.tl-body::-webkit-scrollbar-thumb{background:var(--accent3);border-radius:2px}
.tl-row{display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid var(--bg2);cursor:pointer;transition:background .14s}
.tl-row:last-child{border-bottom:none}
.tl-row:hover{background:var(--bg3)}
.tl-row.active{background:var(--accent3);border-left:3px solid var(--accent)}
.tl-ts{font-family:'DM Mono',monospace;font-size:.68em;color:var(--text3);width:40px;flex-shrink:0}
.tl-thumb{width:48px;height:36px;border-radius:5px;object-fit:cover;border:1px solid var(--border);flex-shrink:0}
.tl-info{flex:1;overflow:hidden}
.tl-title{font-size:.88em;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tl-artist{font-size:.72em;color:var(--text2);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tl-link{flex-shrink:0;font-family:'DM Mono',monospace;font-size:.65em;color:var(--accent);text-decoration:underline;text-underline-offset:2px;white-space:nowrap}
.tl-link:hover{color:var(--text)}

/* ── Durée des morceaux dans la tracklist ── */
.tl-dur{font-family:'DM Mono',monospace;font-size:.63em;color:var(--text3);white-space:nowrap;flex-shrink:0}

/* ── Boutons partage ── */
.share-row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-bottom:20px}
.shr-btn{display:inline-flex;align-items:center;gap:7px;padding:10px 20px;border-radius:50px;font-family:'DM Mono',monospace;font-size:.75em;letter-spacing:.06em;text-decoration:none;border:1.5px solid var(--border);color:var(--text2);background:var(--card);transition:all .15s}
.shr-btn:hover{background:var(--bg3);border-color:var(--accent2);color:var(--text)}
.shr-wa{background:#25d366;border-color:#25d366;color:#fff}
.shr-wa:hover{background:#1fbb58;color:#fff}

/* ── Logo bento ── */
.logo-card{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:20px}
.logo-card a img{width:80px;height:80px;border-radius:50%;object-fit:cover;border:2px solid var(--accent2);box-shadow:0 2px 12px var(--shadow);transition:transform .2s}
.logo-card a:hover img{transform:scale(1.06)}
.logo-card .sc-link{font-family:'DM Mono',monospace;font-size:.62em;letter-spacing:.1em;color:var(--accent);text-decoration:none;text-align:center}
.logo-card .sc-link:hover{text-decoration:underline}
</style>
</head>
<body>
<div class="page">

  <!-- Titre 3D -->
  <div class="brand">
    <h1>Sarferprod Daily Mix</h1>
    <div class="sub">2026-05-09 &nbsp;·&nbsp; 20:46 &nbsp;·&nbsp; 00:01:07</div>
  </div>

  <!-- Bento row 1 : NowPlaying + Logo -->
  <div class="bento" style="margin-bottom:14px">
    <div class="card" style="grid-column:1/2">
      <div class="np-label">En cours</div>
      <div class="np" style="margin-top:8px">
        <img id="np-img" class="np-thumb" src="Radio_SARFERPROD.jpeg" alt="" onerror="this.style.display='none'">
        <div style="overflow:hidden">
          <div class="np-title" id="np-title">— Intro —</div>
          <div class="np-artist" id="np-artist">Sarferprod</div>
        </div>
      </div>
    </div>
    <div class="card logo-card" style="grid-column:2/3">
      <a href="https://soundcloud.com/user-403414255/radio-coocool-01" target="_blank">
        <img src="Radio_SARFERPROD.jpeg" alt="Sarferprod" onerror="this.style.display='none'">
      </a>
      <a href="https://soundcloud.com/user-403414255/radio-coocool-01" target="_blank" class="sc-link">SoundCloud ↗</a>
    </div>
  </div>

  <!-- Spectrogramme -->
  <div class="card card-full" style="padding:14px;margin-bottom:14px;border-radius:18px;border:1px solid var(--border);background:var(--card);box-shadow:0 2px 12px var(--shadow)">
    <div class="spectro-wrap">
      <canvas id="cv"></canvas>
      <div class="spectro-cursor" id="sc-cursor"></div>
    </div>
  </div>

  <!-- Player -->
  <div class="player-block">
    <!-- Barre de progression + repères -->
    <div class="progress-wrap">
      <div class="markers" id="markers"></div>
      <input type="range" id="prog" class="progress-bar" min="0" max="1000" value="0" step="1">
    </div>
    <div class="controls">
      <button class="btn-play" id="btn-play" aria-label="Play/Pause">
        <svg id="ico-play" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
      </button>
      <span class="time-disp" id="time-disp">0:00 / 0:00</span>
      <div class="vol-wrap">
        <svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/></svg>
        <input type="range" id="vol" class="vol-slider" min="0" max="1" step="0.01" value="1">
      </div>
    </div>
  </div>

  <!-- Tracklist -->
  <div class="tl-card">
    <div class="tl-head">
      <span>Tracklist</span>
      <span id="tl-count">1 titres</span>
    </div>
    <div class="tl-body" id="tl-body"></div>
  </div>

  <!-- Boutons partage -->
  <div class="share-row">
    <a href="https://wa.me/?text=Sarferprod%20Daily%20Mix%202026-05-09%20%E2%86%92%20https://sarfer02.github.io/sarferprod-dailymix" target="_blank" class="shr-btn shr-wa">📲 WhatsApp</a>
    <a href="mailto:?subject=Sarferprod%20Daily%20Mix%202026-05-09&body=Sarferprod%20Daily%20Mix%202026-05-09%20%E2%86%92%20https://sarfer02.github.io/sarferprod-dailymix" class="shr-btn">✉️ Email</a>
    <a href="https://soundcloud.com/user-403414255/radio-coocool-01" target="_blank" class="shr-btn">🎵 SoundCloud</a>
  </div>

</div><!-- /page -->

<audio id="audio" src="DailyMix_2026-05-09.mp3" preload="metadata"></audio>

<script>
const TRACKS      = [{"timestamp": "00:00:30", "timestamp_seconds": 30.8, "artist": "La Belle Musique", "title": "✨ Chris Stussy will rock Buenos Aires! Get your tickets now for a night of pure house vibes 🔥#vibes", "url": "https://www.youtube.com/watch?v=Cf9jdW49cns", "thumbnail": "https://img.youtube.com/vi/Cf9jdW49cns/mqdefault.jpg", "channel": "La Belle Musique"}];
const INTRO_END   = 30.8;
const OUTRO_START = 38.3;
const LOGO        = "Radio_SARFERPROD.jpeg";
const SC_URL      = "https://soundcloud.com/user-403414255/radio-coocool-01";

const audio   = document.getElementById('audio');
const btnPlay = document.getElementById('btn-play');
const icoPlay = document.getElementById('ico-play');
const progBar = document.getElementById('prog');
const timeDisp= document.getElementById('time-disp');
const volBar  = document.getElementById('vol');
const npImg   = document.getElementById('np-img');
const npTitle = document.getElementById('np-title');
const npArtist= document.getElementById('np-artist');
const tlBody  = document.getElementById('tl-body');
const markersDiv = document.getElementById('markers');
const cursor  = document.getElementById('sc-cursor');

// ── Play / Pause ─────────────────────────────────────────────────────────────
const PLAY_SVG  = '<path d="M8 5v14l11-7z"/>';
const PAUSE_SVG = '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>';
btnPlay.onclick = () => audio.paused ? audio.play() : audio.pause();
audio.addEventListener('play',  () => icoPlay.innerHTML = PAUSE_SVG);
audio.addEventListener('pause', () => icoPlay.innerHTML = PLAY_SVG);

// ── Volume ───────────────────────────────────────────────────────────────────
volBar.oninput = () => { audio.volume = parseFloat(volBar.value); };

// ── Progress bar ─────────────────────────────────────────────────────────────
function fmt(s) {
  s = Math.floor(s);
  return Math.floor(s/60) + ':' + (s%60).toString().padStart(2,'0');
}
audio.addEventListener('timeupdate', () => {
  const pct = audio.duration ? audio.currentTime / audio.duration : 0;
  progBar.value = Math.round(pct * 1000);
  progBar.style.setProperty('--prog', (pct*100).toFixed(2)+'%');
  timeDisp.textContent = fmt(audio.currentTime) + ' / ' + fmt(audio.duration||0);
  // curseur spectro
  cursor.style.left = (pct*100).toFixed(2)+'%';
  updateNP();
  updateTL();
});
progBar.oninput = () => {
  if (audio.duration) audio.currentTime = (progBar.value/1000) * audio.duration;
};

// ── Repères sur la barre ─────────────────────────────────────────────────────
audio.addEventListener('loadedmetadata', () => {
  markersDiv.innerHTML = '';
  const dur = audio.duration;
  TRACKS.forEach((t, i) => {
    const pct = (t.timestamp_seconds / dur) * 100;
    const mk  = document.createElement('div');
    mk.className = 'marker';
    mk.style.left = pct.toFixed(2) + '%';
    const s   = Math.floor(t.timestamp_seconds);
    const mm  = Math.floor(s/60);
    const ss  = (s%60).toString().padStart(2,'0');
    const tit = (t.title || '').substring(0, 28);
    const thu = t.thumbnail || LOGO;
    mk.innerHTML = `<div class="marker-tooltip">
      <img src="${thu}" onerror="this.src='${LOGO}'">
      <div class="mt-title">${tit}</div>
      <div class="mt-ts">${mm}:${ss}</div>
    </div>`;
    mk.addEventListener('click', () => {
      audio.currentTime = t.timestamp_seconds;
      audio.play();
      mk.classList.add('clicked');
      if (t.url) setTimeout(() => window.open(t.url, '_blank'), 350);
      setTimeout(() => mk.classList.remove('clicked'), 400);
    });
    markersDiv.appendChild(mk);
  });
});

// ── Build tracklist ───────────────────────────────────────────────────────────
TRACKS.forEach((t, i) => {
  const row = document.createElement('div');
  row.className = 'tl-row';
  row.id = 'tr'+i;
  const s  = Math.floor(t.timestamp_seconds);
  const mm = Math.floor(s/60), ss = (s%60).toString().padStart(2,'0');
  const dur = t.duration_s ? fmt(t.duration_s) : '';
  const thu = t.thumbnail || LOGO;
  const tit = t.title || '';
  const art = t.artist || t.channel || '';
  const url = t.url || '#';
  row.innerHTML = `
    <span class="tl-ts">${mm}:${ss}</span>
    <img class="tl-thumb" src="${thu}" onerror="this.src='${LOGO}'">
    <div class="tl-info">
      <div class="tl-title">${tit}</div>
      <div class="tl-artist">${art}</div>
    </div>
    ${dur ? '<span class="tl-dur">'+dur+'</span>' : ''}
    <a class="tl-link" href="${url}" target="_blank" onclick="event.stopPropagation()">↗ YouTube</a>`;
  row.onclick = () => { audio.currentTime = t.timestamp_seconds; audio.play(); };
  tlBody.appendChild(row);
});

// ── Now Playing ───────────────────────────────────────────────────────────────
let lastIdx = -2;
function updateNP() {
  const ct = audio.currentTime;
  if (ct < INTRO_END) {
    if (lastIdx === -1) return;
    lastIdx = -1;
    npImg.src = LOGO; npImg.onclick = () => window.open(SC_URL,'_blank'); npImg.style.cursor='pointer';
    npTitle.textContent = '— Intro —'; npArtist.textContent = 'Sarferprod';
    return;
  }
  if (OUTRO_START > 0 && ct >= OUTRO_START) {
    if (lastIdx === -3) return;
    lastIdx = -3;
    npImg.src = LOGO; npImg.onclick = () => window.open(SC_URL,'_blank'); npImg.style.cursor='pointer';
    npTitle.textContent = '— Outro —'; npArtist.textContent = 'Sarferprod';
    return;
  }
  let cur = null, idx = -1;
  for (let i = 0; i < TRACKS.length; i++) {
    if (ct >= TRACKS[i].timestamp_seconds) { cur = TRACKS[i]; idx = i; }
    else break;
  }
  if (idx === lastIdx) return;
  lastIdx = idx;
  if (cur) {
    npImg.src = cur.thumbnail || LOGO;
    npImg.onclick = cur.url ? () => window.open(cur.url,'_blank') : null;
    npImg.style.cursor = cur.url ? 'pointer' : 'default';
    npTitle.textContent  = cur.title  || '';
    npArtist.textContent = cur.artist || cur.channel || '';
  }
}

// ── Tracklist auto-scroll + highlight ─────────────────────────────────────────
let lastTLIdx = -2;
function updateTL() {
  const ct = audio.currentTime;
  let idx = -1;
  for (let i = 0; i < TRACKS.length; i++) {
    if (ct >= TRACKS[i].timestamp_seconds) idx = i; else break;
  }
  if (idx === lastTLIdx) return;
  lastTLIdx = idx;
  document.querySelectorAll('.tl-row').forEach((r,i) => {
    r.classList.toggle('active', i === idx);
  });
  if (idx >= 0) {
    const el = document.getElementById('tr'+idx);
    if (el) el.scrollIntoView({behavior:'smooth', block:'nearest'});
  }
}

// ── Spectrogramme ─────────────────────────────────────────────────────────────
const cv  = document.getElementById('cv');
const ctx = cv.getContext('2d');
let raf, analyser, dataArr, audioCtx, fakeT = 0;

function resize() {
  cv.width  = cv.offsetWidth  * devicePixelRatio || 700;
  cv.height = cv.offsetHeight * devicePixelRatio || 80;
}
window.addEventListener('resize', resize); resize();

function drawReal() {
  if (audio.paused) return;
  analyser.getByteFrequencyData(dataArr);
  const W = cv.width, H = cv.height, bW = W/dataArr.length;
  const prog = audio.duration ? audio.currentTime/audio.duration : 0;
  ctx.clearRect(0,0,W,H);
  for (let i=0; i<dataArr.length; i++) {
    const v  = dataArr[i]/255, bH = Math.max(2,v*H), x = i*bW;
    const played = x/W < prog;
    const g = ctx.createLinearGradient(0,H-bH,0,H);
    if (played) {
      g.addColorStop(0, `rgba(139,111,71,${.95*v+.1})`);
      g.addColorStop(1, `rgba(100,70,30,${.6*v+.08})`);
    } else {
      g.addColorStop(0, `rgba(196,168,130,${.55*v+.08})`);
      g.addColorStop(1, `rgba(180,155,115,${.3*v+.04})`);
    }
    ctx.fillStyle=g; ctx.fillRect(x, H-bH, Math.max(1,bW-.8), bH);
  }
  raf = requestAnimationFrame(drawReal);
}

function fakeDraw() {
  fakeT += .03;
  const W = cv.width, H = cv.height, bars = 140, bW = W/bars;
  const prog = audio.duration ? audio.currentTime/audio.duration : 0;
  ctx.clearRect(0,0,W,H);
  for (let i=0; i<bars; i++) {
    const v  = (Math.sin(i*.16+fakeT)*.38+.5)*(Math.sin(i*.07-fakeT*.55)*.28+.72);
    const bH = Math.max(2, v*H*.78), x = i*bW;
    const played = x/W < prog;
    const g = ctx.createLinearGradient(0,H-bH,0,H);
    if (played) {
      g.addColorStop(0, `rgba(139,111,71,${.85*v+.1})`);
      g.addColorStop(1, `rgba(100,70,30,${.5*v+.08})`);
    } else {
      g.addColorStop(0, `rgba(196,168,130,${.45*v+.07})`);
      g.addColorStop(1, `rgba(180,155,115,${.25*v+.04})`);
    }
    ctx.fillStyle=g; ctx.fillRect(x, H-bH, Math.max(1,bW-.8), bH);
  }
  raf = requestAnimationFrame(fakeDraw);
}

function startSpectro() {
  cancelAnimationFrame(raf);
  if (!audioCtx) {
    try {
      audioCtx = new (window.AudioContext||window.webkitAudioContext)();
      analyser = audioCtx.createAnalyser(); analyser.fftSize = 512;
      dataArr  = new Uint8Array(analyser.frequencyBinCount);
      const src = audioCtx.createMediaElementSource(audio);
      src.connect(analyser); analyser.connect(audioCtx.destination);
    } catch(e) { fakeDraw(); return; }
  }
  drawReal();
}

fakeDraw();
audio.addEventListener('play',  () => startSpectro());
audio.addEventListener('pause', () => { cancelAnimationFrame(raf); fakeDraw(); });
</script>
</body>
</html>
