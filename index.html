    const audio = document.getElementById('audio');
    const meta = document.getElementById('meta');
    const curTime = document.getElementById('curTime');
    const progFill = document.getElementById('progFill');
    const progContainer = document.getElementById('progContainer');
    const markersContainer = document.getElementById('markersContainer');
    const listDiv = document.getElementById('list');
    let curIdx = -1;

    function fmtDisplay(secs) {
        let m = Math.floor(secs / 60);
        let s = Math.floor(secs % 60);
        return m + ':' + s.toString().padStart(2, '0');
    }

    // Génération dynamique de la tracklist HTML et placement des vignettes LED
    if(tracks && tracks.length > 0) {
        // On calcule la durée globale estimée basée sur le dernier timestamp du morceau
        const maxDuration = tracks[tracks.length - 1].seconds + 180;

        tracks.forEach((t, i) => {
            // 1. Ligne Tracklist
            const r = document.createElement('div'); r.className = 'track-row'; r.id = 't-'+i;
            r.innerHTML = `<div class="thumb" style="background-image:url(${t.thumbnail})"></div><div class="details"><div class="artist">${t.artist}</div><div class="track-title">${t.title}</div></div><div class="time">${t.timestamp}</div>`;
            listDiv.appendChild(r);

            // 2. Plotting Vignette LED Orange sur la timeline
            const pct = (t.seconds / maxDuration) * 100;
            const led = document.createElement('div');
            led.className = 'marker-led';
            led.style.left = pct + '%';
            led.title = t.artist + " - " + t.title;
            led.onclick = () => { audio.currentTime = t.seconds; };
            markersContainer.appendChild(led);
        });
        meta.textContent = tracks[0].artist + ' — ' + tracks[0].title;
    }

    // Interaction clic barre de lecture
    progContainer.onclick = (e) => {
        const rect = progContainer.getBoundingClientRect();
        const pct = (e.clientX - rect.left) / rect.width;
        if(audio.duration) audio.currentTime = pct * audio.duration;
    };

    // Update Temps réel et suivi synchronisé des pistes
    audio.addEventListener('timeupdate', () => {
        curTime.textContent = fmtDisplay(audio.currentTime);
        if(audio.duration) {
            progFill.style.width = (audio.currentTime / audio.duration * 100) + '%';
        }
        
        let idx = -1;
        for(let i=0; i<tracks.length; i++) {
            if(audio.currentTime >= tracks[i].seconds - 0.5) idx = i;
        }
        if(idx !== curIdx && idx !== -1) {
            curIdx = idx;
            document.querySelectorAll('.track-row').forEach(r => r.classList.remove('active'));
            const activeRow = document.getElementById('t-'+idx);
            if(activeRow) activeRow.classList.add('active');
            meta.textContent = tracks[idx].artist + ' — ' + tracks[idx].title;
        }
    });
</script>
