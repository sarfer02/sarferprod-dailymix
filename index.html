<script>

mbnail": "https://img.youtube.com/vi/qIhYzrGGcis/mqdefault.jpg", "channel": "KEXP"}, {"timestamp": "00:09:18", "timestamp_seconds": 558.8, "artist": "Spiritual Cramp", "title": "Full Performance (Live on KEXP)", "url": "https://www.youtube.com/watch?v=zM7iXrVW7Q0", "thumbnail": "https://img.youtube.com/vi/zM7iXrVW7Q0/mqdefault.jpg", "channel": "KEXP"}, {"timestamp": "00:10:24", "timestamp_seconds": 624.8, "artist": "2 Meter Sessions", "title": "Pure Raw Soul &amp; Blues \ud83c\udfb8 Robert Finley at 2 Meter Sessions", "url": "https://www.youtube.com/watch?v=vCZnYWu2u2w", "thumbnail": "https://img.youtube.com/vi/vCZnYWu2u2w/mqdefault.jpg", "channel": "2 Meter Sessions"}, {"timestamp": "00:11:09", "timestamp_seconds": 669.1, "artist": "Alcestice", "title": "Watch Me (Full Album)", "url": "https://www.youtube.com/watch?v=5UdUtpT4XrU", "thumbnail": "https://img.youtube.com/vi/5UdUtpT4XrU/mqdefault.jpg", "channel": "Stoned Meadow Of Doom"}, {"timestamp": "00:12:15", "timestamp_seconds": 735.1, "artist": "Sciama", "title": "Shifting Formants [SMDE59]", "url": "https://www.youtube.com/watch?v=z8tUKqlEYYs", "thumbnail": "https://img.youtube.com/vi/z8tUKqlEYYs/mqdefault.jpg", "channel": "SamuraiMusicTV"}];
const p=document.getElementById('p');
ts.forEach(t=>{
  let d=document.createElement('div'); d.className='track-item';
  let m=Math.floor(t.timestamp_seconds/60), s=Math.floor(t.timestamp_seconds%60).toString().padStart(2,'0');
  d.innerHTML=`<span class="track-ts">${m}:${s}</span><img src="${t.thumbnail||''}" onerror="this.style.display='none'">
    <div class="track-info"><div class="track-title"><b>${t.artist||''}</b> — ${t.title}</div>
    <div style="font-size:.7em;color:#555">${t.channel||''}</div></div>`;
  d.onclick=()=>{p.currentTime=t.timestamp_seconds; p.play();};
  document.getElementById('l').appendChild(d);
});

// Visualiseur spectral
const cv=document.getElementById('cv');
const ctx=cv.getContext('2d');
let raf,analyser,dataArr,audioCtx,fakeT=0;
function resizeCV(){cv.width=cv.offsetWidth*devicePixelRatio||600;cv.height=80*devicePixelRatio||80;}
window.addEventListener('resize',resizeCV);resizeCV();
function startSpectro(){
  if(!audioCtx){
    try{
      audioCtx=new(window.AudioContext||window.webkitAudioContext)();
      analyser=audioCtx.createAnalyser();analyser.fftSize=512;
      dataArr=new Uint8Array(analyser.frequencyBinCount);
      const src=audioCtx.createMediaElementSource(p);
      src.connect(analyser);analyser.connect(audioCtx.destination);
    }catch(e){fakeDraw();return}
  }
  function draw(){
    if(p.paused)return;
    analyser.getByteFrequencyData(dataArr);
    const W=cv.width,H=cv.height;
    ctx.clearRect(0,0,W,H);
    const bW=W/dataArr.length;
    for(let i=0;i<dataArr.length;i++){
      const v=dataArr[i]/255,bH=Math.max(2,v*H),x=i*bW;
      const g=ctx.createLinearGradient(0,H-bH,0,H);
      g.addColorStop(0,`rgba(201,168,124,${.9*v+.1})`);g.addColorStop(1,`rgba(160,115,65,${.5*v+.05})`);
      ctx.fillStyle=g;ctx.fillRect(x,H-bH,Math.max(1,bW-.8),bH);
    }
    raf=requestAnimationFrame(draw);
  }
  cancelAnimationFrame(raf);draw();
}
function fakeDraw(){
  const bars=128;
  function draw(){
    fakeT+=.04;
    const W=cv.width,H=cv.height;
    ctx.clearRect(0,0,W,H);
    const bW=W/bars;
    for(let i=0;i<bars;i++){
      const v=(Math.sin(i*.18+fakeT)*.4+.5)*(Math.sin(i*.07-fakeT*.6)*.3+.7);
      const bH=Math.max(2,v*H*.85),x=i*bW;
      const g=ctx.createLinearGradient(0,H-bH,0,H);
      g.addColorStop(0,`rgba(201,168,124,${.85*v+.1})`);g.addColorStop(1,`rgba(160,115,65,${.5*v+.05})`);
      ctx.fillStyle=g;ctx.fillRect(x,H-bH,Math.max(1,bW-.8),bH);
    }
    raf=requestAnimationFrame(draw);
  }
  cancelAnimationFrame(raf);draw();
}
fakeDraw();
p.addEventListener('play',()=>{cancelAnimationFrame(raf);startSpectro();});
</script>
