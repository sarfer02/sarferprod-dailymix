<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SARFERPROD • Daily Mix</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-image: url('001.png');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px 20px;
        }
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(4px);
            pointer-events: none;
            z-index: 0;
        }
        .container { max-width: 950px; width: 100%; margin: 0 auto; position: relative; z-index: 1; }
        .victorian-header {
            background: rgba(0, 0, 0, 0.5); backdrop-filter: blur(10px);
            border: 1.5px solid rgba(255, 140, 0, 0.5); border-radius: 20px;
            padding: 20px 30px; margin-bottom: 25px; text-align: center;
        }
        .header-logos { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
        .header-logos img { height: 45px; width: auto; }
        .free-badge {
            display: inline-block; background: rgba(255, 140, 0, 0.3);
            border: 1px solid rgba(255, 140, 0, 0.6); border-radius: 40px;
            padding: 4px 20px; font-family: monospace; font-size: 0.7rem;
            color: #ffaa55; margin-bottom: 12px;
        }
        .event-date { display: flex; justify-content: center; gap: 20px; font-family: 'Georgia', serif; font-size: 0.8rem; color: rgba(255, 245, 220, 0.7); letter-spacing: 1px; flex-wrap: wrap; }
        .glass-card {
            background: rgba(20, 20, 35, 0.45); backdrop-filter: blur(18px);
            border-radius: 32px; border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3); padding: 32px 28px;
            margin-bottom: 24px;
        }
        .portrait-wrapper { display: flex; justify-content: center; margin-bottom: 25px; }
        .lens-portrait {
            width: 120px; height: 120px; border-radius: 50%; overflow: hidden;
            border: 3px solid rgba(255, 140, 0, 0.5); cursor: pointer;
            transition: transform 0.2s; animation: subtleWiggle 3s infinite;
        }
        .lens-portrait:hover { transform: scale(1.08); }
        @keyframes subtleWiggle { 0%,100% { transform: translateX(0); } 50% { transform: translateX(2px); } }
        .lens-portrait img { width: 100%; height: 100%; object-fit: cover; }
        .track-title-frame {
            border: 1.5px solid rgba(255, 140, 0, 0.5); border-radius: 60px;
            padding: 14px 24px; background: rgba(0, 0, 0, 0.25); margin-bottom: 30px;
        }
        .marquee-track { width: 100%; overflow: hidden; white-space: nowrap; }
        .marquee-track span { display: inline-block; padding-left: 100%; animation: scrollTrack 14s linear infinite; font-family: 'Georgia', serif; font-size: 1rem; font-style: italic; color: rgba(255, 220, 150, 0.9); }
        @keyframes scrollTrack { 0% { transform: translateX(0); } 100% { transform: translateX(-100%); } }
        .controls-center { display: flex; justify-content: center; gap: 30px; margin-bottom: 20px; }
        .btn-img { background: none; border: none; cursor: pointer; transition: transform 0.2s; width: 65px; height: 65px; }
        .btn-img img { width: 100%; height: 100%; object-fit: contain; }
        .btn-img:hover { transform: scale(1.1); filter: drop-shadow(0 0 8px #ff8c00); }
        .volume-control { display: flex; justify-content: center; align-items: center; gap: 12px; margin-bottom: 20px; }
        .volume-icon { color: #ffcc88; font-size: 1rem; }
        .volume-slider { width: 120px; height: 4px; -webkit-appearance: none; background: rgba(255, 255, 255, 0.3); border-radius: 4px; }
        .volume-slider::-webkit-slider-thumb { -webkit-appearance: none; width: 12px; height: 12px; border-radius: 50%; background: #ff8c00; cursor: pointer; }
        .progress-section { margin: 10px 0 20px; position: relative; }
        canvas { width: 100%; height: 85px; border-radius: 45px; display: block; background: rgba(0, 0, 0, 0.4); }
        .progress-wrapper { width: 100%; height: 4px; background: rgba(255, 255, 255, 0.2); border-radius: 4px; margin: 16px 0 8px; cursor: pointer; position: relative; }
        .progress-fill-led { width: 0%; height: 100%; background: linear-gradient(90deg, #ff8c00, #ffcc00, #ff8c00); border-radius: 4px; }
        .markers-layer { position: relative; width: 100%; height: 20px; margin-top: 8px; margin-bottom: 5px; }
        .timeline-marker {
            position: absolute; width: 4px; height: 16px; background: #ff8c00; border-radius: 2px;
            cursor: pointer; transition: all 0.2s; z-index: 10; transform: translateX(-50%);
        }
        .timeline-marker:hover { width: 8px; height: 24px; background: #ffaa33; margin-top: -4px; }
        .marker-tooltip {
            position: absolute; bottom: 25px; left: 50%; transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.9); backdrop-filter: blur(8px); border-radius: 12px;
            padding: 8px 12px; display: none; white-space: nowrap; z-index: 100;
            pointer-events: none; border: 1px solid #ff8c00;
        }
        .timeline-marker:hover .marker-tooltip { display: block; }
        .marker-tooltip img { width: 80px; height: 45px; border-radius: 6px; object-fit: cover; margin-bottom: 5px; }
        .marker-tooltip .tooltip-title { font-size: 0.7rem; color: #ffcc88; font-weight: 600; max-width: 120px; overflow: hidden; text-overflow: ellipsis; }
        .marker-tooltip .tooltip-artist { font-size: 0.6rem; color: rgba(255, 245, 220, 0.7); }
        .time-row { display: flex; justify-content: space-between; font-size: 0.7rem; color: rgba(255, 245, 220, 0.5); font-family: monospace; }
        .tracklist-header { text-align: center; margin-bottom: 20px; }
        .tracklist-title { font-family: 'Georgia', serif; font-size: 1.4rem; font-weight: 400; color: #ffcc88; letter-spacing: 6px; text-transform: uppercase; border-bottom: 1px solid rgba(255, 140, 0, 0.4); display: inline-block; padding: 0 20px 8px; }
        .tracklist-grid { display: grid; gap: 8px; max-height: 320px; overflow-y: auto; padding-right: 6px; }
        .tracklist-grid::-webkit-scrollbar { width: 3px; }
        .tracklist-grid::-webkit-scrollbar-track { background: rgba(255, 255, 255, 0.1); }
        .tracklist-grid::-webkit-scrollbar-thumb { background: #ff8c00; border-radius: 3px; }
        .track-row {
            display: flex; align-items: center; gap: 14px; padding: 10px 14px;
            background: rgba(0, 0, 0, 0.3); border-radius: 16px; cursor: pointer;
            transition: all 0.2s; border-left: 3px solid transparent;
        }
        .track-row:hover { background: rgba(0, 0, 0, 0.6); transform: translateX(6px); }
        .track-row.active { background: rgba(255, 140, 0, 0.25); border-left: 3px solid #ff8c00; }
        .track-row.active .track-artist-name { color: #ffcc88; }
        .track-row.active .track-song-title { color: #ffaa55; }
        .track-vignette { width: 50px; height: 50px; border-radius: 8px; background-size: cover; background-position: center; flex-shrink: 0; border: 1px solid rgba(255, 140, 0, 0.4); }
        .track-details { flex: 1; }
        .track-artist-name { font-weight: 600; color: #ffcc88; font-size: 0.85rem; }
        .track-song-title { font-style: italic; color: rgba(255, 245, 220, 0.7); font-size: 0.8rem; }
        .track-duration { font-family: monospace; font-size: 0.7rem; color: #ffaa55; margin-right: 12px; }
        .track-link { font-size: 0.7rem; color: #ff8c00; text-decoration: none; padding: 4px 8px; border-radius: 20px; background: rgba(255, 140, 0, 0.2); }
        .track-link:hover { color: white; background: #ff8c00; }
        .social-row { display: flex; justify-content: center; gap: 15px; margin-top: 20px; flex-wrap: wrap; }
        .social-icon { backdrop-filter: blur(8px); border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 40px; padding: 8px 20px; font-size: 0.8rem; text-decoration: none; transition: all 0.2s; font-weight: 500; cursor: pointer; }
        .whatsapp-btn { background: rgba(37, 211, 102, 0.5); color: white; }
        .whatsapp-btn:hover { background: rgba(37, 211, 102, 0.8); transform: translateY(-2px); }
        .email-btn { background: rgba(244, 180, 0, 0.5); color: white; }
        .email-btn:hover { background: rgba(244, 180, 0, 0.8); transform: translateY(-2px); }
        .copy-btn { background: rgba(100, 100, 100, 0.5); color: white; }
        .copy-btn:hover { background: rgba(100, 100, 100, 0.8); transform: translateY(-2px); }
        .soundcloud-btn { background: rgba(255, 85, 0, 0.5); color: white; }
        .soundcloud-btn:hover { background: rgba(255, 85, 0, 0.8); transform: translateY(-2px); }
        .vibrate { animation: vibrateShort 0.12s; }
        @keyframes vibrateShort { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }
    </style>
</head>
<body>
<div class="container">
    <div class="victorian-header">
        <div class="header-logos">
            <img src="title_sarferprod.png" alt="SARFERPROD">
            <img src="title_daily.png" alt="DAILY">
            <img src="title_sampler.png" alt="SAMPLE">
            <img src="title_mix.png" alt="MIX">
        </div>
        <div class="free-badge">FREE ENTRY</div>
        <div class="event-date">
            <span>WED 20TH</span>
            <span>MAY</span>
            <span>08:55</span>
            <span>NEW YORK CITY</span>
        </div>
    </div>
    <div class="glass-card">
        <div class="portrait-wrapper">
            <div class="lens-portrait" onclick="window.open('https://soundcloud.com/sarferprod', '_blank')">
                <img src="Radio_SARFERPROD.jpeg" alt="SARFERPROD">
            </div>
        </div>
        <div class="track-title-frame">
            <div class="marquee-track">
                <span id="marqueeText">Chargement...</span>
            </div>
        </div>
        <div class="controls-center">
            <button class="btn-img" id="playBtn"><img src="btn_play.png" alt="Play"></button>
            <button class="btn-img" id="pauseBtn"><img src="btn_pause.png" alt="Pause"></button>
        </div>
        <div class="volume-control">
            <span class="volume-icon">🔊</span>
            <input type="range" id="volumeSlider" class="volume-slider" min="0" max="100" value="70">
            <span class="volume-icon" id="volumePercent">70%</span>
        </div>
        <div class="progress-section">
            <canvas id="waveformCanvas" width="800" height="85"></canvas>
            <div class="progress-wrapper" id="progressBar">
                <div class="progress-fill-led" id="progressFill"></div>
            </div>
            <div class="markers-layer" id="markersLayer"></div>
            <div class="time-row">
                <span id="currentTime">00:00</span>
                <span id="duration">0:58</span>
            </div>
        </div>
    </div>
    <div class="glass-card">
        <div class="tracklist-header">
            <div class="tracklist-title">TRACKLIST</div>
        </div>
        <div class="tracklist-grid" id="tracklistGrid"></div>
    </div>
    <div class="social-row">
        <a href="#" class="social-icon whatsapp-btn" id="whatsappBtn">WhatsApp</a>
        <a href="#" class="social-icon email-btn" id="emailBtn">Email</a>
        <button class="social-icon copy-btn" id="copyBtn">Copier le lien</button>
        <a href="https://soundcloud.com/sarferprod" target="_blank" class="social-icon soundcloud-btn">SoundCloud</a>
    </div>
    <audio id="audio" src="./latest.mp3" preload="auto"></audio>
</div>
<script>
    const GITHUB_URL = "https://sarfer02.github.io/sarferprod-dailymix";
    const tracks = [];
    const audio = document.getElementById('audio');
    const playBtn = document.getElementById('playBtn');
    const pauseBtn = document.getElementById('pauseBtn');
    const volumeSlider = document.getElementById('volumeSlider');
    const volumePercent = document.getElementById('volumePercent');
    const marqueeSpan = document.getElementById('marqueeText');
    const currentTimeSpan = document.getElementById('currentTime');
    const durationSpan = document.getElementById('duration');
    const progressBar = document.getElementById('progressBar');
    const progressFill = document.getElementById('progressFill');
    const canvas = document.getElementById('waveformCanvas');
    const ctx = canvas.getContext('2d');
    const markersLayer = document.getElementById('markersLayer');
    const tracklistGrid = document.getElementById('tracklistGrid');
    
    let audioContext = null, analyser = null, animId = null;
    let currentTrackIndex = -1;
    
    function formatTime(sec) {
        if (isNaN(sec)) return '00:00';
        const m = Math.floor(sec / 60);
        const s = Math.floor(sec % 60);
        return m + ':' + s.toString().padStart(2,'0');
    }
    
    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, m => m === '&' ? '&amp;' : (m === '<' ? '&lt;' : '&gt;'));
    }
    
    function updateMarkers() {
        if (!audio.duration) return;
        markersLayer.innerHTML = '';
        tracks.forEach(track => {
            const pct = (track.seconds / audio.duration) * 100;
            if (pct > 100) return;
            const marker = document.createElement('div');
            marker.className = 'timeline-marker';
            marker.style.left = pct + '%';
            const tooltip = document.createElement('div');
            tooltip.className = 'marker-tooltip';
            tooltip.innerHTML = `<img src="${track.thumbnail}"><div class="tooltip-title">${escapeHtml(track.title)}</div><div class="tooltip-artist">${escapeHtml(track.artist)}</div>`;
            marker.appendChild(tooltip);
            marker.onclick = (e) => { e.stopPropagation(); window.open(track.url, '_blank'); };
            markersLayer.appendChild(marker);
        });
    }
    
    function updateActiveTrack() {
        let activeIndex = -1;
        for (let i = 0; i < tracks.length; i++) {
            if (audio.currentTime >= tracks[i].seconds) activeIndex = i;
            else break;
        }
        if (activeIndex !== currentTrackIndex) {
            currentTrackIndex = activeIndex;
            document.querySelectorAll('.track-row').forEach((row, idx) => {
                row.classList.toggle('active', idx === activeIndex);
            });
            if (activeIndex >= 0) {
                marqueeSpan.textContent = tracks[activeIndex].artist + ' — ' + tracks[activeIndex].title;
                document.querySelectorAll('.track-row')[activeIndex]?.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            }
        }
    }
    
    function buildUI() {
        tracklistGrid.innerHTML = '';
        tracks.forEach((track, idx) => {
            const row = document.createElement('div');
            row.className = 'track-row';
            row.onclick = () => window.open(track.url, '_blank');
            row.innerHTML = `
                <div class="track-vignette" style="background-image: url(${track.thumbnail});"></div>
                <div class="track-details">
                    <div class="track-artist-name">${escapeHtml(track.artist)}</div>
                    <div class="track-song-title">${escapeHtml(track.title)}</div>
                </div>
                <div class="track-duration">${track.timestamp}</div>
                <a href="${track.url}" target="_blank" class="track-link" onclick="event.stopPropagation()">YouTube</a>
            `;
            tracklistGrid.appendChild(row);
        });
    }
    
    function initAudioContext() {
        if (audioContext) return;
        try {
            audioContext = new AudioContext();
            analyser = audioContext.createAnalyser();
            analyser.fftSize = 256;
            const source = audioContext.createMediaElementSource(audio);
            source.connect(analyser);
            analyser.connect(audioContext.destination);
            function draw() {
                if (!audio.paused) {
                    const data = new Uint8Array(analyser.frequencyBinCount);
                    analyser.getByteFrequencyData(data);
                    const width = canvas.width, height = canvas.height;
                    canvas.width = canvas.parentElement.clientWidth - 30;
                    canvas.height = 85;
                    ctx.clearRect(0, 0, width, height);
                    for (let i = 0; i < data.length; i++) {
                        const h = (data[i] / 255) * height;
                        ctx.fillStyle = '#ff8c00';
                        ctx.fillRect(i * (width/data.length), height - h, 2, h);
                    }
                }
                requestAnimationFrame(draw);
            }
            draw();
        } catch(e) {}
    }
    
    function updateProgress() {
        if (audio.duration) {
            progressFill.style.width = (audio.currentTime / audio.duration) * 100 + '%';
            updateActiveTrack();
        }
        currentTimeSpan.textContent = formatTime(audio.currentTime);
        if (audio.duration) durationSpan.textContent = formatTime(audio.duration);
    }
    
    function setProgress(e) {
        const rect = progressBar.getBoundingClientRect();
        const pct = (e.clientX - rect.left) / rect.width;
        audio.currentTime = pct * audio.duration;
    }
    
    playBtn.onclick = () => { initAudioContext(); audio.play(); };
    pauseBtn.onclick = () => audio.pause();
    progressBar.onclick = setProgress;
    volumeSlider.oninput = () => {
        audio.volume = volumeSlider.value / 100;
        volumePercent.textContent = volumeSlider.value + '%';
    };
    audio.volume = 0.7;
    audio.addEventListener('timeupdate', updateProgress);
    audio.addEventListener('loadedmetadata', () => {
        durationSpan.textContent = formatTime(audio.duration);
        updateMarkers();
    });
    
    document.getElementById('whatsappBtn').onclick = (e) => {
        e.preventDefault();
        window.open('https://wa.me/?text=' + encodeURIComponent('Sarferprod Daily Mix - ' + GITHUB_URL), '_blank');
    };
    document.getElementById('emailBtn').onclick = (e) => {
        e.preventDefault();
        window.location.href = 'mailto:?subject=' + encodeURIComponent('Sarferprod Daily Mix') + '&body=' + encodeURIComponent('Ecoute mon mix : ' + GITHUB_URL);
    };
    document.getElementById('copyBtn').onclick = (e) => {
        e.preventDefault();
        navigator.clipboard.writeText(GITHUB_URL);
        const btn = document.getElementById('copyBtn');
        btn.textContent = 'Copie !';
        setTimeout(() => btn.textContent = 'Copier le lien', 2000);
    };
    
    buildUI();
    canvas.width = canvas.parentElement.clientWidth - 30;
    canvas.height = 85;
</script>
</body>
</html>
