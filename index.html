<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SARFERPROD • Daily Mix 20 MAY</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0a0a;
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container { max-width: 900px; width: 100%; margin: 0 auto; }
        .card {
            background: rgba(20, 20, 30, 0.9);
            backdrop-filter: blur(10px);
            border-radius: 24px;
            border: 1px solid rgba(255, 140, 0, 0.3);
            padding: 24px;
            margin-bottom: 20px;
        }
        .header { text-align: center; margin-bottom: 20px; padding-bottom: 15px; border-bottom: 1px solid rgba(255, 140, 0, 0.3); }
        .header h1 { font-size: 1.8rem; color: #ff8c00; letter-spacing: 2px; }
        .header .date { color: #888; font-size: 0.8rem; margin-top: 8px; }
        .now-playing { background: rgba(0, 0, 0, 0.5); border-radius: 16px; padding: 15px; margin-bottom: 20px; text-align: center; }
        .now-title { font-size: 1.1rem; font-weight: 600; color: #ffcc88; }
        .now-artist { font-size: 0.9rem; color: #ff8c00; margin-top: 5px; }
        .controls { display: flex; justify-content: center; gap: 20px; margin: 20px 0; }
        .btn { background: #ff8c00; border: none; padding: 12px 24px; border-radius: 40px; color: white; font-size: 1rem; cursor: pointer; transition: transform 0.2s; }
        .btn:hover { transform: scale(1.05); background: #ffaa33; }
        .progress-container { background: rgba(255, 255, 255, 0.2); height: 6px; border-radius: 3px; cursor: pointer; margin: 15px 0; }
        .progress-fill { background: #ff8c00; height: 100%; width: 0%; border-radius: 3px; }
        .markers-layer { position: relative; height: 20px; margin: 5px 0; }
        .marker { position: absolute; width: 3px; height: 15px; background: #ff8c00; cursor: pointer; transform: translateX(-50%); }
        .marker:hover { width: 6px; height: 22px; background: #ffaa33; margin-top: -3px; }
        .time-row { display: flex; justify-content: space-between; font-size: 0.7rem; color: #888; font-family: monospace; }
        .volume-row { display: flex; justify-content: center; align-items: center; gap: 10px; margin: 15px 0; }
        .volume-slider { width: 100px; }
        .tracklist { max-height: 350px; overflow-y: auto; }
        .tracklist-item { display: flex; align-items: center; gap: 12px; padding: 10px; border-bottom: 1px solid rgba(255, 255, 255, 0.1); cursor: pointer; transition: background 0.2s; }
        .tracklist-item:hover { background: rgba(255, 140, 0, 0.2); }
        .tracklist-item.active { background: rgba(255, 140, 0, 0.4); border-left: 3px solid #ff8c00; }
        .track-thumb { width: 45px; height: 45px; border-radius: 8px; object-fit: cover; }
        .track-info { flex: 1; }
        .track-artist { font-weight: 600; color: #ffcc88; font-size: 0.85rem; }
        .track-title { font-size: 0.75rem; color: #aaa; }
        .track-time { font-family: monospace; font-size: 0.7rem; color: #ff8c00; margin-right: 10px; }
        .track-link { color: #ff8c00; text-decoration: none; font-size: 0.7rem; padding: 4px 8px; border-radius: 15px; background: rgba(255, 140, 0, 0.2); }
        .track-link:hover { background: #ff8c00; color: white; }
        .social-row { display: flex; justify-content: center; gap: 15px; margin-top: 20px; flex-wrap: wrap; }
        .social-btn { padding: 8px 20px; border-radius: 30px; text-decoration: none; font-size: 0.8rem; transition: all 0.2s; }
        .wa { background: #25D366; color: white; }
        .email { background: #F4B400; color: white; }
        .copy { background: #555; color: white; cursor: pointer; }
        .sc { background: #ff5500; color: white; }
        .social-btn:hover { transform: translateY(-2px); opacity: 0.9; }
    </style>
</head>
<body>
<div class="container">
    <div class="card">
        <div class="header">
            <h1>SARFERPROD DAILY MIX</h1>
            <div class="date">WED 20 MAY • 10:38</div>
        </div>
        <div class="now-playing">
            <div id="nowTitle" class="now-title">--</div>
            <div id="nowArtist" class="now-artist">--</div>
        </div>
        <div class="controls">
            <button class="btn" id="playBtn">▶ PLAY</button>
            <button class="btn" id="pauseBtn">⏸ PAUSE</button>
        </div>
        <div class="progress-container" id="progressBar">
            <div class="progress-fill" id="progressFill"></div>
        </div>
        <div class="markers-layer" id="markersLayer"></div>
        <div class="time-row">
            <span id="currentTime">00:00</span>
            <span id="duration">10:19</span>
        </div>
        <div class="volume-row">
            <span>🔊</span>
            <input type="range" id="volumeSlider" class="volume-slider" min="0" max="100" value="70">
            <span id="volumePercent">70%</span>
        </div>
    </div>
    <div class="card">
        <div style="font-size:1.2rem; margin-bottom:15px; color:#ff8c00;">📋 TRACKLIST</div>
        <div class="tracklist" id="tracklist"></div>
    </div>
    <div class="social-row">
        <a href="#" class="social-btn wa" id="whatsappBtn">WhatsApp</a>
        <a href="#" class="social-btn email" id="emailBtn">Email</a>
        <button class="social-btn copy" id="copyBtn">Copier le lien</button>
        <a href="https://soundcloud.com/sarferprod" target="_blank" class="social-btn sc">SoundCloud</a>
    </div>
    <audio id="audio" src="./latest.mp3" preload="auto"></audio>
</div>
<script>
    const GITHUB_URL = "https://sarfer02.github.io/sarferprod-dailymix";
    const tracks = [{"timestamp": "00:30", "seconds": 30.8, "artist": "Gwenifer Raymond", "title": "Champion Ivy (Live on KEXP)", "url": "https://www.youtube.com/watch?v=-uROrvsrnm0", "thumbnail": "https://i.ytimg.com/vi/-uROrvsrnm0/hqdefault.jpg"}, {"timestamp": "01:04", "seconds": 64.8, "artist": "NCT, Genetics, Kazhi", "title": "More Than Enough", "url": "https://www.youtube.com/watch?v=zeSyg7c0_NU", "thumbnail": "https://i.ytimg.com/vi/zeSyg7c0_NU/hqdefault.jpg"}, {"timestamp": "01:38", "seconds": 98.8, "artist": "Arya", "title": "SPEAK", "url": "https://www.youtube.com/watch?v=pEbcFUdlsJQ", "thumbnail": "https://i.ytimg.com/vi/pEbcFUdlsJQ/hqdefault.jpg"}, {"timestamp": "02:12", "seconds": 132.8, "artist": "Gwenifer Raymond", "title": "Jack Parsons Blues (Live on KEXP)", "url": "https://www.youtube.com/watch?v=Ve3IyvXEi5w", "thumbnail": "https://i.ytimg.com/vi/Ve3IyvXEi5w/hqdefault.jpg"}, {"timestamp": "02:46", "seconds": 166.8, "artist": "Gio Mee", "title": "Feels So Good", "url": "https://www.youtube.com/watch?v=a9M3ohN9suE", "thumbnail": "https://i.ytimg.com/vi/a9M3ohN9suE/hqdefault.jpg"}, {"timestamp": "03:20", "seconds": 200.8, "artist": "kalm", "title": "eyes open", "url": "https://www.youtube.com/watch?v=lVkayX-8Gks", "thumbnail": "https://i.ytimg.com/vi/lVkayX-8Gks/hqdefault.jpg"}, {"timestamp": "03:54", "seconds": 234.8, "artist": "Josh Teed, Great Dane", "title": "Kardona (Jack Flora Remix)", "url": "https://www.youtube.com/watch?v=3LQS0iCP6vI", "thumbnail": "https://i.ytimg.com/vi/3LQS0iCP6vI/hqdefault.jpg"}, {"timestamp": "04:28", "seconds": 268.8, "artist": "MitiS", "title": "Wilderness (FLOTE Remix) [Lyrics] feat. KC", "url": "https://www.youtube.com/watch?v=3MAG27vHg3M", "thumbnail": "https://i.ytimg.com/vi/3MAG27vHg3M/hqdefault.jpg"}, {"timestamp": "05:02", "seconds": 302.8, "artist": "triple j", "title": "Curry Barker on Obsession, viral horror & why come", "url": "https://www.youtube.com/watch?v=uE4GobCWY1k", "thumbnail": "https://i.ytimg.com/vi/uE4GobCWY1k/hqdefault.jpg"}, {"timestamp": "05:36", "seconds": 336.8, "artist": "Avicii", "title": "Levels (Lyrics)", "url": "https://www.youtube.com/watch?v=lzijRNO2VP0", "thumbnail": "https://i.ytimg.com/vi/lzijRNO2VP0/hqdefault.jpg"}, {"timestamp": "06:10", "seconds": 370.8, "artist": "D.V. Alias Khryst", "title": "Rumble feat. V", "url": "https://www.youtube.com/watch?v=4KcgXbKgG7g", "thumbnail": "https://i.ytimg.com/vi/4KcgXbKgG7g/hqdefault.jpg"}, {"timestamp": "06:44", "seconds": 404.8, "artist": "Gwenifer Raymond", "title": "Bliws Afon Ta\u0302f (Live on KEXP)", "url": "https://www.youtube.com/watch?v=kw2JPnC21BU", "thumbnail": "https://i.ytimg.com/vi/kw2JPnC21BU/hqdefault.jpg"}, {"timestamp": "07:18", "seconds": 438.8, "artist": "triple j", "title": "ancient roman pick up culture goes crazy", "url": "https://www.youtube.com/watch?v=fxQvc4mPsdI", "thumbnail": "https://i.ytimg.com/vi/fxQvc4mPsdI/hqdefault.jpg"}, {"timestamp": "07:52", "seconds": 472.8, "artist": "Spinnin' Records", "title": "\u2060@GiuseppeRoccasalvo gives Patty Pravo\u2019s 1978 clas", "url": "https://www.youtube.com/watch?v=gbQqexE1XJI", "thumbnail": "https://i.ytimg.com/vi/gbQqexE1XJI/hqdefault.jpg"}, {"timestamp": "08:09", "seconds": 489.8, "artist": "Autobus", "title": "Mokasin | Sofar Lima", "url": "https://www.youtube.com/watch?v=Kf4ZdIyCaug", "thumbnail": "https://i.ytimg.com/vi/Kf4ZdIyCaug/hqdefault.jpg"}, {"timestamp": "08:43", "seconds": 523.8, "artist": "KEXP", "title": "Gwenifer Raymond performs \"Jack Parsons Blues\" & m", "url": "https://www.youtube.com/watch?v=UzH7LDcANFE", "thumbnail": "https://i.ytimg.com/vi/UzH7LDcANFE/hqdefault.jpg"}, {"timestamp": "09:00", "seconds": 540.8, "artist": "triple j", "title": "two years on and a noah kahan/phoebe bridgers coll", "url": "https://www.youtube.com/watch?v=bYzosoNXTc4", "thumbnail": "https://i.ytimg.com/vi/bYzosoNXTc4/hqdefault.jpg"}, {"timestamp": "09:17", "seconds": 557.8, "artist": "yehno", "title": "Distant", "url": "https://www.youtube.com/watch?v=7Ti2jalMAYM", "thumbnail": "https://i.ytimg.com/vi/7Ti2jalMAYM/hqdefault.jpg"}];
    
    const audio = document.getElementById('audio');
    const playBtn = document.getElementById('playBtn');
    const pauseBtn = document.getElementById('pauseBtn');
    const progressFill = document.getElementById('progressFill');
    const progressBar = document.getElementById('progressBar');
    const currentTimeSpan = document.getElementById('currentTime');
    const durationSpan = document.getElementById('duration');
    const volumeSlider = document.getElementById('volumeSlider');
    const volumePercent = document.getElementById('volumePercent');
    const nowTitle = document.getElementById('nowTitle');
    const nowArtist = document.getElementById('nowArtist');
    const markersLayer = document.getElementById('markersLayer');
    const tracklistDiv = document.getElementById('tracklist');
    
    let currentTrackIndex = -1;
    
    function formatTime(sec) {
        if (isNaN(sec)) return '00:00';
        const m = Math.floor(sec / 60);
        const s = Math.floor(sec % 60);
        return m + ':' + s.toString().padStart(2,'0');
    }
    
    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, m => m === '&' ? '&amp;' : (m === '<' ? '&lt;' : '&gt;'));
    }
    
    function updateMarkers() {
        if (!audio.duration) return;
        markersLayer.innerHTML = '';
        tracks.forEach(track => {
            const pct = (track.seconds / audio.duration) * 100;
            if (pct > 100) return;
            const marker = document.createElement('div');
            marker.className = 'marker';
            marker.style.left = pct + '%';
            marker.title = track.artist + ' - ' + track.title;
            marker.onclick = (e) => { e.stopPropagation(); window.open(track.url, '_blank'); };
            markersLayer.appendChild(marker);
        });
    }
    
    function updateNowPlaying() {
        let activeIndex = -1;
        for (let i = 0; i < tracks.length; i++) {
            if (audio.currentTime >= tracks[i].seconds) activeIndex = i;
            else break;
        }
        if (activeIndex !== currentTrackIndex) {
            currentTrackIndex = activeIndex;
            document.querySelectorAll('.tracklist-item').forEach((item, idx) => {
                item.classList.toggle('active', idx === activeIndex);
            });
            if (activeIndex >= 0) {
                nowTitle.textContent = tracks[activeIndex].title;
                nowArtist.textContent = tracks[activeIndex].artist;
                document.querySelectorAll('.tracklist-item')[activeIndex]?.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            } else {
                nowTitle.textContent = '--';
                nowArtist.textContent = '--';
            }
        }
    }
    
    function buildTracklist() {
        tracklistDiv.innerHTML = '';
        tracks.forEach((track, idx) => {
            const div = document.createElement('div');
            div.className = 'tracklist-item';
            div.onclick = () => window.open(track.url, '_blank');
            div.innerHTML = `
                <img class="track-thumb" src="${track.thumbnail}" onerror="this.style.display='none'">
                <div class="track-info">
                    <div class="track-artist">${escapeHtml(track.artist)}</div>
                    <div class="track-title">${escapeHtml(track.title)}</div>
                </div>
                <div class="track-time">${track.timestamp}</div>
                <a href="${track.url}" target="_blank" class="track-link" onclick="event.stopPropagation()">🎬</a>
            `;
            tracklistDiv.appendChild(div);
        });
    }
    
    function updateProgress() {
        if (audio.duration) {
            progressFill.style.width = (audio.currentTime / audio.duration) * 100 + '%';
            updateNowPlaying();
        }
        currentTimeSpan.textContent = formatTime(audio.currentTime);
        if (audio.duration) durationSpan.textContent = formatTime(audio.duration);
    }
    
    function setProgress(e) {
        const rect = progressBar.getBoundingClientRect();
        const pct = (e.clientX - rect.left) / rect.width;
        audio.currentTime = pct * audio.duration;
    }
    
    playBtn.onclick = () => audio.play();
    pauseBtn.onclick = () => audio.pause();
    progressBar.onclick = setProgress;
    volumeSlider.oninput = () => {
        audio.volume = volumeSlider.value / 100;
        volumePercent.textContent = volumeSlider.value + '%';
    };
    
    audio.volume = 0.7;
    audio.addEventListener('timeupdate', updateProgress);
    audio.addEventListener('loadedmetadata', () => {
        durationSpan.textContent = formatTime(audio.duration);
        updateMarkers();
    });
    
    document.getElementById('whatsappBtn').onclick = (e) => {
        e.preventDefault();
        window.open('https://wa.me/?text=' + encodeURIComponent('Sarferprod Daily Mix - ' + GITHUB_URL), '_blank');
    };
    document.getElementById('emailBtn').onclick = (e) => {
        e.preventDefault();
        window.location.href = 'mailto:?subject=Sarferprod Daily Mix&body=' + encodeURIComponent('Ecoute mon mix : ' + GITHUB_URL);
    };
    document.getElementById('copyBtn').onclick = (e) => {
        e.preventDefault();
        navigator.clipboard.writeText(GITHUB_URL);
        const btn = document.getElementById('copyBtn');
        btn.textContent = 'Copie !';
        setTimeout(() => btn.textContent = 'Copier le lien', 2000);
    };
    
    buildTracklist();
</script>
</body>
</html>
