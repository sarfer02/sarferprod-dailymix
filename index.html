<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <title>SARFERPROD • Daily Mix</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: radial-gradient(ellipse at 50% 40%, #d9d0c3, #b8ad9c 70%, #8f8676);
            font-family: 'Inter', sans-serif; min-height: 100vh;
            display: flex; justify-content: center; align-items: center; padding: 24px 12px;
        }
        .stage { max-width: 1280px; width: 100%; }

        /* ── LA CONSOLE = L'IMAGE (ratio 16:9) ── */
        .console {
            position: relative; width: 100%; aspect-ratio: 16 / 9;
            background-image: url('assets_vintage/panel_full.png');
            background-size: 100% 100%; border-radius: 14px;
            box-shadow: 0 24px 60px rgba(40,25,5,.45), 0 4px 14px rgba(40,25,5,.35);
            overflow: hidden;
        }

        /* ── LCD VIVANT : marquee dans l'écran de l'image (V14) ── */
        .lcd-live {
            position: absolute; left: 25.8%; top: 16.4%; width: 18.8%; height: 13.3%;
            border-radius: 10px; overflow: hidden;
            background-color: #030a0d;
            display: flex; align-items: center;
        }
        .lcd-live::before {
            content: ''; position: absolute; inset: 0; pointer-events: none; z-index: 2;
            background: repeating-linear-gradient(0deg, rgba(0,0,0,.22) 0 1px, transparent 1px 3px),
                        linear-gradient(115deg, rgba(255,255,255,.14) 0%, transparent 30%, transparent 70%, rgba(255,255,255,.07) 100%);
        }
        .marquee-track { width: 100%; overflow: hidden; white-space: nowrap; position: relative; z-index: 1; }
        .marquee-track span {
            display: inline-block; padding-left: 100%; animation: scrollTrack 13s linear infinite;
            font-family: 'Courier New', monospace; font-size: .72rem; font-weight: bold; letter-spacing: 2px;
            color: #54e4ff; text-shadow: 0 0 6px rgba(53,224,255,.95), 0 0 16px rgba(53,224,255,.55);
        }
        @keyframes scrollTrack { 0% { transform: translateX(0); } 100% { transform: translateX(-100%); } }

        /* ── WAVEFORM VIVANTE + REGLE GRADUEE (V14 : descend au bas réel de l'écran) ── */
        .wave-live {
            position: absolute; left: 7.5%; top: 33.5%; width: 39.5%; height: 12.7%;
            border-radius: 10px; overflow: hidden; cursor: pointer;
        }
        .wave-live canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
        /* Ligne de progression : posée SUR les tirets de la règle graduée de l'image */
        .wave-progress {
            position: absolute; left: 2%; right: 2%; bottom: 26%; height: 3px; border-radius: 2px;
            background: rgba(255,255,255,.10); cursor: pointer;
        }
        .wave-progress-fill {
            width: 0%; height: 100%; border-radius: 2px; pointer-events: none;
            background: linear-gradient(90deg, #1f9dff, #54e4ff); box-shadow: 0 0 8px rgba(53,224,255,.9);
        }
        .wave-times {
            position: absolute; left: 3%; right: 3%; bottom: 1%;
            display: flex; justify-content: space-between;
            font-family: 'Courier New', monospace; font-size: .5rem; color: rgba(111,230,255,.75);
        }
        .markers-layer { position: absolute; inset: 0; pointer-events: none; }
        /* Marqueurs de morceaux : s'élèvent DE la règle graduée, cliquables */
        .timeline-marker {
            position: absolute; bottom: 25%; width: 2px; height: 30%; background: #7ce8ff;
            transform: translateX(-50%); cursor: pointer; pointer-events: auto; opacity: .85;
            box-shadow: 0 0 5px #35e0ff; transition: opacity .2s, box-shadow .2s;
        }
        .timeline-marker:hover { opacity: 1; box-shadow: 0 0 10px #54e4ff, 0 0 18px #54e4ff; }
        .marker-thumb {
            position: absolute; bottom: 130%; left: 50%; transform: translateX(-50%) scale(.9);
            width: 84px; height: 52px; border-radius: 6px; background-size: cover; opacity: 0;
            pointer-events: none; border: 2px solid #35e0ff; transition: opacity .2s;
            box-shadow: 0 4px 14px rgba(0,0,0,.6);
        }
        .timeline-marker:hover .marker-thumb { opacity: 1; }

        /* ── PLATINE VIVANTE (V14) : disque qui tourne + ETIQUETTE YouTube ── */
        .disc-zone {
            position: absolute; left: 15.2%; top: 53.5%; width: 21.3%; height: 37.0%;
        }
        .turntable-disc {
            position: absolute; inset: 0; border-radius: 50%; overflow: hidden;
            animation: spin 3.6s linear infinite; animation-play-state: paused;
            will-change: transform;
        }
        body.playing .turntable-disc { animation-play-state: running; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .turntable-disc img { width: 100%; height: 100%; object-fit: cover; display: block; border-radius: 50%; }
        /* ÉTIQUETTE VINYLE : la miniature YouTube du morceau en cours tourne avec le disque */
        .disc-label {
            position: absolute; top: 50%; left: 50%; width: 38%; height: 38%;
            transform: translate(-50%,-50%); border-radius: 50%;
            background-size: cover; background-position: center; background-color: #140d06;
            border: 3px solid rgba(212,175,55,.9);
            box-shadow: 0 0 14px rgba(0,0,0,.75), inset 0 0 12px rgba(0,0,0,.45);
        }
        .disc-label::after {
            content: ''; position: absolute; inset: 0; border-radius: 50%; pointer-events: none;
            background: linear-gradient(115deg, rgba(255,255,255,.25) 0%, transparent 40%, transparent 75%, rgba(255,255,255,.08) 100%);
        }
        /* Trou d'axe au centre de l'étiquette */
        .disc-spindle {
            position: absolute; top: 50%; left: 50%; width: 4.5%; height: 4.5%;
            transform: translate(-50%,-50%); border-radius: 50%; z-index: 3; pointer-events: none;
            background: radial-gradient(circle at 35% 30%, #ffe9b0, #c9a13b 55%, #6e5a2a);
            box-shadow: 0 0 6px rgba(255,220,120,.8);
        }

        /* ── ANNEAU DE LEDs autour du disque ── */
        .led-ring { position: absolute; inset: -5.5%; pointer-events: none; }
        .led-ring .ring-led {
            position: absolute; top: 50%; left: 50%;
            width: clamp(4px, .55vw, 9px); height: clamp(4px, .55vw, 9px); border-radius: 50%;
            background: rgba(255,255,255,.07);
            transform: translate(-50%,-50%) rotate(var(--a)) translateY(-53%);
            transition: background .09s linear, box-shadow .09s linear;
        }
        .led-ring .ring-led.on {
            background: var(--c);
            box-shadow: 0 0 6px var(--c), 0 0 14px var(--c), 0 0 24px var(--c);
        }

        /* ── HOTSPOTS : les boutons DE L'IMAGE deviennent cliquables ── */
        .hotspot {
            position: absolute; left: var(--l); top: var(--t); width: var(--w); height: var(--h);
            background: transparent; border: none; border-radius: 50%; cursor: pointer; padding: 0;
            transition: box-shadow .2s;
        }
        .hotspot:hover { box-shadow: 0 0 18px rgba(120,200,255,.85), 0 0 34px rgba(120,200,255,.45); }
        .hotspot.lit { box-shadow: 0 0 14px rgba(120,200,255,.6), inset 0 0 10px rgba(120,200,255,.35); }

        /* ── VOLUME : le fader vertical DE L'IMAGE (V14) ── */
        .vol-zone {
            position: absolute; left: 41.3%; top: 66.0%; width: 2.6%; height: 18.5%;
            cursor: pointer; touch-action: none;
        }
        .vol-fill {
            position: absolute; left: 32%; bottom: 4%; width: 36%;
            height: 70%; border-radius: 3px; pointer-events: none;
            background: linear-gradient(180deg, #7ce8ff, #1f9dff); box-shadow: 0 0 8px rgba(53,224,255,.85);
        }
        .vol-knob {
            position: absolute; left: -60%; width: 220%; height: 6%;
            top: 26%; border-radius: 3px; pointer-events: none;
            background: linear-gradient(180deg,#efe9dd,#7a6650 60%,#4a3b2c);
            border: 1px solid rgba(0,0,0,.6); box-shadow: 0 0 6px rgba(0,0,0,.8);
        }
        .vol-pct {
            position: absolute; left: 108%; top: 50%; transform: translateY(-50%);
            font-family: 'Courier New', monospace; font-size: .55rem; color: #7ce8ff;
            text-shadow: 0 0 5px rgba(53,224,255,.8);
        }

        /* ── CROSSFADER : balance L/R sur le fader horizontal DE L'IMAGE (V14) ── */
        .cross-zone {
            position: absolute; left: 7.0%; top: 83.3%; width: 10.6%; height: 6.3%;
            cursor: pointer; touch-action: none;
        }
        .cross-knob {
            position: absolute; left: 50%; top: 50%; width: 7%; height: 130%;
            transform: translate(-50%,-50%); border-radius: 3px; pointer-events: none;
            background: linear-gradient(180deg,#efe9dd,#7a6650 60%,#4a3b2c);
            border: 1px solid rgba(0,0,0,.6);
            box-shadow: 0 0 8px rgba(53,224,255,.7), 0 2px 6px rgba(0,0,0,.7);
        }

        /* ── PLAYLIST VIVANTE dans le panneau de l'image (V14) ── */
        .playlist-zone {
            position: absolute; left: 52.8%; top: 11.5%; width: 44.2%; height: 84.2%;
            display: flex; flex-direction: column;
            background: rgba(24,15,6,.82); backdrop-filter: blur(5px);
            border-radius: 16px; border: 1px solid rgba(212,175,55,.35);
            box-shadow: inset 0 0 24px rgba(0,0,0,.55);
            padding: 10px 12px 12px;
        }
        .playlist-head {
            text-align: center; font-family: 'Georgia', serif; font-size: clamp(.8rem, 1.4vw, 1.15rem);
            letter-spacing: 5px; color: #f0d48a; text-transform: uppercase;
            border-bottom: 1px solid rgba(212,175,55,.6); padding-bottom: 7px; margin-bottom: 9px;
            text-shadow: 0 0 12px rgba(212,175,55,.6);
        }
        .tracklist-grid { flex: 1; overflow-y: auto; display: grid; gap: 7px; align-content: start; padding-right: 4px; }
        .tracklist-grid::-webkit-scrollbar { width: 6px; }
        .tracklist-grid::-webkit-scrollbar-track { background: rgba(0,0,0,.35); border-radius: 3px; }
        .tracklist-grid::-webkit-scrollbar-thumb { background: rgba(201,161,59,.6); border-radius: 3px; }
        .track-row {
            display: flex; align-items: center; gap: 10px; padding: 6px 10px 6px 6px;
            background: rgba(10,6,2,.55); border: 1px solid rgba(212,175,55,.22); border-radius: 10px;
            transition: transform .2s ease, background .2s ease;
        }
        .track-row:hover { transform: translateX(4px); background: rgba(53,224,255,.08); }
        .track-row.active { background: rgba(53,224,255,.14); border-left: 3px solid #54e4ff; box-shadow: 0 0 10px rgba(53,224,255,.25); }
        .track-index {
            font-family: 'Courier New', monospace; font-size: .6rem; color: #6fe6ff;
            width: 20px; text-align: center; flex-shrink: 0; text-shadow: 0 0 5px rgba(53,224,255,.7);
        }
        .track-vignette-link { text-decoration: none; flex-shrink: 0; }
        .track-vignette {
            position: relative; width: clamp(44px, 5.6vw, 64px); height: clamp(32px, 4vw, 46px); border-radius: 5px;
            background-size: cover; background-position: center; cursor: pointer; transition: all .2s;
            border: 2px solid rgba(201,161,59,.85); box-shadow: inset 0 0 8px rgba(0,0,0,.6);
        }
        .track-vignette::after {
            content: ''; position: absolute; inset: 0; border-radius: 3px; pointer-events: none;
            background: linear-gradient(115deg, rgba(255,255,255,.22) 0%, transparent 35%, transparent 70%, rgba(255,255,255,.07) 100%);
        }
        .track-vignette-link:hover .track-vignette { transform: scale(1.07); box-shadow: 0 0 12px rgba(53,224,255,.75); }
        .track-details { flex: 1; cursor: pointer; min-width: 0; }
        .track-artist-name { font-weight: 600; color: #ffcf7d; font-size: clamp(.55rem, .95vw, .8rem); text-shadow: 0 0 5px rgba(255,166,43,.4); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .track-song-title { font-style: italic; color: rgba(242,226,196,.7); font-size: clamp(.5rem, .85vw, .72rem); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .track-duration { font-family: 'Courier New', monospace; font-size: .6rem; color: #6fe6ff; flex-shrink: 0; }

        .under-console { text-align: center; margin-top: 14px; }
        .copy-btn {
            background: rgba(28,18,8,.75); border: 1px solid rgba(212,175,55,.6); border-radius: 30px;
            color: #ffe9b0; font-family: 'Courier New', monospace; font-size: .72rem;
            padding: 7px 22px; cursor: pointer; text-shadow: 0 0 6px rgba(255,233,176,.4); transition: all .25s;
        }
        .copy-btn:hover { color: #7ce8ff; border-color: #35e0ff; box-shadow: 0 0 14px rgba(53,224,255,.45); }
    </style>
</head>
<body>

        <div class="wave-live" id="waveZone">
            <canvas id="waveformCanvas"></canvas>
            <div class="markers-layer" id="markersLayer"></div>
            <div class="wave-progress" id="progressBar"><div class="wave-progress-fill" id="progressFill"></div></div>
            <div class="wave-times"><span id="currentTime">00:00</span><span id="duration">7:51</span></div>
        </div>

        <div class="disc-zone">

        <div class="cross-zone" id="crossZone" title="Balance L/R">
            <div class="cross-knob" id="crossKnob"></div>
        </div>

        <a class="hotspot" id="waBtn" style="--l:21.0%; --t:44.0%; --w:3.0%; --h:5.7%; border-radius:6px;" title="WhatsApp"></a>
        <a class="hotspot" id="scBtn" style="--l:24.2%; --t:44.0%; --w:2.7%; --h:5.7%; border-radius:6px;" title="SoundCloud"></a>
        <a class="hotspot" id="mailBtn" style="--l:27.1%; --t:44.0%; --w:2.7%; --h:5.7%; border-radius:6px;" title="Email"></a>
        <a class="hotspot" id="fbBtn" style="--l:30.0%; --t:44.0%; --w:3.2%; --h:5.7%; border-radius:6px;" title="Facebook"></a>

        <div class="playlist-zone">
            <div class="playlist-head">Tracklist</div>
            <div class="tracklist-grid" id="tracklistGrid"></div>
        </div>
    </div>
    <div class="under-console"><button class="copy-btn" id="copyBtn">Copier le lien du mix</button></div>
</div>
<audio id="audio" preload="auto" crossorigin="anonymous"></audio>

thumbnail": "https://i.ytimg.com/vi/R4Af5fwS4AE/hqdefault.jpg"}, {"timestamp": "04:47", "seconds": 287.3, "artist": "Helado Tropical", "title": "Fluye (Live on KEXP)", "url": "https://www.youtube.com/watch?v=lUbzwb80sd8", "thumbnail": "https://i.ytimg.com/vi/lUbzwb80sd8/hqdefault.jpg"}, {"timestamp": "05:15", "seconds": 315.8, "artist": "Hamdi & D Double E", "title": "Heart & Soul", "url": "https://www.youtube.com/watch?v=TuE1-tyb2Fs", "thumbnail": "https://i.ytimg.com/vi/TuE1-tyb2Fs/hqdefault.jpg"}, {"timestamp": "05:44", "seconds": 344.3, "artist": "KEXP", "title": "Helado Tropical performs \"Tocando\" & more Live on ", "url": "https://www.youtube.com/watch?v=p0xEdSGVYQk", "thumbnail": "https://i.ytimg.com/vi/p0xEdSGVYQk/hqdefault.jpg"}, {"timestamp": "05:58", "seconds": 358.3, "artist": "Criminal Issues", "title": "Run For Cover", "url": "https://www.youtube.com/watch?v=-ZSoSaeoK-g", "thumbnail": "https://i.ytimg.com/vi/-ZSoSaeoK-g/hqdefault.jpg"}, {"timestamp": "06:26", "seconds": 386.8, "artist": "Helado Tropical", "title": "Tocando (Live on KEXP)", "url": "https://www.youtube.com/watch?v=oFxaH-mKRgg", "thumbnail": "https://i.ytimg.com/vi/oFxaH-mKRgg/hqdefault.jpg"}, {"timestamp": "06:55", "seconds": 415.3, "artist": "Computerwife", "title": "You Didn't Know", "url": "https://www.youtube.com/watch?v=xrB2GamOmXw", "thumbnail": "https://i.ytimg.com/vi/xrB2GamOmXw/hqdefault.jpg"}];
    const PAGE_URL = 'https://sarfer02.github.io/sarferprod-dailymix';
    const audio = document.getElementById('audio');
    audio.src = './latest.mp3?v=' + Date.now();
    audio.volume = 0.7;
    const playBtn = document.getElementById('playBtn');
    const pauseBtn = document.getElementById('pauseBtn');
    const marqueeSpan = document.getElementById('marqueeText');
    const currentTimeSpan = document.getElementById('currentTime');
    const progressFill = document.getElementById('progressFill');
    const tracklistGrid = document.getElementById('tracklistGrid');
    const markersLayer = document.getElementById('markersLayer');
    const discLabel = document.getElementById('discLabel');
    const volZone = document.getElementById('volZone');
    const volFill = document.getElementById('volFill');
    const volKnob = document.getElementById('volKnob');
    const volumePercent = document.getElementById('volumePercent');
    const crossZone = document.getElementById('crossZone');
    const crossKnob = document.getElementById('crossKnob');
    const totalDurationSec = 471.544;
    let currentTrackIndex = -1;

    function formatTime(sec) {
        if(isNaN(sec)) return '00:00';
        const m = Math.floor(sec / 60); const s = Math.floor(sec % 60);
        return m + ':' + s.toString().padStart(2,'0');
    }

    function updateProgress() {
        if (audio.duration) {
            progressFill.style.width = (audio.currentTime / audio.duration * 100) + '%';
            let activeIndex = -1;
            for (let i = 0; i < tracks.length; i++) {
                if (audio.currentTime >= tracks[i].seconds - 0.5) activeIndex = i;
            }
            if (activeIndex !== currentTrackIndex && activeIndex !== -1) {
                currentTrackIndex = activeIndex;
                document.querySelectorAll('.track-row').forEach((r, idx) => {
                    if(idx === activeIndex) r.classList.add('active'); else r.classList.remove('active');
                });
                marqueeSpan.textContent = tracks[activeIndex].artist + ' --- ' + tracks[activeIndex].title;
                discLabel.style.backgroundImage = "url('" + tracks[activeIndex].thumbnail + "')";
            }
        }
        currentTimeSpan.textContent = formatTime(audio.currentTime);
    }

    function startPlaying() {
        initAudioContext(); audio.play();
        document.body.classList.add('playing');
        playBtn.classList.add('lit');
    }
    function stopPlaying() {
        audio.pause();
        document.body.classList.remove('playing');
        playBtn.classList.remove('lit');
    }

    playBtn.addEventListener('click', startPlaying);
    pauseBtn.addEventListener('click', stopPlaying);
    document.querySelectorAll('.track-details').forEach(d => d.addEventListener('click', (e) => {
        audio.currentTime = parseFloat(e.currentTarget.dataset.seconds);
        startPlaying();
    }));
    audio.addEventListener('timeupdate', updateProgress);
    audio.addEventListener('ended', stopPlaying);

    /* Volume : glisser sur le fader vertical de l'image */
    let volDragging = false;
    function setVolume(e) {
        const r = volZone.getBoundingClientRect();
        let v = 1 - (e.clientY - r.top) / r.height;
        v = Math.max(0, Math.min(1, v));
        audio.volume = v;
        volFill.style.height = (v * 92) + '%';
        volKnob.style.top = ((1 - v) * 93) + '%';
        volumePercent.textContent = Math.round(v * 100);
    }
    volZone.addEventListener('pointerdown', e => { volDragging = true; volZone.setPointerCapture(e.pointerId); setVolume(e); });
    volZone.addEventListener('pointermove', e => { if (volDragging) setVolume(e); });
    volZone.addEventListener('pointerup', () => volDragging = false);

    /* Crossfader : balance gauche/droite sur le fader horizontal de l'image */
    let panNode = null, crossDragging = false;
    function setPan(e) {
        const r = crossZone.getBoundingClientRect();
        let p = (e.clientX - r.left) / r.width;
        p = Math.max(0, Math.min(1, p));
        crossKnob.style.left = (p * 100) + '%';
        if (panNode) panNode.pan.value = (p - 0.5) * 2;
    }
    crossZone.addEventListener('pointerdown', e => { crossDragging = true; crossZone.setPointerCapture(e.pointerId); setPan(e); });
    crossZone.addEventListener('pointermove', e => { if (crossDragging) setPan(e); });
    crossZone.addEventListener('pointerup', () => crossDragging = false);

    /* Seek : clic dans l'écran waveform (règle graduée incluse) */
    const waveZone = document.getElementById('waveZone');
    waveZone.addEventListener('click', (e) => {
        if (e.target.closest('.timeline-marker')) return;
        const r = waveZone.getBoundingClientRect();
        const percent = (e.clientX - r.left) / r.width;
        if (audio.duration) audio.currentTime = percent * audio.duration;
        else if (totalDurationSec) audio.currentTime = percent * totalDurationSec;
    });

    let audioCtx, analyser, dataArray, sourceNode;
    function initAudioContext() {
        if (!audioCtx) {
            try {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                analyser = audioCtx.createAnalyser(); analyser.fftSize = 256;
                dataArray = new Uint8Array(analyser.frequencyBinCount);
                sourceNode = audioCtx.createMediaElementSource(audio);
                panNode = audioCtx.createStereoPanner();
                sourceNode.connect(panNode); panNode.connect(analyser); analyser.connect(audioCtx.destination);
            } catch (e) { console.warn("AudioContext bloqué", e); }
        }
    }

    /* ── ANNEAU DE LEDs : bleu foncé → bleu → bleu clair → bleu-vert ── */
    const LED_COLORS = [
        '#0b2a7a', '#10359c', '#1543c4', '#1a55e8',
        '#2e6bff', '#3f82ff', '#549aff', '#6fb0ff',
        '#8ec5ff', '#a9d8ff', '#c2e8ff', '#7cf5e8',
        '#4dffd2', '#2fffc4', '#18f5b5', '#00e8a8'
    ];
    const ledRing = document.getElementById('ledRing');
    const ringLeds = [];
    LED_COLORS.forEach((c, i) => {
        const led = document.createElement('div');
        led.className = 'ring-led';
        led.style.setProperty('--a', (i / LED_COLORS.length * 360) + 'deg');
        led.style.setProperty('--c', c);
        ledRing.appendChild(led);
        ringLeds.push(led);
    });
    let ledLevel = 0, targetLevel = 0;
    function updateLeds() {
        ledLevel += (targetLevel - ledLevel) * 0.22;
        const active = Math.round(ledLevel * ringLeds.length);
        ringLeds.forEach((led, i) => led.classList.toggle('on', i < active));
    }

    const waveCanvas = document.getElementById('waveformCanvas');
    const waveCtx = waveCanvas.getContext('2d');
    let wavePhase = 0, particles = [];

    function resizeWaveCanvas() {
        const rect = waveCanvas.getBoundingClientRect();
        waveCanvas.width = rect.width; waveCanvas.height = rect.height;
    }
    window.addEventListener('resize', resizeWaveCanvas);
    setTimeout(resizeWaveCanvas, 60);

    function spawnParticle(x, y) {
        particles.push({ x: x, y: y, vx: (Math.random() - 0.5) * 2, vy: -Math.random() * 2 - 0.5,
            life: 1.0, size: Math.random() * 2 + 1, color: Math.random() > 0.4 ? '#54e4ff' : '#ffb054' });
    }

    function animateWave() {
        const w = waveCanvas.width, h = waveCanvas.height, mid = h / 2;
        waveCtx.clearRect(0, 0, w, h);
        let bass = 0, midFreq = 0, treble = 0;
        if (!audio.paused && analyser) {
            analyser.getByteFrequencyData(dataArray);
            let bassSum = 0; for(let i=0; i<5; i++) bassSum += dataArray[i]; bass = (bassSum/5)/255;
            let midSum = 0; for(let i=5; i<20; i++) midSum += dataArray[i]; midFreq = (midSum/15)/255;
            let trebSum = 0; for(let i=20; i<60; i++) trebSum += dataArray[i]; treble = (trebSum/40)/255;
            if (bass > 0.5 && Math.random() > 0.5) {
                for(let i=0; i<2; i++) spawnParticle(Math.random() * w, mid + (Math.random() - 0.5) * 12);
            }
            targetLevel = Math.min(1, bass * 0.55 + midFreq * 0.3 + treble * 0.15 + 0.06);
        } else {
            targetLevel = 0;
        }
        updateLeds();

        const t = Date.now() * 0.001;
        const lfo1 = Math.sin(t * 2.1) * 0.5 + 0.5; const lfo2 = Math.cos(t * 1.3) * 0.5 + 0.5;
        const ampBass = (h * 0.08) + (bass * h * 0.42) * (1 + 0.3 * lfo1);
        const ampMid = (h * 0.05) + (midFreq * h * 0.26) * (1 + 0.4 * lfo2);
        const ampTreble = (h * 0.03) + (treble * h * 0.11) * (1 + 0.6 * lfo1);

        function drawWaveDynamic(freq, amp, phase, speed, color, glowAmount) {
            waveCtx.beginPath(); waveCtx.lineWidth = 1.5; waveCtx.strokeStyle = color; waveCtx.shadowColor = color; waveCtx.shadowBlur = glowAmount;
            for (let x = 0; x <= w; x += 2) {
                const dyn_phase = Math.sin(x * 0.01 + t * speed * 2) * 4;
                const y = mid + Math.sin((x * freq) + (wavePhase * speed) + phase + dyn_phase) * amp;
                if (x === 0) waveCtx.moveTo(x, y); else waveCtx.lineTo(x, y);
            }
            waveCtx.stroke();
        }

        drawWaveDynamic(0.015, ampBass, 0, 1, '#54e4ff', 12 + bass * 35);
        drawWaveDynamic(0.035, ampMid, Math.PI / 3, -1.2, '#ffb054', 8 + midFreq * 25);
        drawWaveDynamic(0.08, ampTreble, Math.PI / 1.5, 1.8, '#ffffff', 4 + treble * 16);

        particles.forEach((p, i) => {
            p.x += p.vx; p.y += p.vy; p.life -= 0.02;
            if (p.life <= 0) { particles.splice(i, 1); return; }
            waveCtx.globalAlpha = p.life; waveCtx.fillStyle = p.color; waveCtx.shadowColor = p.color; waveCtx.shadowBlur = 8;
            waveCtx.beginPath(); waveCtx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2); waveCtx.fill();
        });
        waveCtx.globalAlpha = 1.0; waveCtx.shadowBlur = 0;
        wavePhase += 0.05;
        requestAnimationFrame(animateWave);
    }
    animateWave();

    tracks.forEach((track, i) => {
        const row = document.createElement('div'); row.className = 'track-row';
        const indexDiv = document.createElement('div'); indexDiv.className = 'track-index';
        indexDiv.textContent = String(i + 1).padStart(2, '0');
        const vignetteLink = document.createElement('a'); vignetteLink.className = 'track-vignette-link';
        vignetteLink.href = track.url; vignetteLink.target = '_blank'; vignetteLink.rel = 'noopener';
        vignetteLink.innerHTML = `<div class="track-vignette" style="background-image:url(${track.thumbnail})"></div>`;
        const detailsDiv = document.createElement('div'); detailsDiv.className = 'track-details';
        detailsDiv.dataset.seconds = track.seconds;
        detailsDiv.innerHTML = `<div class="track-artist-name">${track.artist}</div><div class="track-song-title">${track.title}</div>`;
        const durationDiv = document.createElement('div'); durationDiv.className = 'track-duration';
        durationDiv.textContent = `${track.timestamp}`;
        row.appendChild(indexDiv); row.appendChild(vignetteLink); row.appendChild(detailsDiv); row.appendChild(durationDiv);
        tracklistGrid.appendChild(row);
    });

    tracks.forEach((track) => {
        const marker = document.createElement('a'); marker.className = 'timeline-marker';
        marker.href = track.url; marker.target = '_blank'; marker.rel = 'noopener';
        marker.style.left = (track.seconds / totalDurationSec * 100) + '%';
        marker.title = track.artist + ' — ' + track.title;
        marker.innerHTML = `<div class="marker-thumb" style="background-image:url(${track.thumbnail})"></div>`;
        markersLayer.appendChild(marker);
    });

    document.getElementById('waBtn').addEventListener('click', () => window.open('https://wa.me/?text=' + encodeURIComponent('Sarferprod Daily Mix -> ' + PAGE_URL), '_blank'));
    document.getElementById('scBtn').addEventListener('click', () => window.open('https://soundcloud.com/', '_blank'));
    document.getElementById('mailBtn').addEventListener('click', () => { location.href = 'mailto:?subject=' + encodeURIComponent('Sarferprod Daily Mix') + '&body=' + encodeURIComponent(PAGE_URL); });
    document.getElementById('fbBtn').addEventListener('click', () => window.open('https://www.facebook.com/sharer/sharer.php?u=' + encodeURIComponent(PAGE_URL), '_blank'));
    document.getElementById('copyBtn').addEventListener('click', () => navigator.clipboard.writeText(PAGE_URL));
</script>
</body>
