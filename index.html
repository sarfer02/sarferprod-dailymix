  if(!markersBuilt)buildMarkers(dur);
  const pct=(aud.currentTime/dur)*100;
  pfill.style.width=pct+'%';pthumb.style.left=pct+'%';

function updateTrack(t){
  let idx=-1;
  for(let i=0;i<TRACKS.length;i++){if(t>=TRACKS[i].timestamp_seconds)idx=i}

  // Pendant l'intro (avant le 1er morceau) ou l'outro (après le dernier)
  const isIntroOutro = (TRACKS.length===0) ||
                       (t < TRACKS[0].timestamp_seconds) ||
                       (OUTRO_START > 0 && t >= OUTRO_START);

  if(isIntroOutro){
    if(curIdx !== -99){
      curIdx=-99;
      npImg.src=LOGO;
      npLink.href=SOUNDCLOUD_URL;
      npArt.textContent='Sarferprod';
      npTit.textContent= t < (TRACKS[0]?.timestamp_seconds||999) ? '— Intro —' : '— Outro —';
      document.querySelectorAll('#tBody tr').forEach(r=>r.classList.remove('act'));
    }
    return;
  }

  if(idx!==curIdx){
    curIdx=idx;
    if(idx>=0){
      npImg.src=TRACKS[idx].thumbnail;
      npLink.href=TRACKS[idx].url;
      npArt.textContent=TRACKS[idx].artist;
      npTit.textContent=TRACKS[idx].title;
    }
    document.querySelectorAll('#tBody tr').forEach((r,i)=>r.classList.toggle('act',i===idx));
    const rows=document.querySelectorAll('#tBody tr');
    if(rows[idx])rows[idx].scrollIntoView({behavior:'smooth',block:'nearest'});
  }
}

TRACKS.forEach(t=>{
  const tr=document.createElement('tr');
  tr.innerHTML=`<td class="c-t">${esc(t.timestamp)}</td><td class="c-a">${esc(t.artist)}</td><td class="c-ti">${esc(t.title)}</td><td class="c-l"><a onclick="window.open('${esc(t.url)}','_blank');return false;" href="#">▶ YouTube</a></td>`;
  tBody.appendChild(tr);
});

// ── Repères : construits seulement après que audio.duration est connu et fini ──
function buildMarkers(dur){
  if(markersBuilt||!dur||!isFinite(dur))return;
  markersBuilt=true;
  pArea.querySelectorAll('.mk').forEach(m=>m.remove());
  TRACKS.forEach(t=>{
    if(t.timestamp_seconds<=0)return;
    const pct=(t.timestamp_seconds/dur)*100;
    if(pct>=99.5)return; // trop proche de la fin
    const mk=document.createElement('div');
    mk.className='mk';
    mk.style.left=pct+'%';
    mk.innerHTML=`<div class="tip"><img src="${t.thumbnail}" loading="lazy" alt=""><div class="tip-art">${esc(t.artist)}</div><div class="tip-tit">${esc(t.title)}</div><div class="tip-hint">clic → ouvre YouTube</div></div>`;
    mk.addEventListener('click',()=>{
      mk.classList.remove('vib');void mk.offsetWidth;mk.classList.add('vib');
      aud.currentTime=t.timestamp_seconds;
      if(aud.paused)aud.play();
      setTimeout(()=>window.open(t.url,'_blank'),380);
    });
    pArea.appendChild(mk);
  });
}

// ── Spectrogramme ─────────────────────────────────────────────────────────────
function resizeCV(){cv.width=cv.offsetWidth*(window.devicePixelRatio||1);cv.height=88*(window.devicePixelRatio||1);cv.style.width='100%';cv.style.height='88px'}

function startSpectro(){
  if(!audioCtx){
    try{
      audioCtx=new(window.AudioContext||window.webkitAudioContext)();
      analyser=audioCtx.createAnalyser();analyser.fftSize=512;
      dataArr=new Uint8Array(analyser.frequencyBinCount);
      const src=audioCtx.createMediaElementSource(aud);
      src.connect(analyser);analyser.connect(audioCtx.destination);
    }catch(e){fakeDraw();return}
  }
  resizeCV();
  function draw(){
    if(aud.paused)return;
    analyser.getByteFrequencyData(dataArr);
    const W=cv.width,H=cv.height,dur=aud.duration||1;
    const sx=Math.floor(W*(aud.currentTime/dur));
    ctx.clearRect(0,0,W,H);
    const bW=W/dataArr.length;
    for(let i=0;i<dataArr.length;i++){
      const v=dataArr[i]/255,bH=Math.max(2,v*H),x=i*bW;
      const g=ctx.createLinearGradient(0,H-bH,0,H);
      if(x<=sx){g.addColorStop(0,`rgba(201,168,124,${.9*v+.1})`);g.addColorStop(1,`rgba(160,115,65,${.5*v+.05})`)}
      else{g.addColorStop(0,`rgba(185,175,160,${.5*v+.07})`);g.addColorStop(1,`rgba(155,145,130,${.3*v+.04})`)}
      ctx.fillStyle=g;ctx.fillRect(x,H-bH,Math.max(1,bW-.8),bH);
    }
    ctx.save();ctx.strokeStyle='rgba(201,168,124,.95)';ctx.lineWidth=2;ctx.shadowColor='rgba(201,168,124,.5)';ctx.shadowBlur=6;
    ctx.beginPath();ctx.moveTo(sx,0);ctx.lineTo(sx,H);ctx.stroke();ctx.restore();
    raf=requestAnimationFrame(draw);
  }
  cancelAnimationFrame(raf);draw();
}

function fakeDraw(){
  resizeCV();
  const bars=128;
  function draw(){
    fakeT+=.04;
    const W=cv.width,H=cv.height,dur=aud.duration||1;
    const sx=Math.floor(W*(aud.currentTime/dur));
    ctx.clearRect(0,0,W,H);
    const bW=W/bars;
    for(let i=0;i<bars;i++){
      const v=(Math.sin(i*.18+fakeT)*.4+.5)*(Math.sin(i*.07-fakeT*.6)*.3+.7);
      const bH=Math.max(2,v*H*.85),x=i*bW;
      const g=ctx.createLinearGradient(0,H-bH,0,H);
      if(x<=sx){g.addColorStop(0,`rgba(201,168,124,${.85*v+.1})`);g.addColorStop(1,`rgba(160,115,65,${.5*v+.05})`)}
      else{g.addColorStop(0,`rgba(185,175,160,${.5*v+.07})`);g.addColorStop(1,`rgba(155,145,130,${.28*v+.04})`)}
      ctx.fillStyle=g;ctx.fillRect(x,H-bH,Math.max(1,bW-.8),bH);
    }
    ctx.save();ctx.strokeStyle='rgba(201,168,124,.9)';ctx.lineWidth=2;
    ctx.beginPath();ctx.moveTo(sx,0);ctx.lineTo(sx,H);ctx.stroke();ctx.restore();
    raf=requestAnimationFrame(draw);
  }
  cancelAnimationFrame(raf);draw();
}
fakeDraw();
aud.addEventListener('play',()=>{cancelAnimationFrame(raf);startSpectro()});
</script>
