<script>
    const tracks = [{"timestamp": "00:30", "seconds": 30.8, "artist": "triple j", "title": "Porter Robinson is a master of sounds | Interview", "url": "https://www.youtube.com/watch?v=r6myB0q5x2c", "thumbnail": "https://i.ytimg.com/vi/r6myB0q5x2c/hqdefault.jpg"}, {"timestamp": "00:59", "seconds": 59.3, "artist": "Anjunadeep", "title": "Nothing like a 16BL set at a summer festival to ke", "url": "https://www.youtube.com/watch?v=5R9P6TCoKkM", "thumbnail": "https://i.ytimg.com/vi/5R9P6TCoKkM/hqdefault.jpg"}, {"timestamp": "01:13", "seconds": 73.3, "artist": "San Holo, Amanda Joy", "title": "IYKYK", "url": "https://www.youtube.com/watch?v=MJTMNLTjr18", "thumbnail": "https://i.ytimg.com/vi/MJTMNLTjr18/hqdefault.jpg"}, {"timestamp": "01:41", "seconds": 101.8, "artist": "Phantom Sugar", "title": "MOTOROLA RAZR", "url": "https://www.youtube.com/watch?v=72czBoVangQ", "thumbnail": "https://i.ytimg.com/vi/72czBoVangQ/hqdefault.jpg"}, {"timestamp": "02:10", "seconds": 130.3, "artist": "triple j", "title": "role model reveals who chuck timely is #interview ", "url": "https://www.youtube.com/watch?v=K4W1AeSV3dY", "thumbnail": "https://i.ytimg.com/vi/K4W1AeSV3dY/hqdefault.jpg"}, {"timestamp": "02:38", "seconds": 158.8, "artist": "total tommy", "title": "Winona Forever", "url": "https://www.youtube.com/watch?v=oUQTPDaPXPg", "thumbnail": "https://i.ytimg.com/vi/oUQTPDaPXPg/hqdefault.jpg"}, {"timestamp": "03:07", "seconds": 187.3, "artist": "Bloo Azul & Pep57", "title": "Check The Rhymes (Official Music Video)", "url": "https://www.youtube.com/watch?v=EUXTIy1Gy6A", "thumbnail": "https://i.ytimg.com/vi/EUXTIy1Gy6A/hqdefault.jpg"}, {"timestamp": "03:35", "seconds": 215.8, "artist": "Proyecto Samora", "title": "La Arranca\u00edlla\u00a0 | Sofar Gran Canaria", "url": "https://www.youtube.com/watch?v=48l4x6n2sSg", "thumbnail": "https://i.ytimg.com/vi/48l4x6n2sSg/hqdefault.jpg"}, {"timestamp": "04:04", "seconds": 244.3, "artist": "Toolroom Records", "title": "won\u2019t ever stop \ud83d\ude0e\u2764\ufe0f\u200d\ud83d\udd25", "url": "https://www.youtube.com/watch?v=0MVvN7TtFpk", "thumbnail": "https://i.ytimg.com/vi/0MVvN7TtFpk/hqdefault.jpg"}, {"timestamp": "04:18", "seconds": 258.3, "artist": "ALTE\u0301GO", "title": "CALL ME", "url": "https://www.youtube.com/watch?v=TRpwE7M3TOc", "thumbnail": "https://i.ytimg.com/vi/TRpwE7M3TOc/hqdefault.jpg"}, {"timestamp": "04:46", "seconds": 286.8, "artist": "Berklee College of Music", "title": "Can you guess what instrument they play from a pic", "url": "https://www.youtube.com/watch?v=lIqX1hrGkGk", "thumbnail": "https://i.ytimg.com/vi/lIqX1hrGkGk/hqdefault.jpg"}, {"timestamp": "05:00", "seconds": 300.8, "artist": "Spinnin' Records", "title": "\ud83d\udca5 \"Timebomb\" by @Blasterjaxx & @TheLucianaCaporaso", "url": "https://www.youtube.com/watch?v=CpzPhAy9NL8", "thumbnail": "https://i.ytimg.com/vi/CpzPhAy9NL8/hqdefault.jpg"}, {"timestamp": "05:14", "seconds": 314.8, "artist": "Lost Frequencies", "title": "Live It All", "url": "https://www.youtube.com/watch?v=04k6s5DQf-k", "thumbnail": "https://i.ytimg.com/vi/04k6s5DQf-k/hqdefault.jpg"}, {"timestamp": "05:43", "seconds": 343.3, "artist": "SEOXEN", "title": "Over And Over [Future Bass Release]", "url": "https://www.youtube.com/watch?v=K395ApcFx20", "thumbnail": "https://i.ytimg.com/vi/K395ApcFx20/hqdefault.jpg"}, {"timestamp": "06:11", "seconds": 371.8, "artist": "Adem Bogoceli", "title": "Wild Water (Official Visualizer)", "url": "https://www.youtube.com/watch?v=17LOVMCI5wQ", "thumbnail": "https://i.ytimg.com/vi/17LOVMCI5wQ/hqdefault.jpg"}, {"timestamp": "06:40", "seconds": 400.3, "artist": "Francisco", "title": "Only U", "url": "https://www.youtube.com/watch?v=1R1Uv_4ETUo", "thumbnail": "https://i.ytimg.com/vi/1R1Uv_4ETUo/hqdefault.jpg"}, {"timestamp": "07:08", "seconds": 428.8, "artist": "Bausa", "title": "Lose Myself (Extended Mix)", "url": "https://www.youtube.com/watch?v=Jm1a4qU3siQ", "thumbnail": "https://i.ytimg.com/vi/Jm1a4qU3siQ/hqdefault.jpg"}, {"timestamp": "07:37", "seconds": 457.3, "artist": "TWOPILOTS, Toby Rose", "title": "Billie Jean", "url": "https://www.youtube.com/watch?v=OeITtTAl_hU", "thumbnail": "https://i.ytimg.com/vi/OeITtTAl_hU/hqdefault.jpg"}];
    const audio = document.getElementById('audio');
    const playBtn = document.getElementById('playBtn');
    const pauseBtn = document.getElementById('pauseBtn');
    const volumeSlider = document.getElementById('volumeSlider');
    const volumePercent = document.getElementById('volumePercent');
    const marqueeSpan = document.getElementById('marqueeText');
    const currentTimeSpan = document.getElementById('currentTime');
    const durationSpan = document.getElementById('duration');
    const progressBar = document.getElementById('progressBar');
    const progressFill = document.getElementById('progressFill');
    const canvas = document.getElementById('waveformCanvas');
    const ctx = canvas.getContext('2d');
    const markersLayer = document.getElementById('markersLayer');
    const tracklistGrid = document.getElementById('tracklistGrid');
    
    let audioContext = null, analyser = null, source = null, animId = null;
    let currentTrackIndex = -1;
    
    function resizeCanvas() {
        canvas.width = canvas.parentElement.clientWidth - 30;
        canvas.height = 85;
        drawEmptyWaveform();
        setTimeout(updateMarkers, 100);
    }
    
    window.addEventListener('resize', resizeCanvas);
    setTimeout(resizeCanvas, 100);
    
    function formatTime(sec) {
        if (isNaN(sec) || !isFinite(sec)) return '00:00';
        const m = Math.floor(sec / 60);
        const s = Math.floor(sec % 60);
        return m + ':' + s.toString().padStart(2,'0');
    }
    
    function initAudioContext() {
        if (audioContext) return;
        try {
            audioContext = new (window.AudioContext || window.webkitAudioContext)();
            analyser = audioContext.createAnalyser();
            analyser.fftSize = 256;
            source = audioContext.createMediaElementSource(audio);
            source.connect(analyser);
            analyser.connect(audioContext.destination);
            visualize();
        } catch(e) {
            console.log('Web Audio API non supportee');
        }
    }
    
    function visualize() {
        if (!analyser) return;
        const dataArray = new Uint8Array(analyser.frequencyBinCount);
        function update() {
            if (!audio.paused && !audio.ended) {
                analyser.getByteFrequencyData(dataArray);
                drawSpectrogram(dataArray);
            }
            animId = requestAnimationFrame(update);
        }
        update();
    }
    
    function drawSpectrogram(dataArray) {
        const width = canvas.width, height = canvas.height;
        const bufferLength = dataArray.length;
        const barWidth = width / bufferLength;
        ctx.clearRect(0, 0, width, height);
        const progress = audio.currentTime / (audio.duration || 1);
        for (let i = 0; i < bufferLength; i++) {
            const value = dataArray[i];
            const barHeight = (value / 255) * height;
            const x = i * barWidth;
            const y = height - barHeight;
            const isPlayed = (i / bufferLength) < progress;
            if (isPlayed) {
                const t = i / bufferLength;
                if (t < 0.5) {
                    const ratio = t / 0.5;
                    ctx.fillStyle = `rgb(255, ${180 + Math.floor(ratio * 75)}, ${Math.floor(ratio * 150)})`;
                } else {
                    const ratio = (t - 0.5) / 0.5;
                    ctx.fillStyle = `rgb(255, ${255 - Math.floor(ratio * 55)}, ${150 + Math.floor(ratio * 105)})`;
                }
                ctx.shadowBlur = 4;
                ctx.shadowColor = '#ff8c00';
            } else {
                ctx.fillStyle = 'rgba(80, 60, 40, 0.4)';
                ctx.shadowBlur = 0;
            }
            ctx.fillRect(x, y, Math.max(1, barWidth - 1), barHeight);
        }
        ctx.shadowBlur = 0;
    }
    
    function drawEmptyWaveform() {
        const width = canvas.width, height = canvas.height;
        ctx.clearRect(0, 0, width, height);
        ctx.fillStyle = 'rgba(80, 60, 40, 0.2)';
        for (let i = 0; i < 100; i++) {
            ctx.fillRect(i * (width/100), height - 12, Math.max(1, width/100 - 1), 12);
        }
    }
    
    function updateMarkers() {
        if (!audio.duration || isNaN(audio.duration) || audio.duration === 0) return;
        markersLayer.innerHTML = '';
        tracks.forEach(track => {
            const pct = (track.seconds / audio.duration) * 100;
            if (pct > 100) return;
            const marker = document.createElement('div');
            marker.className = 'timeline-marker';
            marker.style.left = pct + '%';
            const tooltip = document.createElement('div');
            tooltip.className = 'marker-tooltip';
            tooltip.innerHTML = `<img src="${track.thumbnail}" onerror="this.src='001.png'"><div class="tooltip-title">${escapeHtml(track.title.substring(0, 30))}</div><div class="tooltip-artist">${escapeHtml(track.artist.substring(0, 25))}</div><div style="font-size:0.55rem;color:#ff8c00;"> ${track.timestamp}</div>`;
            marker.appendChild(tooltip);
            marker.onclick = (e) => { 
                e.stopPropagation(); 
                if (track.url) window.open(track.url, '_blank');
            };
            markersLayer.appendChild(marker);
        });
    }
    
    function updateProgress() {
        if (audio.duration && !isNaN(audio.duration) && audio.duration > 0) {
            const percent = (audio.currentTime / audio.duration) * 100;
            progressFill.style.width = percent + '%';
            updateActiveTrack();
        }
        currentTimeSpan.textContent = formatTime(audio.currentTime);
        if (audio.duration) durationSpan.textContent = formatTime(audio.duration);
    }
    
    function updateActiveTrack() {
        const currentTime = audio.currentTime;
        let activeIndex = -1;
        
        if (currentTime >= audio.duration - 0.5) {
            activeIndex = tracks.length - 1;
            if (activeIndex !== currentTrackIndex && tracks[activeIndex]) {
                currentTrackIndex = activeIndex;
                marqueeSpan.textContent = tracks[activeIndex].artist + ' — ' + tracks[activeIndex].title;
            }
            return;
        }
        
        for (let i = 0; i < tracks.length; i++) {
            const startTime = tracks[i].seconds;
            const endTime = (i < tracks.length - 1) ? tracks[i + 1].seconds : audio.duration;
            
            if (currentTime >= startTime - 0.5 && currentTime < endTime) {
                activeIndex = i;
                break;
            }
        }
        
        if (activeIndex !== currentTrackIndex && activeIndex !== -1) {
            currentTrackIndex = activeIndex;
            document.querySelectorAll('.track-row').forEach((row, idx) => {
                if (idx === activeIndex) {
                    row.classList.add('active');
                    row.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                } else {
                    row.classList.remove('active');
                }
            });
            if (tracks[activeIndex]) {
                marqueeSpan.textContent = tracks[activeIndex].artist + ' — ' + tracks[activeIndex].title;
            }
        }
    }
    
    function buildUI() {
        tracklistGrid.innerHTML = '';
        tracks.forEach((track, idx) => {
            const row = document.createElement('div');
            row.className = 'track-row';
            row.onclick = () => { 
                if (track.url) window.open(track.url, '_blank');
            };
            row.innerHTML = `<div class="track-vignette" style="background-image: url(${track.thumbnail});"></div><div class="track-details"><div class="track-artist-name">${escapeHtml(track.artist)}</div><div class="track-song-title">${escapeHtml(track.title)}</div></div><div class="track-duration">${track.timestamp}</div><a href="${track.url}" target="_blank" class="track-link" onclick="event.stopPropagation()">YouTube</a>`;
            tracklistGrid.appendChild(row);
        });
    }
    
    function escapeHtml(str) { if (!str) return ''; return str.replace(/[&<>]/g, m => m === '&' ? '&amp;' : (m === '<' ? '&lt;' : '&gt;')); }
    
    function playAudio() { 
        if (audioContext && audioContext.state === 'suspended') audioContext.resume(); 
        initAudioContext(); 
        audio.play().catch(e => console.log('Lecture auto bloquee', e));
    }
    
    function pauseAudio() { audio.pause(); }
    function updateVolume() { audio.volume = volumeSlider.value / 100; volumePercent.textContent = Math.round(volumeSlider.value) + '%'; }
    function setProgress(e) { 
        const rect = progressBar.getBoundingClientRect(); 
        const percent = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width)); 
        if (audio.duration) audio.currentTime = percent * audio.duration;
    }
    
    playBtn.addEventListener('click', playAudio);
    pauseBtn.addEventListener('click', pauseAudio);
    progressBar.addEventListener('click', setProgress);
    volumeSlider.addEventListener('input', updateVolume);
    audio.addEventListener('timeupdate', updateProgress);
    audio.addEventListener('loadedmetadata', () => { 
        durationSpan.textContent = formatTime(audio.duration); 
        drawEmptyWaveform(); 
        setTimeout(updateMarkers, 100); 
        updateVolume();
        console.log('Audio chargé, durée:', audio.duration);
    });
    audio.addEventListener('canplay', () => { setTimeout(updateMarkers, 100); });
    audio.addEventListener('ended', () => {
        console.log('Mix terminé');
        marqueeSpan.textContent = 'Mix terminé — Merci !';
    });
    
    document.getElementById('whatsappBtn').addEventListener('click', e => {
        e.preventDefault();
        window.open('https://wa.me/?text=' + encodeURIComponent('Sarferprod Daily Mix - ' + window.location.href), '_blank');
    });
    
    document.getElementById('emailBtn').addEventListener('click', e => {
        e.preventDefault();
        window.location.href = 'mailto:?subject=' + encodeURIComponent('Sarferprod Daily Mix') + '&body=' + encodeURIComponent('Ecoute mon mix : ' + window.location.href);
    });
    
    document.getElementById('copyBtn').addEventListener('click', e => {
        e.preventDefault();
        navigator.clipboard.writeText('https://sarfer02.github.io/sarferprod-dailymix');
        const btn = document.getElementById('copyBtn');
        const originalText = btn.textContent;
        btn.textContent = 'Lien copié !';
        setTimeout(() => btn.textContent = originalText, 2000);
    });
    
    buildUI();
    drawEmptyWaveform();
    updateVolume();
    document.body.addEventListener('click', () => { if (audioContext && audioContext.state === 'suspended') audioContext.resume(); }, { once: true });
    audio.addEventListener('durationchange', () => { setTimeout(updateMarkers, 100); });
</script>
</body>
