    <style>

            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3); padding: 32px 28px;

        }
        .portrait-wrapper { display: flex; justify-content: center; margin-bottom: 25px; }
        .lens-portrait {
            width: 120px; height: 120px; border-radius: 50%; overflow: hidden;
            border: 3px solid rgba(255, 140, 0, 0.5); cursor: pointer;
            transition: transform 0.2s; animation: subtleWiggle 3s infinite;
        }
        .lens-portrait:hover { transform: scale(1.08); }
        @keyframes subtleWiggle { 0%,100% { transform: translateX(0); } 50% { transform: translateX(2px); } }
        .lens-portrait img { width: 100%; height: 100%; object-fit: cover; }
        .track-title-frame {
            border: 1.5px solid rgba(255, 140, 0, 0.5); border-radius: 60px;
            padding: 14px 24px; background: rgba(0, 0, 0, 0.25); margin-bottom: 30px;
        }
        .marquee-track { width: 100%; overflow: hidden; white-space: nowrap; }
        .marquee-track span { display: inline-block; padding-left: 100%; animation: scrollTrack 14s linear infinite; font-family: 'Georgia', serif; font-size: 1rem; font-style: italic; color: rgba(255, 220, 150, 0.9); }
        @keyframes scrollTrack { 0% { transform: translateX(0); } 100% { transform: translateX(-100%); } }
        .controls-center { display: flex; justify-content: center; gap: 30px; margin-bottom: 20px; }
        .btn-img { background: none; border: none; cursor: pointer; transition: transform 0.2s; width: 65px; height: 65px; }
        .btn-img img { width: 100%; height: 100%; object-fit: contain; }
        .btn-img:hover { transform: scale(1.1); filter: drop-shadow(0 0 8px #ff8c00); }
        .volume-control { display: flex; justify-content: center; align-items: center; gap: 12px; margin-bottom: 20px; }
        .volume-icon { color: #ffcc88; font-size: 1rem; }
        .volume-slider { width: 120px; height: 4px; -webkit-appearance: none; background: rgba(255, 255, 255, 0.3); border-radius: 4px; }
        .volume-slider::-webkit-slider-thumb { -webkit-appearance: none; width: 12px; height: 12px; border-radius: 50%; background: #ff8c00; cursor: pointer; }
        .progress-section { margin: 10px 0 20px; position: relative; }
        canvas { width: 100%; height: 85px; border-radius: 45px; display: block; background: rgba(0, 0, 0, 0.4); }
        .progress-wrapper { width: 100%; height: 4px; background: rgba(255, 255, 255, 0.2); border-radius: 4px; margin: 16px 0 8px; cursor: pointer; position: relative; }
        .progress-fill-led { width: 0%; height: 100%; background: linear-gradient(90deg, #ff8c00, #ffcc00, #ff8c00); border-radius: 4px; }
        .markers-layer { position: relative; width: 100%; height: 20px; margin-top: 8px; margin-bottom: 5px; }
        .timeline-marker {

        .timeline-marker:hover { width: 8px; height: 24px; background: #ffaa33; margin-top: -4px; }
        .marker-tooltip {

            padding: 8px 12px; display: none; white-space: nowrap; z-index: 100;
            pointer-events: none; border: 1px solid #ff8c00;

        .timeline-marker:hover .marker-tooltip { display: block; }
        .marker-tooltip img { width: 80px; height: 45px; border-radius: 6px; object-fit: cover; margin-bottom: 5px; }
        .marker-tooltip .tooltip-title { font-size: 0.7rem; color: #ffcc88; font-weight: 600; max-width: 120px; overflow: hidden; text-overflow: ellipsis; }

        .track-row {
            display: flex; align-items: center; gap: 14px; padding: 10px 14px;

            transition: all 0.2s; border-left: 3px solid transparent;

        .track-row:hover { background: rgba(0, 0, 0, 0.6); transform: translateX(6px); }
        .track-row.active { background: rgba(255, 140, 0, 0.25); border-left: 3px solid #ff8c00; }
        .track-row.active .track-artist-name { color: #ffcc88; }
        .track-row.active .track-song-title { color: #ffaa55; }
        .track-vignette { width: 50px; height: 50px; border-radius: 8px; background-size: cover; background-position: center; flex-shrink: 0; border: 1px solid rgba(255, 140, 0, 0.4); }
        .track-details { flex: 1; }
        .track-artist-name { font-weight: 600; color: #ffcc88; font-size: 0.85rem; }
        .track-song-title { font-style: italic; color: rgba(255, 245, 220, 0.7); font-size: 0.8rem; }
        .track-duration { font-family: monospace; font-size: 0.7rem; color: #ffaa55; margin-right: 12px; }
        .track-link { font-size: 0.7rem; color: #ff8c00; text-decoration: none; padding: 4px 8px; border-radius: 20px; background: rgba(255, 140, 0, 0.2); }

        .social-icon { backdrop-filter: blur(8px); border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 40px; padding: 8px 20px; font-size: 0.8rem; text-decoration: none; transition: all 0.2s; font-weight: 500; cursor: pointer; }

        .whatsapp-btn:hover { background: rgba(37, 211, 102, 0.8); transform: translateY(-2px); }
        .email-btn { background: rgba(244, 180, 0, 0.5); color: white; }
        .email-btn:hover { background: rgba(244, 180, 0, 0.8); transform: translateY(-2px); }
        .copy-btn { background: rgba(100, 100, 100, 0.5); color: white; }
        .copy-btn:hover { background: rgba(100, 100, 100, 0.8); transform: translateY(-2px); }
        .soundcloud-btn { background: rgba(255, 85, 0, 0.5); color: white; }
        .soundcloud-btn:hover { background: rgba(255, 85, 0, 0.8); transform: translateY(-2px); }
        .vibrate { animation: vibrateShort 0.12s; }
        @keyframes vibrateShort { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }
    </style>
</head>
<body>
<div class="container">

    </div>
    <div class="glass-card">

        <div class="progress-section">
            <canvas id="waveformCanvas" width="800" height="85"></canvas>
            <div class="progress-wrapper" id="progressBar">
                <div class="progress-fill-led" id="progressFill"></div>
            </div>
            <div class="markers-layer" id="markersLayer"></div>
            <div class="time-row">
                <span id="currentTime">00:00</span>

    </div>
    <div class="glass-card">
        <div class="tracklist-header">
            <div class="tracklist-title">TRACKLIST</div>
        </div>
        <div class="tracklist-grid" id="tracklistGrid"></div>
    </div>
    <div class="social-row">

        <a href="#" class="social-icon email-btn" id="emailBtn">Email</a>
        <button class="social-icon copy-btn" id="copyBtn">Copier le lien</button>
        <a href="https://soundcloud.com/sarferprod" target="_blank" class="social-icon soundcloud-btn">SoundCloud</a>
    </div>
    <audio id="audio" src="./latest.mp3" preload="auto" crossorigin="anonymous"></audio>
</div>
<script>
    const tracks = [{"timestamp": "00:30", "seconds": 30.8, "artist": "zzzahara", "title": "Rainy Days", "url": "https://www.youtube.com/watch?v=981gKtMm5kA", "thumbnail": "https://i.ytimg.com/vi/981gKtMm5kA/hqdefault.jpg"}, {"timestamp": "01:04", "seconds": 64.8, "artist": "Braaheim", "title": "What's Up?", "url": "https://www.youtube.com/watch?v=lo-WXsAWcIM", "thumbnail": "https://i.ytimg.com/vi/lo-WXsAWcIM/hqdefault.jpg"}, {"timestamp": "01:38", "seconds": 98.8, "artist": "GLORIA GAYNOR", "title": "Casanova Brown (Re Edit) (1975)", "url": "https://www.youtube.com/watch?v=ESIP9HreP6M", "thumbnail": "https://i.ytimg.com/vi/ESIP9HreP6M/hqdefault.jpg"}, {"timestamp": "02:12", "seconds": 132.8, "artist": "ZapsyQ,MarsReverb", "title": "Lesson", "url": "https://www.youtube.com/watch?v=X4Kpa7qaTnk", "thumbnail": "https://i.ytimg.com/vi/X4Kpa7qaTnk/hqdefault.jpg"}, {"timestamp": "02:46", "seconds": 166.8, "artist": "triple j", "title": "When Should You Say I Love You? | The Hook Up Podc", "url": "https://www.youtube.com/watch?v=JLQ0D_HnFrY", "thumbnail": "https://i.ytimg.com/vi/JLQ0D_HnFrY/hqdefault.jpg"}, {"timestamp": "03:20", "seconds": 200.8, "artist": "Don Toliver", "title": "Body (AYDO8 Flip)", "url": "https://www.youtube.com/watch?v=d3HG3rwxfIc", "thumbnail": "https://i.ytimg.com/vi/d3HG3rwxfIc/hqdefault.jpg"}, {"timestamp": "03:54", "seconds": 234.8, "artist": "SVDDEN DEATH & Phiso", "title": "Nightshade", "url": "https://www.youtube.com/watch?v=bB34nwtJugI", "thumbnail": "https://i.ytimg.com/vi/bB34nwtJugI/hqdefault.jpg"}, {"timestamp": "04:28", "seconds": 268.8, "artist": "Jav The Dentist", "title": "I Get A Rush feat. Planet Asia, Flee Lord, Rim Da ", "url": "https://www.youtube.com/watch?v=DYiZRJckAus", "thumbnail": "https://i.ytimg.com/vi/DYiZRJckAus/hqdefault.jpg"}, {"timestamp": "05:02", "seconds": 302.8, "artist": "Paycheque", "title": "Heatwave", "url": "https://www.youtube.com/watch?v=dvijNrKRbBQ", "thumbnail": "https://i.ytimg.com/vi/dvijNrKRbBQ/hqdefault.jpg"}, {"timestamp": "05:36", "seconds": 336.8, "artist": "Caitlin & Brent", "title": "Come Out And Play (Live on KEXP)", "url": "https://www.youtube.com/watch?v=5Y0le1JpLlw", "thumbnail": "https://i.ytimg.com/vi/5Y0le1JpLlw/hqdefault.jpg"}, {"timestamp": "06:10", "seconds": 370.8, "artist": "DJ' PYL - Funk Disco Soul Groove", "title": "Party Mix Old School Funk & Disco Remix 70's & 80'", "url": "https://www.youtube.com/watch?v=VxHP6KV2Tww", "thumbnail": "https://i.ytimg.com/vi/VxHP6KV2Tww/hqdefault.jpg"}, {"timestamp": "06:44", "seconds": 404.8, "artist": "MacGregor Burns", "title": "My Love Won't Ever Die", "url": "https://www.youtube.com/watch?v=4LOVxD3yrI0", "thumbnail": "https://i.ytimg.com/vi/4LOVxD3yrI0/hqdefault.jpg"}, {"timestamp": "07:18", "seconds": 438.8, "artist": "Jamal Gasol", "title": "Pray 2 God feat. Flames Dot Malik (Prod. Denny Laf", "url": "https://www.youtube.com/watch?v=d8HiqT7S5LU", "thumbnail": "https://i.ytimg.com/vi/d8HiqT7S5LU/hqdefault.jpg"}, {"timestamp": "07:52", "seconds": 472.8, "artist": "Culture Code", "title": "I Don't Wanna Know (Lyrics)", "url": "https://www.youtube.com/watch?v=iynNKLwE8Dg", "thumbnail": "https://i.ytimg.com/vi/iynNKLwE8Dg/hqdefault.jpg"}, {"timestamp": "08:26", "seconds": 506.8, "artist": "Spinnin' Records", "title": "@CYRILTHEPRODUCER performing at Patcha \ud83c\udf52 it was FI", "url": "https://www.youtube.com/watch?v=nv9R21kzdbU", "thumbnail": "https://i.ytimg.com/vi/nv9R21kzdbU/hqdefault.jpg"}, {"timestamp": "08:41", "seconds": 521.7, "artist": "Stoto", "title": "Stay Until the Morning", "url": "https://www.youtube.com/watch?v=KMk5VDHLW5s", "thumbnail": "https://i.ytimg.com/vi/KMk5VDHLW5s/hqdefault.jpg"}, {"timestamp": "09:15", "seconds": 555.7, "artist": "triple j", "title": "mismatching in PDA", "url": "https://www.youtube.com/watch?v=pzAyN8Me3-4", "thumbnail": "https://i.ytimg.com/vi/pzAyN8Me3-4/hqdefault.jpg"}, {"timestamp": "09:49", "seconds": 589.7, "artist": "Robert Palmer", "title": "Tell Me I'm Not Dreaming (Westerville Mix)", "url": "https://www.youtube.com/watch?v=1o025EF17eA", "thumbnail": "https://i.ytimg.com/vi/1o025EF17eA/hqdefault.jpg"}];
    const audio = document.getElementById('audio');
    const playBtn = document.getElementById('playBtn');
    const pauseBtn = document.getElementById('pauseBtn');
    const volumeSlider = document.getElementById('volumeSlider');
    const volumePercent = document.getElementById('volumePercent');
    const marqueeSpan = document.getElementById('marqueeText');
    const currentTimeSpan = document.getElementById('currentTime');
    const durationSpan = document.getElementById('duration');
    const progressBar = document.getElementById('progressBar');
    const progressFill = document.getElementById('progressFill');
    const canvas = document.getElementById('waveformCanvas');
    const ctx = canvas.getContext('2d');
    const markersLayer = document.getElementById('markersLayer');
    const tracklistGrid = document.getElementById('tracklistGrid');
    
    let audioContext = null, analyser = null, source = null, animId = null;
    let currentTrackIndex = -1;
    
    function resizeCanvas() {
        canvas.width = canvas.parentElement.clientWidth - 30;
        canvas.height = 85;
        drawEmptyWaveform();
        setTimeout(updateMarkers, 100);
    }
    
    window.addEventListener('resize', resizeCanvas);
    setTimeout(resizeCanvas, 100);
    
    function formatTime(sec) {
        if (isNaN(sec) || !isFinite(sec)) return '00:00';
        const m = Math.floor(sec / 60);
        const s = Math.floor(sec % 60);
        return m + ':' + s.toString().padStart(2,'0');
    }
    
    function initAudioContext() {
        if (audioContext) return;
        try {
            audioContext = new (window.AudioContext || window.webkitAudioContext)();
            analyser = audioContext.createAnalyser();
            analyser.fftSize = 256;
            source = audioContext.createMediaElementSource(audio);
            source.connect(analyser);
            analyser.connect(audioContext.destination);
            visualize();
        } catch(e) {
            console.log('Web Audio API non supportee');
        }
    }
    
    function visualize() {
        if (!analyser) return;
        const dataArray = new Uint8Array(analyser.frequencyBinCount);
        function update() {
            if (!audio.paused && !audio.ended) {
                analyser.getByteFrequencyData(dataArray);
                drawSpectrogram(dataArray);
            }
            animId = requestAnimationFrame(update);
        }
        update();
    }
    
    function drawSpectrogram(dataArray) {
        const width = canvas.width, height = canvas.height;
        const bufferLength = dataArray.length;
        const barWidth = width / bufferLength;
        ctx.clearRect(0, 0, width, height);
        const progress = audio.currentTime / (audio.duration || 1);
        for (let i = 0; i < bufferLength; i++) {
            const value = dataArray[i];
            const barHeight = (value / 255) * height;
            const x = i * barWidth;
            const y = height - barHeight;
            const isPlayed = (i / bufferLength) < progress;
            if (isPlayed) {
                const t = i / bufferLength;
                if (t < 0.5) {
                    const ratio = t / 0.5;
                    ctx.fillStyle = `rgb(255, ${180 + Math.floor(ratio * 75)}, ${Math.floor(ratio * 150)})`;
                } else {
                    const ratio = (t - 0.5) / 0.5;
                    ctx.fillStyle = `rgb(255, ${255 - Math.floor(ratio * 55)}, ${150 + Math.floor(ratio * 105)})`;
                }
                ctx.shadowBlur = 4;
                ctx.shadowColor = '#ff8c00';
            } else {
                ctx.fillStyle = 'rgba(80, 60, 40, 0.4)';
                ctx.shadowBlur = 0;
            }
            ctx.fillRect(x, y, Math.max(1, barWidth - 1), barHeight);
        }
        ctx.shadowBlur = 0;
    }
    
    function drawEmptyWaveform() {
        const width = canvas.width, height = canvas.height;
        ctx.clearRect(0, 0, width, height);
        ctx.fillStyle = 'rgba(80, 60, 40, 0.2)';
        for (let i = 0; i < 100; i++) {
            ctx.fillRect(i * (width/100), height - 12, Math.max(1, width/100 - 1), 12);
        }
    }
    
    function updateMarkers() {
        if (!audio.duration || isNaN(audio.duration) || audio.duration === 0) return;
        markersLayer.innerHTML = '';
        tracks.forEach(track => {
            const pct = (track.seconds / audio.duration) * 100;
            if (pct > 100) return;
            const marker = document.createElement('div');
            marker.className = 'timeline-marker';
            marker.style.left = pct + '%';
            const tooltip = document.createElement('div');
            tooltip.className = 'marker-tooltip';
            tooltip.innerHTML = `<img src="${track.thumbnail}" onerror="this.src='001.png'"><div class="tooltip-title">${escapeHtml(track.title.substring(0, 30))}</div><div class="tooltip-artist">${escapeHtml(track.artist.substring(0, 25))}</div><div style="font-size:0.55rem;color:#ff8c00;"> ${track.timestamp}</div>`;
            marker.appendChild(tooltip);
            marker.onclick = (e) => { 
                e.stopPropagation(); 
                if (track.url) window.open(track.url, '_blank');
            };
            markersLayer.appendChild(marker);
        });
    }
    
    function updateProgress() {
        if (audio.duration && !isNaN(audio.duration) && audio.duration > 0) {
            progressFill.style.width = (audio.currentTime / audio.duration) * 100 + '%';
            updateActiveTrack();
        }
        currentTimeSpan.textContent = formatTime(audio.currentTime);
        if (audio.duration) durationSpan.textContent = formatTime(audio.duration);
    }
    
    function updateActiveTrack() {
        const currentTime = audio.currentTime;
        let activeIndex = -1;
        for (let i = 0; i < tracks.length; i++) {
            if (currentTime >= tracks[i].seconds - 0.5) activeIndex = i;
            else break;
        }
        if (activeIndex !== currentTrackIndex) {
            currentTrackIndex = activeIndex;
            document.querySelectorAll('.track-row').forEach((row, idx) => {
                if (idx === activeIndex) {
                    row.classList.add('active');
                    row.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                } else {
                    row.classList.remove('active');
                }
            });
            if (activeIndex >= 0 && tracks[activeIndex]) {
                marqueeSpan.textContent = tracks[activeIndex].artist + ' — ' + tracks[activeIndex].title;
            }
        }
    }
    
    function buildUI() {
        tracklistGrid.innerHTML = '';
        tracks.forEach((track, idx) => {
            const row = document.createElement('div');
            row.className = 'track-row';
            row.onclick = () => { 
                if (track.url) window.open(track.url, '_blank');
            };
            row.innerHTML = `<div class="track-vignette" style="background-image: url(${track.thumbnail});"></div><div class="track-details"><div class="track-artist-name">${escapeHtml(track.artist)}</div><div class="track-song-title">${escapeHtml(track.title)}</div></div><div class="track-duration">${track.timestamp}</div><a href="${track.url}" target="_blank" class="track-link" onclick="event.stopPropagation()">YouTube</a>`;
            tracklistGrid.appendChild(row);
        });
    }
    
    function escapeHtml(str) { if (!str) return ''; return str.replace(/[&<>]/g, m => m === '&' ? '&amp;' : (m === '<' ? '&lt;' : '&gt;')); }
    
    function playAudio() { if (audioContext && audioContext.state === 'suspended') audioContext.resume(); initAudioContext(); audio.play().catch(e => console.log('Lecture auto bloquee', e)); }
    function pauseAudio() { audio.pause(); }
    function updateVolume() { audio.volume = volumeSlider.value / 100; volumePercent.textContent = Math.round(volumeSlider.value) + '%'; }
    function addVibration() { document.body.classList.add('vibrate'); setTimeout(() => document.body.classList.remove('vibrate'), 150); }
    function setProgress(e) { const rect = progressBar.getBoundingClientRect(); const percent = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width)); if (audio.duration) audio.currentTime = percent * audio.duration; }
    
    playBtn.addEventListener('click', playAudio);
    pauseBtn.addEventListener('click', pauseAudio);
    progressBar.addEventListener('click', setProgress);
    volumeSlider.addEventListener('input', updateVolume);
    audio.addEventListener('timeupdate', updateProgress);
    audio.addEventListener('loadedmetadata', () => { durationSpan.textContent = formatTime(audio.duration); drawEmptyWaveform(); setTimeout(updateMarkers, 100); updateVolume(); });
    audio.addEventListener('canplay', () => { setTimeout(updateMarkers, 100); });
    
    document.getElementById('whatsappBtn').addEventListener('click', e => {
        e.preventDefault();
        window.open('https://wa.me/?text=' + encodeURIComponent('Sarferprod Daily Mix - ' + window.location.href), '_blank');
    });
    
    document.getElementById('emailBtn').addEventListener('click', e => {
        e.preventDefault();
        window.location.href = 'mailto:?subject=' + encodeURIComponent('Sarferprod Daily Mix') + '&body=' + encodeURIComponent('Ecoute mon mix : ' + window.location.href);
    });
    
    document.getElementById('copyBtn').addEventListener('click', e => {
        e.preventDefault();
        navigator.clipboard.writeText(GITHUB_PAGES_URL);
        const btn = document.getElementById('copyBtn');
        const originalText = btn.textContent;
        btn.textContent = 'Lien copié !';
        setTimeout(() => btn.textContent = originalText, 2000);
    });
    
    buildUI();
    drawEmptyWaveform();
    updateVolume();
    document.body.addEventListener('click', () => { if (audioContext && audioContext.state === 'suspended') audioContext.resume(); }, { once: true });
    audio.addEventListener('durationchange', () => { setTimeout(updateMarkers, 100); });
</script>
