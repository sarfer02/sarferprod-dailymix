<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SARFERPROD • Daily Mix</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-image: url('001.png');
            background-size: cover; background-position: center; background-attachment: fixed;
            font-family: 'Inter', sans-serif; min-height: 100vh;
            display: flex; justify-content: center; align-items: center; padding: 30px 20px;
        }
        body::before {
            content: ''; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.4); backdrop-filter: blur(4px); pointer-events: none; z-index: 0;
        }
        .container { max-width: 950px; width: 100%; margin: 0 auto; position: relative; z-index: 1; }
        .victorian-header {
            background: rgba(0, 0, 0, 0.5); backdrop-filter: blur(10px);
            border: 1.5px solid rgba(255, 140, 0, 0.5); border-radius: 20px; padding: 20px 30px; margin-bottom: 25px; text-align: center;
        }
        .header-logos { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
        .header-logos img { height: 45px; width: auto; }
        .free-badge {
            display: inline-block; background: rgba(255, 140, 0, 0.3);
            border: 1px solid rgba(255, 140, 0, 0.6); border-radius: 40px; padding: 4px 20px; font-family: monospace; font-size: 0.7rem; color: #ffaa55; margin-bottom: 12px;
        }
        .event-date { display: flex; justify-content: center; gap: 20px; font-family: 'Georgia', serif; font-size: 0.8rem; color: rgba(255, 245, 220, 0.7); letter-spacing: 1px; flex-wrap: wrap; }
        .glass-card {
            background: rgba(20, 20, 35, 0.45); backdrop-filter: blur(18px); border-radius: 32px; border: 1px solid rgba(255, 255, 255, 0.12); box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3); padding: 32px 28px; margin-bottom: 24px;
        }
        .portrait-wrapper { display: flex; justify-content: center; margin-bottom: 25px; }
        .lens-portrait { width: 120px; height: 120px; border-radius: 50%; overflow: hidden; border: 3px solid rgba(255, 140, 0, 0.5); cursor: pointer; transition: transform 0.2s; }
        .lens-portrait img { width: 100%; height: 100%; object-fit: cover; }
        .track-title-frame { border: 1.5px solid rgba(255, 140, 0, 0.5); border-radius: 60px; padding: 14px 24px; background: rgba(0, 0, 0, 0.25); margin-bottom: 30px; }
        .marquee-track { width: 100%; overflow: hidden; white-space: nowrap; }
        .marquee-track span { display: inline-block; padding-left: 100%; animation: scrollTrack 14s linear infinite; font-family: 'Georgia', serif; font-size: 1rem; font-style: italic; color: rgba(255, 220, 150, 0.9); }
        @keyframes scrollTrack { 0% { transform: translateX(0); } 100% { transform: translateX(-100%); } }
        .controls-center { display: flex; justify-content: center; gap: 30px; margin-bottom: 20px; }
        .btn-img { background: none; border: none; cursor: pointer; transition: transform 0.2s; width: 65px; height: 65px; }
        .btn-img img { width: 100%; height: 100%; object-fit: contain; }
        .volume-control { display: flex; justify-content: center; align-items: center; gap: 12px; margin-bottom: 20px; }
        .volume-slider { width: 120px; height: 4px; -webkit-appearance: none; background: rgba(255, 255, 255, 0.3); border-radius: 4px; }
        .volume-slider::-webkit-slider-thumb { -webkit-appearance: none; width: 12px; height: 12px; border-radius: 50%; background: #ff8c00; cursor: pointer; }
        .progress-section { margin: 10px 0 20px; position: relative; }
        canvas { width: 100%; height: 85px; border-radius: 45px; display: block; background: rgba(0, 0, 0, 0.4); }
        .progress-wrapper { width: 100%; height: 4px; background: rgba(255, 255, 255, 0.2); border-radius: 4px; margin: 16px 0 8px; cursor: pointer; }
        .progress-fill-led { width: 0%; height: 100%; background: linear-gradient(90deg, #ff8c00, #ffcc00, #ff8c00); border-radius: 4px; }
        .markers-layer { position: relative; width: 100%; height: 20px; margin-top: 8px; }
        .timeline-marker { position: absolute; width: 4px; height: 16px; background: #ff8c00; border-radius: 2px; transform: translateX(-50%); cursor: pointer; }
        .time-row { display: flex; justify-content: space-between; font-size: 0.7rem; color: rgba(255, 245, 220, 0.5); font-family: monospace; }
        .tracklist-header { text-align: center; margin-bottom: 20px; }
        .tracklist-title { font-family: 'Georgia', serif; font-size: 1.4rem; color: #ffcc88; letter-spacing: 6px; text-transform: uppercase; border-bottom: 1px solid rgba(255, 140, 0, 0.4); display: inline-block; padding-bottom: 8px; }
        .tracklist-grid { display: grid; gap: 8px; max-height: 320px; overflow-y: auto; }
        .track-row { display: flex; align-items: center; gap: 14px; padding: 10px 14px; background: rgba(0, 0, 0, 0.3); border-radius: 16px; cursor: pointer; }
        .track-row.active { background: rgba(255, 140, 0, 0.25); border-left: 3px solid #ff8c00; }
        .track-vignette { width: 50px; height: 50px; border-radius: 8px; background-size: cover; background-position: center; }
        .track-details { flex: 1; }
        .track-artist-name { font-weight: 600; color: #ffcc88; font-size: 0.85rem; }
        .track-song-title { font-style: italic; color: rgba(255, 245, 220, 0.7); font-size: 0.8rem; }
        .track-duration { font-family: monospace; font-size: 0.7rem; color: #ffaa55; }
        .social-row { display: flex; justify-content: center; gap: 15px; margin-top: 20px; }
        .social-icon { border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 40px; padding: 8px 20px; font-size: 0.8rem; text-decoration: none; color: white; background: rgba(100, 100, 100, 0.5); cursor: pointer; }
    </style>
</head>
<body>
<div class="container">
    <div class="victorian-header">
        <div class="header-logos">
            <img src="title_sarferprod.png" alt="SARFERPROD"><img src="title_daily.png" alt="DAILY"><img src="title_sampler.png" alt="SAMPLE">
        </div>
        <div class="free-badge">FREE ENTRY</div>
        <div class="event-date"><span>SAT 04TH</span><span>JUL</span><span>13:33</span><span>SARFERPROD LABS</span></div>
    </div>
    <div class="glass-card">
        <div class="portrait-wrapper"><div class="lens-portrait"><img src="Radio_SARFERPROD.jpeg"></div></div>
        <div class="track-title-frame"><div class="marquee-track"><span id="marqueeText">Chargement...</span></div></div>
        <div class="controls-center">
            <button class="btn-img" id="playBtn"><img src="btn_play.png"></button>
            <button class="btn-img" id="pauseBtn"><img src="btn_pause.png"></button>
        </div>
        <div class="volume-control">
            <input type="range" id="volumeSlider" class="volume-slider" min="0" max="100" value="70">
            <span id="volumePercent">70%</span>
        </div>
        <div class="progress-section">
            <canvas id="waveformCanvas"></canvas>
            <div class="progress-wrapper" id="progressBar"><div class="progress-fill-led" id="progressFill"></div></div>
            <div class="markers-layer" id="markersLayer"></div>
            <div class="time-row"><span id="currentTime">00:00</span><span id="duration">9:31</span></div>
        </div>
    </div>
    <div class="glass-card">
        <div class="tracklist-header"><div class="tracklist-title">TRACKLIST</div></div>
        <div class="tracklist-grid" id="tracklistGrid"></div>
    </div>
    <div class="social-row">
        <button class="social-icon" id="copyBtn">Copier le lien</button>
    </div>
    <audio id="audio" src="./latest.mp3?v=${new Date().getTime()}" preload="auto" crossorigin="anonymous"></audio>
</div>
<script>
    const tracks = [{"timestamp": "00:30", "seconds": 30.8, "artist": "Leftwing : Kody", "title": "I Feel It (Official Music Video)", "url": "https://www.youtube.com/watch?v=ikVHnP8hh7Y", "thumbnail": "https://i.ytimg.com/vi/ikVHnP8hh7Y/hqdefault.jpg"}, {"timestamp": "00:59", "seconds": 59.3, "artist": "Don Toliver", "title": "E85 (sincerely Lue. Remix)", "url": "https://www.youtube.com/watch?v=C2M9g1pJo5c", "thumbnail": "https://i.ytimg.com/vi/C2M9g1pJo5c/hqdefault.jpg"}, {"timestamp": "01:27", "seconds": 87.8, "artist": "trauma ray", "title": "Full Performance (Live on KEXP)", "url": "https://www.youtube.com/watch?v=30zFzYsySTI", "thumbnail": "https://i.ytimg.com/vi/30zFzYsySTI/hqdefault.jpg"}, {"timestamp": "01:56", "seconds": 116.3, "artist": "Keeno", "title": "Evolve", "url": "https://www.youtube.com/watch?v=5RQcePKQR4k", "thumbnail": "https://i.ytimg.com/vi/5RQcePKQR4k/hqdefault.jpg"}, {"timestamp": "02:24", "seconds": 144.8, "artist": "Lykke Li", "title": "Lucky Again (The Magician Remix)", "url": "https://www.youtube.com/watch?v=UtKJnMN_RAY", "thumbnail": "https://i.ytimg.com/vi/UtKJnMN_RAY/hqdefault.jpg"}, {"timestamp": "02:53", "seconds": 173.3, "artist": "réwqu", "title": "in my tears", "url": "https://www.youtube.com/watch?v=DtAHh5ZtFrU", "thumbnail": "https://i.ytimg.com/vi/DtAHh5ZtFrU/hqdefault.jpg"}, {"timestamp": "03:21", "seconds": 201.8, "artist": "One Trick Pony, Toby Rose", "title": "I Follow Rivers", "url": "https://www.youtube.com/watch?v=3JC7B25tYyI", "thumbnail": "https://i.ytimg.com/vi/3JC7B25tYyI/hqdefault.jpg"}, {"timestamp": "03:50", "seconds": 230.3, "artist": "MPH & Nathan Nicholson", "title": "Long Goodbye (Extended Mix)", "url": "https://www.youtube.com/watch?v=aPrnaLXuuqE", "thumbnail": "https://i.ytimg.com/vi/aPrnaLXuuqE/hqdefault.jpg"}, {"timestamp": "04:18", "seconds": 258.8, "artist": "CloudKid", "title": "They Thought You Were Done. You’re Just Getting St", "url": "https://www.youtube.com/watch?v=qy7cQJlLTLs", "thumbnail": "https://i.ytimg.com/vi/qy7cQJlLTLs/hqdefault.jpg"}, {"timestamp": "04:47", "seconds": 287.3, "artist": "Deadcrow & Caster", "title": "Euphoria", "url": "https://www.youtube.com/watch?v=2M5J9ZSJTjo", "thumbnail": "https://i.ytimg.com/vi/2M5J9ZSJTjo/hqdefault.jpg"}, {"timestamp": "05:15", "seconds": 315.8, "artist": "pyxis & Redemptive", "title": "Arctic Void", "url": "https://www.youtube.com/watch?v=vpkbMRiuv9I", "thumbnail": "https://i.ytimg.com/vi/vpkbMRiuv9I/hqdefault.jpg"}, {"timestamp": "05:44", "seconds": 344.3, "artist": "San Holo", "title": "LETTING GO!!!!!!", "url": "https://www.youtube.com/watch?v=hfy3tLHoYhs", "thumbnail": "https://i.ytimg.com/vi/hfy3tLHoYhs/hqdefault.jpg"}, {"timestamp": "06:12", "seconds": 372.8, "artist": "Lunar Lo Fi & Don Diablo", "title": "Looking4U", "url": "https://www.youtube.com/watch?v=_IkTocJ8oJQ", "thumbnail": "https://i.ytimg.com/vi/_IkTocJ8oJQ/hqdefault.jpg"}, {"timestamp": "06:41", "seconds": 401.3, "artist": "Costa Mee", "title": "This Love Feels", "url": "https://www.youtube.com/watch?v=3HD6hBd82uI", "thumbnail": "https://i.ytimg.com/vi/3HD6hBd82uI/hqdefault.jpg"}, {"timestamp": "07:09", "seconds": 429.8, "artist": "CrystalCore", "title": "HIT ME AGAIN (Lyric Video)", "url": "https://www.youtube.com/watch?v=wwsfQbDPyIQ", "thumbnail": "https://i.ytimg.com/vi/wwsfQbDPyIQ/hqdefault.jpg"}, {"timestamp": "07:38", "seconds": 458.3, "artist": "Maracuja", "title": "Spaccami in due | Sofar Turin", "url": "https://www.youtube.com/watch?v=RgRkEw8lvCg", "thumbnail": "https://i.ytimg.com/vi/RgRkEw8lvCg/hqdefault.jpg"}, {"timestamp": "08:06", "seconds": 486.8, "artist": "triple j", "title": "What’s It Like To Date A Sex Worker? | The Hook Up", "url": "https://www.youtube.com/watch?v=JWy7q3ftLvg", "thumbnail": "https://i.ytimg.com/vi/JWy7q3ftLvg/hqdefault.jpg"}, {"timestamp": "08:35", "seconds": 515.3, "artist": "Berklee College of Music", "title": "How to Audition and Interview", "url": "https://www.youtube.com/watch?v=oH74m5TSeto", "thumbnail": "https://i.ytimg.com/vi/oH74m5TSeto/hqdefault.jpg"}];
    const audio = document.getElementById('audio');
    const playBtn = document.getElementById('playBtn');
    const pauseBtn = document.getElementById('pauseBtn');
    const volumeSlider = document.getElementById('volumeSlider');
    const volumePercent = document.getElementById('volumePercent');
    const marqueeSpan = document.getElementById('marqueeText');
    const currentTimeSpan = document.getElementById('currentTime');
    const durationSpan = document.getElementById('duration');
    const progressFill = document.getElementById('progressFill');
    const tracklistGrid = document.getElementById('tracklistGrid');
    let currentTrackIndex = -1;

    function formatTime(sec) {
        if(isNaN(sec)) return '00:00';
        const m = Math.floor(sec / 60); const s = Math.floor(sec % 60);
        return m + ':' + s.toString().padStart(2,'0');
    }

    function updateProgress() {
        if (audio.duration) {
            progressFill.style.width = (audio.currentTime / audio.duration * 100) + '%';
            let activeIndex = -1;
            for (let i = 0; i < tracks.length; i++) {
                if (audio.currentTime >= tracks[i].seconds - 0.5) activeIndex = i;
            }
            if (activeIndex !== currentTrackIndex && activeIndex !== -1) {
                currentTrackIndex = activeIndex;
                document.querySelectorAll('.track-row').forEach((r, idx) => {
                    if(idx === activeIndex) r.classList.add('active'); else r.classList.remove('active');
                });
                marqueeSpan.textContent = tracks[activeIndex].artist + ' — ' + tracks[activeIndex].title;
            }
        }
        currentTimeSpan.textContent = formatTime(audio.currentTime);
    }

    playBtn.addEventListener('click', () => audio.play());
    pauseBtn.addEventListener('click', () => audio.pause());
    volumeSlider.addEventListener('input', () => { audio.volume = volumeSlider.value/100; volumePercent.textContent = volumeSlider.value+'%'; });
    audio.addEventListener('timeupdate', updateProgress);
    
    tracks.forEach((track) => {
        const row = document.createElement('div'); row.className = 'track-row';
        row.innerHTML = `<div class="track-vignette" style="background-image:url(${track.thumbnail})"></div><div class="track-details"><div class="track-artist-name">${track.artist}</div><div class="track-song-title">${track.title}</div></div><div class="track-duration">${track.timestamp}</div>`;
        tracklistGrid.appendChild(row);
    });
    document.getElementById('copyBtn').addEventListener('click', () => { navigator.clipboard.writeText('https://sarferprod.github.io/sarferprod-dailymix/'); });
</script>
</body>
</html>
