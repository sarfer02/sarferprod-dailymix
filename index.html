<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <title>SARFERPROD • Daily Mix</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        /* ── POLICE LCD REELLE (copiée par mix.py depuis "The Led Display St.ttf") ── */
        @font-face {
            font-family: 'LED Display';
            src: url('led_display.ttf') format('truetype');
            font-display: swap;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #15100a; font-family: 'Inter', sans-serif; min-height: 100vh; padding: 0; overflow: hidden; }
        .stage { width: 100vw; height: 100vh; display: flex; align-items: center; justify-content: center; }

        .console {
            position: relative;
            width: min(100vw, calc(100vh * 16 / 9));
            height: min(100vh, calc(100vw * 9 / 16));
            background-image: url('assets_vintage/panel_full.png');
            background-size: 100% 100%; overflow: hidden;
        }

        /* ── LCD marquee : police LED réelle, taille agrandie, SARFERPROD • date • titre ── */
        .lcd-live {
            position: absolute; left: 27.4%; top: 19%; width: 15.8%; height: 8.8%;
            border-radius: 8px; overflow: hidden; background-color: #030a0d;
            display: flex; align-items: center;
        }
        .lcd-live::before {
            content: ''; position: absolute; inset: 0; pointer-events: none; z-index: 2;
            background: repeating-linear-gradient(0deg, rgba(0,0,0,.22) 0 1px, transparent 1px 3px),
                        linear-gradient(115deg, rgba(255,255,255,.14) 0%, transparent 30%, transparent 70%, rgba(255,255,255,.07) 100%);
        }
        .marquee-track { width: 100%; overflow: hidden; white-space: nowrap; position: relative; z-index: 1; }
        .marquee-track span {
            display: inline-block; padding-left: 100%; animation: scrollTrack 16s linear infinite;
            font-family: 'LED Display', 'Courier New', monospace;
            font-size: clamp(.62rem, 1.2vw, 1.25rem);
            letter-spacing: 2px;
            color: #54e4ff; text-shadow: 0 0 6px rgba(53,224,255,.95), 0 0 16px rgba(53,224,255,.55);
        }
        @keyframes scrollTrack { 0% { transform: translateX(0); } 100% { transform: translateX(-100%); } }

        /* ── Waveform LCD : 3 sinusoides en POINTS reactifs bass/med/aigu ── */
        .wave-live {
            position: absolute; left: 7.9%; top: 34%; width: 37.5%; height: 8.4%;
            border-radius: 8px; overflow: hidden; cursor: pointer;
        }
        .wave-live canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
        /* Ligne de progression SUR la règle : s'allume au survol, clic pour avancer */
        .wave-progress {
            position: absolute; left: 1%; right: 1%; top: 75%; height: 3px; border-radius: 2px;
            background: rgba(255,255,255,.10); cursor: pointer;
            transition: height .12s ease, background .12s ease, box-shadow .12s ease;
        }
        .wave-progress:hover {
            height: 6px; background: rgba(120,240,255,.35);
            box-shadow: 0 0 10px rgba(84,228,255,.9), 0 0 24px rgba(84,228,255,.5);
        }
        .wave-progress-fill {
            width: 0%; height: 100%; border-radius: 2px; pointer-events: none;
            background: linear-gradient(90deg, #1f9dff, #54e4ff); box-shadow: 0 0 6px rgba(53,224,255,.8);
        }
        .wave-times {
            position: absolute; left: 2%; right: 2%; bottom: 0%;
            display: flex; justify-content: space-between;
            font-family: 'LED Display', 'Courier New', monospace;
            font-size: clamp(.4rem, .75vw, .72rem);
            color: rgba(111,230,255,.75);
        }
        .markers-layer { position: absolute; inset: 0; pointer-events: none; }

        /* ── BILLES de la règle : une par morceau, s'allument au survol, vignette au-dessus ── */
        .timeline-marker {
            position: absolute; bottom: 23%;
            width: 1.9%; aspect-ratio: 1 / 1;
            border-radius: 50%;
            background: radial-gradient(circle at 38% 32%, rgba(140,235,255,.55), rgba(40,140,220,.35) 65%);
            transform: translateX(-50%); cursor: pointer; pointer-events: auto;
            transition: all .18s ease;
        }
        .timeline-marker:hover {
            background: radial-gradient(circle at 38% 32%, #eafcff, #54e4ff 55%, #1f9dff);
            box-shadow: 0 0 10px #54e4ff, 0 0 22px rgba(84,228,255,.7), 0 0 38px rgba(50,140,255,.4);
        }
        .marker-thumb {
            position: absolute; bottom: 150%; left: 50%; transform: translateX(-50%) scale(.9);
            width: 84px; height: 52px; border-radius: 6px; background-size: cover; opacity: 0;
            pointer-events: none; border: 2px solid #35e0ff; transition: opacity .2s;
            box-shadow: 0 4px 14px rgba(0,0,0,.6); z-index: 10;
        }
        .timeline-marker:hover .marker-thumb { opacity: 1; }
        .timeline-marker.show .marker-thumb { opacity: 1; }

        /* ── Platine + étiquette YouTube ── */
        .disc-zone { position: absolute; left: 16.7%; top: 54.7%; width: 18.5%; height: 32.9%; }
        .turntable-disc {
            position: absolute; inset: 0; border-radius: 50%; overflow: hidden;
            animation: spin 3.6s linear infinite; animation-play-state: paused;
            will-change: transform;
        }
        body.playing .turntable-disc { animation-play-state: running; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .turntable-disc img { width: 100%; height: 100%; object-fit: cover; display: block; border-radius: 50%; }
        .disc-label {
            position: absolute; top: 50%; left: 50%; width: 35%; height: 35%;
            transform: translate(-50%,-50%); border-radius: 50%;
            background-size: cover; background-position: center; background-color: #140d06;
            border: 2px solid rgba(212,175,55,.9);
            box-shadow: 0 0 12px rgba(0,0,0,.75), inset 0 0 10px rgba(0,0,0,.45);
            transition: box-shadow .3s;
        }
        .disc-label::after {
            content: ''; position: absolute; inset: 0; border-radius: 50%; pointer-events: none;
            background: linear-gradient(115deg, rgba(255,255,255,.25) 0%, transparent 40%, transparent 75%, rgba(255,255,255,.08) 100%);
        }
        .disc-label.flash { box-shadow: 0 0 20px rgba(120,220,255,.9), inset 0 0 10px rgba(0,0,0,.45); }
        .disc-spindle {
            position: absolute; top: 50%; left: 50%; width: 5%; height: 5%;
            transform: translate(-50%,-50%); border-radius: 50%; z-index: 3; pointer-events: none;
            background: radial-gradient(circle at 35% 30%, #ffe9b0, #c9a13b 55%, #6e5a2a);
            box-shadow: 0 0 6px rgba(255,220,120,.8);
        }

        /* ── Anneau LEDs ── */
        .led-ring { position: absolute; inset: -5.5%; pointer-events: none; }
        .led-ring .ring-led {
            position: absolute; top: 50%; left: 50%;
            width: clamp(3px, .5vw, 8px); height: clamp(3px, .5vw, 8px); border-radius: 50%;
            background: rgba(255,255,255,.07);
            transform: translate(-50%,-50%) rotate(var(--a)) translateY(-53%);
            transition: background .09s linear, box-shadow .09s linear;
        }
        .led-ring .ring-led.on { background: var(--c); box-shadow: 0 0 6px var(--c), 0 0 14px var(--c), 0 0 24px var(--c); }

        /* ── Hotspots : lueur bleue incandescente (triple halo + interne) ── */
        .hotspot {
            position: absolute; left: var(--l); top: var(--t); width: var(--w); height: var(--h);
            background: transparent; border: none; border-radius: 50%; cursor: pointer; padding: 0;
            transition: box-shadow .2s;
        }
        .hotspot:hover {
            box-shadow: 0 0 18px rgba(90,190,255,.95),
                        0 0 42px rgba(50,140,255,.65),
                        0 0 70px rgba(30,100,255,.35),
                        inset 0 0 16px rgba(90,190,255,.5);
        }
        .hotspot.lit {
            box-shadow: 0 0 22px rgba(90,190,255,1),
                        0 0 50px rgba(50,140,255,.8),
                        0 0 80px rgba(30,100,255,.45),
                        inset 0 0 20px rgba(90,190,255,.6);
        }

        /* ── LE SEUL CROSSFADER (rail horizontal) = VOLUME, poignée = VRAI capot ── */
        .cross-zone {
            position: absolute; left: 7.4%; top: 82.9%; width: 8.3%; height: 6%;
            cursor: pointer; touch-action: none;
        }
        .cross-knob {
            position: absolute; top: 50%; left: 70%; width: 22%; height: 84%;
            transform: translate(-50%,-50%); pointer-events: none;
            filter: drop-shadow(0 2px 5px rgba(0,0,0,.65));
        }

        /* ── PLAYLIST : 6 cases + slots (calage calibrateur) ── */
        .playlist-zone {
            position: absolute; left: 51.8%; top: 23.5%; width: 43.2%; height: 60.9%;
            display: flex; flex-direction: column; padding: 0;
        }
        .tracklist-grid { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 6.4%; padding-right: 0; }
        .tracklist-grid::-webkit-scrollbar { width: 0; }
        .track-row {
            flex: 0 0 auto; height: 11.35%;
            display: flex; align-items: center;
            padding: 0; background: transparent; border: none; border-radius: 6px;
            transition: background .2s ease;
        }
        .track-row:hover { background: rgba(255,214,120,.07); }
        .track-row.active { background: rgba(120,220,255,.10); }
        .track-vignette-link { text-decoration: none; flex: 0 0 16%; height: 100%; display: block; }
        .track-vignette {
            position: relative; width: 100%; height: 100%; border-radius: 6px;
            background-size: cover; background-position: center; cursor: pointer; transition: all .2s;
            border: 2px solid rgba(201,161,59,.95);
            box-shadow: inset 0 0 10px rgba(0,0,0,.55), 0 2px 6px rgba(0,0,0,.5);
        }
        .track-vignette::after {
            content: ''; position: absolute; inset: 0; border-radius: 4px; pointer-events: none;
            background: linear-gradient(115deg, rgba(255,255,255,.25) 0%, transparent 38%, transparent 72%, rgba(255,255,255,.07) 100%);
        }
        .track-vignette-link:hover .track-vignette { transform: scale(1.04); box-shadow: 0 0 10px rgba(120,220,255,.6); }
        .track-details { flex: 1; cursor: pointer; min-width: 0; margin-left: 5.5%; height: 70%; display: flex; flex-direction: column; justify-content: center; }
        .track-artist-name { font-weight: 600; color: #ffd98a; font-size: clamp(.48rem, .95vw, .92rem); text-shadow: 0 1px 3px rgba(0,0,0,.95), 0 0 8px rgba(0,0,0,.7); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .track-song-title { font-style: italic; color: rgba(242,226,196,.85); font-size: clamp(.4rem, .8vw, .78rem); text-shadow: 0 1px 3px rgba(0,0,0,.95); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .track-duration { font-family: 'LED Display', 'Courier New', monospace; font-size: clamp(.4rem, .75vw, .7rem); color: #9feeff; flex-shrink: 0; margin-right: 2%; text-shadow: 0 1px 3px rgba(0,0,0,.95); }

        .under-console {
            position: fixed; bottom: 6px; left: 0; right: 0;
            text-align: center; z-index: 50; pointer-events: none;
        }
        .copy-btn {
            pointer-events: auto; opacity: .75;
            background: rgba(28,18,8,.85); border: 1px solid rgba(212,175,55,.6); border-radius: 30px;
            color: #ffe9b0; font-family: 'Courier New', monospace; font-size: .68rem;
            padding: 5px 18px; cursor: pointer; text-shadow: 0 0 6px rgba(255,233,176,.4); transition: all .25s;
        }
        .copy-btn:hover { opacity: 1; color: #7ce8ff; border-color: #35e0ff; box-shadow: 0 0 14px rgba(53,224,255,.45); }
    </style>
</head>
<body>
<div class="stage">
    <div class="console">
        <div class="lcd-live"><div class="marquee-track"><span id="marqueeText">• SARFERPROD • 06/10/2026 • APPUYEZ SUR PLAY • SARFERPROD • 06/10/2026 •</span></div></div>

        <div class="wave-live" id="waveZone">
            <canvas id="waveformCanvas"></canvas>
            <div class="markers-layer" id="markersLayer"></div>
            <div class="wave-progress" id="progressBar"><div class="wave-progress-fill" id="progressFill"></div></div>
            <div class="wave-times"><span id="currentTime">00:00</span><span id="duration">7:51</span></div>
        </div>

        <div class="disc-zone">
            <div class="led-ring" id="ledRing"></div>
            <div class="turntable-disc">
                <img src="assets_vintage/turntable.png" alt="">
                <div class="disc-label" id="discLabel" style="background-image:url('https://i.ytimg.com/vi/zEP4B8SgwtU/hqdefault.jpg')"></div>
            </div>
            <div class="disc-spindle"></div>
        </div>

        <button class="hotspot" id="pauseBtn" style="--l:6.5%; --t:52.1%; --w:6.0%; --h:11%;" title="Pause"></button>
        <button class="hotspot" id="playBtn"  style="--l:6.4%; --t:67.2%; --w:5.9%; --h:10.3%;" title="Play"></button>

        <div class="cross-zone" id="crossZone" title="Volume">
            <img class="cross-knob" id="crossKnob" src="assets_vintage/fader_cross_knob.png" alt="">
        </div>

        <a class="hotspot" id="waBtn" style="--l:20.9%; --t:43.9%; --w:2.6%; --h:4.8%; border-radius:6px;" title="WhatsApp"></a>
        <a class="hotspot" id="scBtn" style="--l:23.9%; --t:43.8%; --w:2.6%; --h:4.8%; border-radius:6px;" title="SoundCloud"></a>
        <a class="hotspot" id="mailBtn" style="--l:26.7%; --t:43.8%; --w:2.5%; --h:4.8%; border-radius:6px;" title="Email"></a>
        <a class="hotspot" id="fbBtn" style="--l:29.5%; --t:43.8%; --w:2.6%; --h:4.8%; border-radius:6px;" title="Facebook"></a>

        <div class="playlist-zone">
            <div class="tracklist-grid" id="tracklistGrid"></div>
        </div>
    </div>
</div>
<div class="under-console"><button class="copy-btn" id="copyBtn">Copier le lien du mix</button></div>
<audio id="audio" preload="auto" crossorigin="anonymous"></audio>
<script>
    const tracks = [{"timestamp": "00:30", "seconds": 30.8, "artist": "Helado Tropical", "title": "Sensacio\u0301n (Live on KEXP)", "url": "https://www.youtube.com/watch?v=zEP4B8SgwtU", "thumbnail": "https://i.ytimg.com/vi/zEP4B8SgwtU/hqdefault.jpg"}, {"timestamp": "00:59", "seconds": 59.3, "artist": "QZB & Duskee", "title": "Colder At The Peak", "url": "https://www.youtube.com/watch?v=ZJ7Vu_X0wGg", "thumbnail": "https://i.ytimg.com/vi/ZJ7Vu_X0wGg/hqdefault.jpg"}, {"timestamp": "01:27", "seconds": 87.8, "artist": "Lara", "title": "Sleep through it", "url": "https://www.youtube.com/watch?v=TLOwv4l631I", "thumbnail": "https://i.ytimg.com/vi/TLOwv4l631I/hqdefault.jpg"}, {"timestamp": "01:56", "seconds": 116.3, "artist": "YORK x Bella Claxton & Mike Momburg", "title": "On The Beach (Official Music Video)", "url": "https://www.youtube.com/watch?v=QhVlEXGWa3Y", "thumbnail": "https://i.ytimg.com/vi/QhVlEXGWa3Y/hqdefault.jpg"}, {"timestamp": "02:24", "seconds": 144.8, "artist": "The Nightclubs", "title": "CD-R", "url": "https://www.youtube.com/watch?v=GpE2YKmbi1Y", "thumbnail": "https://i.ytimg.com/vi/GpE2YKmbi1Y/hqdefault.jpg"}, {"timestamp": "02:53", "seconds": 173.3, "artist": "Virtual Riot & Whales", "title": "Insanity [Hybrid Trap | Monstercat]", "url": "https://www.youtube.com/watch?v=RUKdk6NJpHU", "thumbnail": "https://i.ytimg.com/vi/RUKdk6NJpHU/hqdefault.jpg"}, {"timestamp": "03:21", "seconds": 201.8, "artist": "Bluhm", "title": "Pontiac", "url": "https://www.youtube.com/watch?v=V8AlNn1woiQ", "thumbnail": "https://i.ytimg.com/vi/V8AlNn1woiQ/hqdefault.jpg"}, {"timestamp": "03:50", "seconds": 230.3, "artist": "AL GREEN", "title": "Tired of Being Alone (Martin Gray) (Re-Edit) (1971", "url": "https://www.youtube.com/watch?v=X3j-2Ra8SqQ", "thumbnail": "https://i.ytimg.com/vi/X3j-2Ra8SqQ/hqdefault.jpg"}, {"timestamp": "04:18", "seconds": 258.8, "artist": "Helado Tropical", "title": "De\u0301jate Caer (Live on KEXP)", "url": "https://www.youtube.com/watch?v=R4Af5fwS4AE", "thumbnail": "https://i.ytimg.com/vi/R4Af5fwS4AE/hqdefault.jpg"}, {"timestamp": "04:47", "seconds": 287.3, "artist": "Helado Tropical", "title": "Fluye (Live on KEXP)", "url": "https://www.youtube.com/watch?v=lUbzwb80sd8", "thumbnail": "https://i.ytimg.com/vi/lUbzwb80sd8/hqdefault.jpg"}, {"timestamp": "05:15", "seconds": 315.8, "artist": "Hamdi & D Double E", "title": "Heart & Soul", "url": "https://www.youtube.com/watch?v=TuE1-tyb2Fs", "thumbnail": "https://i.ytimg.com/vi/TuE1-tyb2Fs/hqdefault.jpg"}, {"timestamp": "05:44", "seconds": 344.3, "artist": "KEXP", "title": "Helado Tropical performs \"Tocando\" & more Live on ", "url": "https://www.youtube.com/watch?v=p0xEdSGVYQk", "thumbnail": "https://i.ytimg.com/vi/p0xEdSGVYQk/hqdefault.jpg"}, {"timestamp": "05:58", "seconds": 358.3, "artist": "Criminal Issues", "title": "Run For Cover", "url": "https://www.youtube.com/watch?v=-ZSoSaeoK-g", "thumbnail": "https://i.ytimg.com/vi/-ZSoSaeoK-g/hqdefault.jpg"}, {"timestamp": "06:26", "seconds": 386.8, "artist": "Helado Tropical", "title": "Tocando (Live on KEXP)", "url": "https://www.youtube.com/watch?v=oFxaH-mKRgg", "thumbnail": "https://i.ytimg.com/vi/oFxaH-mKRgg/hqdefault.jpg"}, {"timestamp": "06:55", "seconds": 415.3, "artist": "Computerwife", "title": "You Didn't Know", "url": "https://www.youtube.com/watch?v=xrB2GamOmXw", "thumbnail": "https://i.ytimg.com/vi/xrB2GamOmXw/hqdefault.jpg"}];
    const PAGE_URL = 'https://sarfer02.github.io/sarferprod-dailymix';
    const DATE_STR = '06/10/2026';
    const audio = document.getElementById('audio');
    audio.src = './latest.mp3?v=' + Date.now();
    audio.volume = 0.7;
    const playBtn = document.getElementById('playBtn');
    const pauseBtn = document.getElementById('pauseBtn');
    const marqueeSpan = document.getElementById('marqueeText');
    const currentTimeSpan = document.getElementById('currentTime');
    const progressFill = document.getElementById('progressFill');
    const tracklistGrid = document.getElementById('tracklistGrid');
    const markersLayer = document.getElementById('markersLayer');
    const discLabel = document.getElementById('discLabel');
    const crossZone = document.getElementById('crossZone');
    const crossKnob = document.getElementById('crossKnob');
    const totalDurationSec = 471.544;
    let currentTrackIndex = -1;

    function formatTime(sec) {
        if(isNaN(sec)) return '00:00';
        const m = Math.floor(sec / 60); const s = Math.floor(sec % 60);
        return m + ':' + s.toString().padStart(2,'0');
    }

    function flashDiscLabel() {
        discLabel.classList.add('flash');
        setTimeout(() => discLabel.classList.remove('flash'), 1200);
    }

    function updateProgress() {
        if (audio.duration) {
            progressFill.style.width = (audio.currentTime / audio.duration * 100) + '%';
            let activeIndex = -1;
            for (let i = 0; i < tracks.length; i++) {
                if (audio.currentTime >= tracks[i].seconds - 0.5) activeIndex = i;
            }
            if (activeIndex !== currentTrackIndex && activeIndex !== -1) {
                currentTrackIndex = activeIndex;
                document.querySelectorAll('.track-row').forEach((r, idx) => {
                    if(idx === activeIndex) r.classList.add('active'); else r.classList.remove('active');
                });
                marqueeSpan.textContent = '• SARFERPROD • ' + DATE_STR + ' • ' + tracks[activeIndex].artist + ' --- ' + tracks[activeIndex].title + ' •';
                discLabel.style.backgroundImage = "url('" + tracks[activeIndex].thumbnail + "')";
            }
        }
        currentTimeSpan.textContent = formatTime(audio.currentTime);
    }

    function startPlaying() {
        initAudioContext(); audio.play();
        document.body.classList.add('playing');
        playBtn.classList.add('lit');
    }
    function stopPlaying() {
        audio.pause();
        document.body.classList.remove('playing');
        playBtn.classList.remove('lit');
    }

    playBtn.addEventListener('click', startPlaying);
    pauseBtn.addEventListener('click', stopPlaying);
    audio.addEventListener('timeupdate', updateProgress);
    audio.addEventListener('ended', stopPlaying);

    /* ── Crossfader (rail horizontal) = VOLUME, poignée = vrai capot ── */
    let volDragging = false;
    function setVolume(e) {
        const r = crossZone.getBoundingClientRect();
        let v = (e.clientX - r.left) / r.width;
        v = Math.max(0, Math.min(1, v));
        audio.volume = v;
        crossKnob.style.left = (v * 100) + '%';
    }
    crossZone.addEventListener('pointerdown', e => { volDragging = true; crossZone.setPointerCapture(e.pointerId); setVolume(e); });
    crossZone.addEventListener('pointermove', e => { if (volDragging) setVolume(e); });
    crossZone.addEventListener('pointerup', () => volDragging = false);
    crossKnob.style.left = '70%';

    /* ── Timeline : clic dans l'écran OU sur la ligne allumée = avancer ── */
    const waveZone = document.getElementById('waveZone');
    const progressBar = document.getElementById('progressBar');
    function doSeek(e) {
        if (e.target.closest('.timeline-marker')) return;
        const r = waveZone.getBoundingClientRect();
        const percent = (e.clientX - r.left) / r.width;
        if (audio.duration) audio.currentTime = percent * audio.duration;
        else if (totalDurationSec) audio.currentTime = percent * totalDurationSec;
    }
    waveZone.addEventListener('click', doSeek);
    progressBar.addEventListener('click', doSeek);

    let audioCtx, analyser, dataArray, sourceNode;
    function initAudioContext() {
        if (!audioCtx) {
            try {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                analyser = audioCtx.createAnalyser(); analyser.fftSize = 256;
                dataArray = new Uint8Array(analyser.frequencyBinCount);
                sourceNode = audioCtx.createMediaElementSource(audio);
                sourceNode.connect(analyser); analyser.connect(audioCtx.destination);
            } catch (e) { console.warn("AudioContext bloqué", e); }
        }
    }

    /* ── Anneau de LEDs ── */
    const LED_COLORS = [
        '#0b2a7a', '#10359c', '#1543c4', '#1a55e8',
        '#2e6bff', '#3f82ff', '#549aff', '#6fb0ff',
        '#8ec5ff', '#a9d8ff', '#c2e8ff', '#7cf5e8',
        '#4dffd2', '#2fffc4', '#18f5b5', '#00e8a8'
    ];
    const ledRing = document.getElementById('ledRing');
    const ringLeds = [];
    LED_COLORS.forEach((c, i) => {
        const led = document.createElement('div');
        led.className = 'ring-led';
        led.style.setProperty('--a', (i / LED_COLORS.length * 360) + 'deg');
        led.style.setProperty('--c', c);
        ledRing.appendChild(led);
        ringLeds.push(led);
    });
    let ledLevel = 0, targetLevel = 0;
    function updateLeds() {
        ledLevel += (targetLevel - ledLevel) * 0.22;
        const active = Math.round(ledLevel * ringLeds.length);
        ringLeds.forEach((led, i) => led.classList.toggle('on', i < active));
    }

    /* ── Visualiseur LCD : 3 sinusoides EN POINTS RECTANGULAIRES,
          chacune pilotée par SA bande (bass / mid / treble) ── */
    const waveCanvas = document.getElementById('waveformCanvas');
    const waveCtx = waveCanvas.getContext('2d');
    let wavePhase = 0;

    function resizeWaveCanvas() {
        const rect = waveCanvas.getBoundingClientRect();
        waveCanvas.width = rect.width; waveCanvas.height = rect.height;
    }
    window.addEventListener('resize', resizeWaveCanvas);
    setTimeout(resizeWaveCanvas, 60);

    /* Une sinusoïde dessinée en petits rectangles luminescents (typo LCD) */
    function drawLcdWave(freq, phaseOffset, speedMult, amp, color, dotW, dotH, blur) {
        const w = waveCanvas.width, h = waveCanvas.height, mid = h * 0.40;
        waveCtx.fillStyle = color;
        waveCtx.shadowColor = color;
        waveCtx.shadowBlur = blur;
        for (let x = 0; x <= w; x += dotW + 2) {
            const y = mid + Math.sin((x * freq) + wavePhase * speedMult + phaseOffset) * amp;
            waveCtx.fillRect(x, y - dotH / 2, dotW, dotH);
        }
    }

    function animateWave() {
        const w = waveCanvas.width, h = waveCanvas.height;
        waveCtx.clearRect(0, 0, w, h);
        let bass = 0, midFreq = 0, treble = 0;
        if (!audio.paused && analyser) {
            analyser.getByteFrequencyData(dataArray);
            let bassSum = 0; for(let i=0; i<5; i++) bassSum += dataArray[i]; bass = (bassSum/5)/255;
            let midSum = 0; for(let i=5; i<20; i++) midSum += dataArray[i]; midFreq = (midSum/15)/255;
            let trebSum = 0; for(let i=20; i<60; i++) trebSum += dataArray[i]; treble = (trebSum/40)/255;
            targetLevel = Math.min(1, bass * 0.55 + midFreq * 0.3 + treble * 0.15 + 0.06);
        } else {
            targetLevel = 0;
        }
        updateLeds();

        const base = h * 0.17;
        const ampBass = audio.paused ? h * 0.07 : base * (0.30 + bass   * 1.50);
        const ampMid  = audio.paused ? h * 0.05 : base * (0.25 + midFreq * 1.70);
        const ampTreb = audio.paused ? h * 0.04 : base * (0.20 + treble * 2.20);

        /* 1) BASSES : onde lente et ample, points larges, bleu profond */
        drawLcdWave(0.022, 0, 0.6, ampBass, 'rgba(40,140,220,0.95)', 4, 4, 8);
        /* 2) MEDIUMS : onde moyenne contre-phase, points moyens, bleu clair */
        drawLcdWave(0.048, Math.PI / 3, -1.25, ampMid, 'rgba(92,214,255,0.9)', 3, 3, 7);
        /* 3) AIGUS : onde rapide et fine, tout petits points, blanc-turquoise */
        drawLcdWave(0.095, Math.PI / 1.5, 1.9, ampTreb, 'rgba(200,250,255,0.85)', 2, 2, 5);

        /* OCCLUSION AMBIANTE : voile radial sombre PAR-DESSUS les ondes (effet tube LCD) */
        const grad = waveCtx.createRadialGradient(w/2, h*0.42, h*0.14, w/2, h*0.5, w*0.60);
        grad.addColorStop(0, 'rgba(0,0,0,0)');
        grad.addColorStop(0.72, 'rgba(0,6,10,0.30)');
        grad.addColorStop(1, 'rgba(0,6,10,0.66)');
        waveCtx.fillStyle = grad;
        waveCtx.fillRect(0, 0, w, h);

        /* Playhead LCD par-dessus (reste visible) */
        if (audio.duration) {
            const px = Math.floor((audio.currentTime / audio.duration) * w);
            waveCtx.fillStyle = '#c8faff';
            waveCtx.shadowColor = '#c8faff';
            waveCtx.shadowBlur = 10;
            waveCtx.fillRect(px - 1, Math.floor(h * 0.04), 2, Math.floor(h * 0.70));
        }
        waveCtx.shadowBlur = 0;
        wavePhase += 0.045;
        requestAnimationFrame(animateWave);
    }
    animateWave();

    /* ── Tracklist : vignettes dans les cases, textes sur les slots ── */
    tracks.forEach((track, i) => {
        const row = document.createElement('div'); row.className = 'track-row';
        const vignetteLink = document.createElement('a'); vignetteLink.className = 'track-vignette-link';
        vignetteLink.href = track.url; vignetteLink.target = '_blank'; vignetteLink.rel = 'noopener';
        vignetteLink.innerHTML = `<div class="track-vignette" style="background-image:url(${track.thumbnail})"></div>`;
        const detailsDiv = document.createElement('div'); detailsDiv.className = 'track-details';
        detailsDiv.dataset.seconds = track.seconds;
        detailsDiv.innerHTML = `<div class="track-artist-name">${track.artist}</div><div class="track-song-title">${track.title}</div>`;
        detailsDiv.addEventListener('click', () => {
            audio.currentTime = track.seconds;
            discLabel.style.backgroundImage = "url('" + track.thumbnail + "')";
            flashDiscLabel();
            startPlaying();
        });
        const durationDiv = document.createElement('div'); durationDiv.className = 'track-duration';
        durationDiv.textContent = `${track.timestamp}`;
        row.appendChild(vignetteLink); row.appendChild(detailsDiv); row.appendChild(durationDiv);
        tracklistGrid.appendChild(row);
    });

    /* ── BILLES de la règle : clic = seek + vignette YouTube dans le médaillon ── */
    tracks.forEach((track) => {
        const marker = document.createElement('div'); marker.className = 'timeline-marker';
        marker.dataset.seconds = track.seconds;
        marker.title = track.artist + ' — ' + track.title;
        marker.innerHTML = `<div class="marker-thumb" style="background-image:url(${track.thumbnail})"></div>`;
        marker.addEventListener('click', (e) => {
            e.stopPropagation();
            audio.currentTime = track.seconds;
            discLabel.style.backgroundImage = "url('" + track.thumbnail + "')";
            flashDiscLabel();
            document.querySelectorAll('.timeline-marker.show').forEach(m => m.classList.remove('show'));
            marker.classList.add('show');
            setTimeout(() => marker.classList.remove('show'), 1600);
            startPlaying();
        });
        markersLayer.appendChild(marker);
    });

    document.getElementById('waBtn').addEventListener('click', () => window.open('https://wa.me/?text=' + encodeURIComponent('Sarferprod Daily Mix -> ' + PAGE_URL), '_blank'));
    document.getElementById('scBtn').addEventListener('click', () => window.open('https://soundcloud.com/', '_blank'));
    document.getElementById('mailBtn').addEventListener('click', () => { location.href = 'mailto:?subject=' + encodeURIComponent('Sarferprod Daily Mix') + '&body=' + encodeURIComponent(PAGE_URL); });
    document.getElementById('fbBtn').addEventListener('click', () => window.open('https://www.facebook.com/sharer/sharer.php?u=' + encodeURIComponent(PAGE_URL), '_blank'));
    document.getElementById('copyBtn').addEventListener('click', () => navigator.clipboard.writeText(PAGE_URL));
</script>
