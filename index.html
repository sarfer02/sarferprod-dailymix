<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SARFERPROD • Daily Mix</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-image: url('001.png');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px 20px;
            color: #fff;
        }
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.45);
            backdrop-filter: blur(5px);
            pointer-events: none;
            z-index: 0;
        }
        .container { max-width: 950px; width: 100%; margin: 0 auto; position: relative; z-index: 1; }
        .victorian-header {
            background: rgba(0, 0, 0, 0.6); backdrop-filter: blur(12px);
            border: 1.5px solid rgba(255, 140, 0, 0.6); border-radius: 20px;
            padding: 25px 30px; margin-bottom: 25px; text-align: center;
            box-shadow: 0 8px 32px rgba(255, 140, 0, 0.2);
        }
        .header-logos { display: flex; justify-content: center; gap: 15px; flex-wrap: wrap; margin-bottom: 15px; }
        .header-logos img { height: 50px; width: auto; filter: drop-shadow(0 2px 8px rgba(0,0,0,0.5)); }
        .free-badge {
            display: inline-block; background: rgba(255, 140, 0, 0.25);
            border: 1px solid rgba(255, 140, 0, 0.7); border-radius: 40px;
            padding: 5px 22px; font-family: monospace; font-size: 0.75rem;
            color: #ffaa55; margin-bottom: 14px; font-weight: bold; letter-spacing: 2px;
        }
        .event-date { display: flex; justify-content: center; gap: 25px; font-family: 'Georgia', serif; font-size: 0.85rem; color: rgba(255, 245, 220, 0.8); letter-spacing: 1.5px; flex-wrap: wrap; }
        .glass-card {
            background: rgba(15, 15, 28, 0.55); backdrop-filter: blur(20px);
            border-radius: 32px; border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.4); padding: 35px 30px; margin-bottom: 24px;
        }
        .portrait-wrapper { display: flex; justify-content: center; margin-bottom: 25px; }
        .lens-portrait {
            width: 130px; height: 130px; border-radius: 50%; overflow: hidden;
            border: 3.5px solid #ff8c00; cursor: pointer; box-shadow: 0 0 20px rgba(255, 140, 0, 0.4);
            transition: all 0.3s ease;
        }
        .lens-portrait img { width: 100%; height: 100%; object-fit: cover; }
        .track-title-frame {
            border: 1.5px solid rgba(255, 140, 0, 0.5); border-radius: 60px;
            padding: 14px 24px; background: rgba(0, 0, 0, 0.4); margin-bottom: 30px;
        }
        .marquee-track { width: 100%; overflow: hidden; white-space: nowrap; }
        .marquee-track span { display: inline-block; padding-left: 100%; animation: scrollTrack 16s linear infinite; font-family: 'Georgia', serif; font-size: 1.1rem; font-style: italic; color: rgba(255, 220, 150, 0.95); }
        @keyframes scrollTrack { 0% { transform: translateX(0); } 100% { transform: translateX(-100%); } }
        .controls-center { display: flex; justify-content: center; align-items: center; gap: 35px; margin-bottom: 25px; }
        .btn-img { background: none; border: none; cursor: pointer; transition: transform 0.2s; width: 70px; height: 70px; }
        .btn-img img { width: 100%; height: 100%; object-fit: contain; }
        .btn-img:hover { transform: scale(1.12); filter: drop-shadow(0 0 12px #ff8c00); }
        .volume-control { display: flex; justify-content: center; align-items: center; gap: 14px; margin-bottom: 25px; background: rgba(0,0,0,0.2); padding: 8px 20px; border-radius: 30px; display: inline-flex; margin-left: 50%; transform: translateX(-50%); }
        .volume-slider { width: 130px; height: 5px; -webkit-appearance: none; background: rgba(255, 255, 255, 0.25); border-radius: 4px; outline: none; }
        .volume-slider::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 14px; border-radius: 50%; background: #ff8c00; cursor: pointer; }
        .progress-section { margin: 10px 0 10px; position: relative; }
        canvas { width: 100%; height: 90px; border-radius: 20px; display: block; background: rgba(0, 0, 0, 0.45); margin-bottom: 12px; }
        .progress-container-box { position: relative; width: 100%; margin-bottom: 10px; }
        .progress-wrapper { width: 100%; height: 6px; background: rgba(255, 255, 255, 0.15); border-radius: 4px; cursor: pointer; position: relative; z-index: 5; }
        .progress-fill-led { width: 0%; height: 100%; background: linear-gradient(90deg, #ff5500, #ff8c00, #ffcc00); border-radius: 4px; box-shadow: 0 0 8px #ff8c00; }
        
        /* TIMELINE CONTROLS ET ANCHORAGE FIXE */
        .markers-layer { position: absolute; width: 100%; height: 20px; top: -7px; left: 0; z-index: 20; }
        
        .timeline-marker { 
            position: absolute; width: 8px; height: 20px; background: #ff8c00; 
            border-radius: 4px; transform: translateX(-50%); cursor: pointer;
        }
        .timeline-marker:hover { background: #ffaa00; box-shadow: 0 0 8px #ffaa00; }
        
        /* L'infobulle intègre désormais une marge de collision pour maintenir le survol de la souris */
        .marker-tooltip { 
            position: absolute; bottom: 15px; left: 50%; transform: translateX(-50%); 
            background: rgba(12, 12, 25, 0.98); border-radius: 14px; padding: 10px; 
            border: 2px solid rgba(255, 140, 0, 0.4); width: 180px; text-align: center; 
            display: none; pointer-events: auto; box-shadow: 0 10px 25px rgba(0,0,0,0.6);
            padding-bottom: 15px;
        }
        
        /* Règle de persistance du survol : le marqueur ou l'infobulle elle-même maintient l'affichage */
        .timeline-marker:hover .marker-tooltip,
        .marker-tooltip:hover { 
            display: block !important; 
            border-color: #ff8c00;
        }
        
        /* CHANGEMENT D'ASPECT DEMANDÉ SUR LA VIGNETTE AU SURVOL */
        .tooltip-thumb-wrapper { 
            width: 100%; height: 95px; border-radius: 8px; overflow: hidden; 
            margin-bottom: 8px; border: 1px solid rgba(255, 255, 255, 0.15);
            transition: all 0.25s ease-in-out; cursor: pointer; position: relative;
        }
        .tooltip-thumb-wrapper img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.25s; }
        
        /* Effets visuels précis au survol de la vignette */
        .tooltip-thumb-wrapper:hover {
            border-color: #ff8c00;
            box-shadow: 0 0 15px rgba(255, 140, 0, 0.8);
            transform: scale(1.03);
        }
        .tooltip-thumb-wrapper:hover img { transform: scale(1.06); }
        
        /* Filigrane d'action "Play/Link" sur la vignette */
        .tooltip-thumb-wrapper::after {
            content: '🔗 WATCH'; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255, 140, 0, 0.25); display: flex; align-items: center; justify-content: center;
            color: #fff; font-size: 0.75rem; font-weight: bold; font-family: monospace; opacity: 0; transition: opacity 0.2s;
        }
        .tooltip-thumb-wrapper:hover::after { opacity: 1; }

        .marker-tooltip .tooltip-title { font-size: 0.78rem; color: #ffcc88; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .time-row { display: flex; justify-content: space-between; font-size: 0.8rem; color: rgba(255, 245, 220, 0.6); font-family: monospace; }
        .tracklist-header { text-align: center; margin-bottom: 25px; }
        .tracklist-title { font-family: 'Georgia', serif; font-size: 1.5rem; color: #ffcc88; letter-spacing: 6px; text-transform: uppercase; border-bottom: 1.5px solid rgba(255, 140, 0, 0.4); display: inline-block; padding-bottom: 10px; }
        .tracklist-grid { display: grid; gap: 10px; max-height: 450px; overflow-y: auto; }
        .track-row { display: flex; align-items: center; gap: 16px; padding: 12px 16px; background: rgba(0, 0, 0, 0.3); border-radius: 18px; cursor: pointer; transition: all 0.2s; border-left: 4px solid transparent; }
        .track-row:hover { background: rgba(0, 0, 0, 0.55); transform: translateX(6px); border-left-color: rgba(255, 140, 0, 0.5); }
        .track-row.active { background: rgba(255, 140, 0, 0.18); border-left-color: #ff8c00; }
        .track-vignette { width: 55px; height: 55px; border-radius: 10px; background-size: cover; background-position: center; flex-shrink: 0; }
        .track-details { flex: 1; min-width: 0; }
        .track-artist-name { font-weight: 600; color: #ffcc88; font-size: 0.9rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .track-song-title { font-style: italic; color: rgba(255, 245, 220, 0.75); font-size: 0.82rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .track-link { font-size: 0.75rem; color: #ff8c00; text-decoration: none; padding: 5px 12px; border-radius: 20px; background: rgba(255, 140, 0, 0.15); border: 1px solid rgba(255, 140, 0, 0.3); }
    </style>
</head>
<body>
<div class="container">
    <div class="victorian-header">
        <div class="header-logos">
            <img src="title_sarferprod.png" alt="SARFERPROD">
            <img src="title_daily.png" alt="DAILY">
            <img src="title_sampler.png" alt="SAMPLE">
        </div>
        <div class="free-badge">FREE ENTRY</div>
        <div class="event-date">
            <span>SUN 05TH</span>
            <span>JUL</span>
            <span>10:24</span>
        </div>
    </div>
    
    <div class="glass-card">
        <div class="portrait-wrapper">
            <div class="lens-portrait" onclick="window.open('https://soundcloud.com/sarferprod', '_blank')">
                <img src="Radio_SARFERPROD.jpeg" alt="SARFERPROD">
            </div>
        </div>
        <div class="track-title-frame">
            <div class="marquee-track"><span id="marqueeText">Clique sur Play pour démarrer...</span></div>
        </div>
        <div class="controls-center">
            <button class="btn-img" id="playBtn"><img src="btn_play.png" alt="Play"></button>
            <button class="btn-img" id="pauseBtn"><img src="btn_pause.png" alt="Pause"></button>
        </div>
        <div class="volume-control">
            <input type="range" id="volumeSlider" class="volume-slider" min="0" max="100" value="70">
            <span class="volume-text" id="volumePercent">70%</span>
        </div>
        <div class="progress-section">
            <canvas id="waveformCanvas" width="800" height="90"></canvas>
            <div class="progress-container-box">
                <div class="progress-wrapper" id="progressBar"><div class="progress-fill-led" id="progressFill"></div></div>
                <div class="markers-layer" id="markersLayer"></div>
            </div>
            <div class="time-row"><span id="currentTime">00:00</span><span id="duration">3:32</span></div>
        </div>
    </div>
    
    <div class="glass-card">
        <div class="tracklist-header"><div class="tracklist-title">TRACKLIST INTERACTIVE (4 PISTES)</div></div>
        <div class="tracklist-grid" id="tracklistGrid"></div>
    </div>
</div>

<script>
    const tracks = [{"timestamp": "00:30", "seconds": 30.772, "artist": "2 Meter Sessions", "title": "Suede\u2019s classic song Trash \u2013 90s Britpop Magic in 30s!", "url": "https://www.youtube.com/watch?v=W0Pbch28zE8", "thumbnail": "https://i.ytimg.com/vi/W0Pbch28zE8/mqdefault.jpg"}, {"timestamp": "00:59", "seconds": 59.665, "artist": "2 Meter Sessions", "title": "This 90s Live Performance Hits Every Time \ud83c\udfb8  #music #90smusic", "url": "https://www.youtube.com/watch?v=ziv8nYKi-NI", "thumbnail": "https://i.ytimg.com/vi/ziv8nYKi-NI/mqdefault.jpg"}, {"timestamp": "01:32", "seconds": 92.9, "artist": "2 Meter Sessions", "title": "Nils Lofgren \u2013 Shine Silently | 2 Meter Sessions 1995 Live short", "url": "https://www.youtube.com/watch?v=xYh6khTRD9A", "thumbnail": "https://i.ytimg.com/vi/xYh6khTRD9A/mqdefault.jpg"}, {"timestamp": "02:29", "seconds": 149.331, "artist": "2 Meter Sessions", "title": "Frente! cover the Jackson 5 on 2 Meter Sessions, live in 1994  #music #livemusic #jackson5", "url": "https://www.youtube.com/watch?v=KAp13uSWD4M", "thumbnail": "https://i.ytimg.com/vi/KAp13uSWD4M/mqdefault.jpg"}];
    const audio = document.getElementById('audio');
    const playBtn = document.getElementById('playBtn');
    const pauseBtn = document.getElementById('pauseBtn');
    const volumeSlider = document.getElementById('volumeSlider');
    const volumePercent = document.getElementById('volumePercent');
    const marqueeSpan = document.getElementById('marqueeText');
    const currentTimeSpan = document.getElementById('currentTime');
    const durationSpan = document.getElementById('duration');
    const progressBar = document.getElementById('progressBar');
    const progressFill = document.getElementById('progressFill');
    const canvas = document.getElementById('waveformCanvas');
    const ctx = canvas.getContext('2d');
    const markersLayer = document.getElementById('markersLayer');
    const tracklistGrid = document.getElementById('tracklistGrid');
    
    let currentTrackIndex = -1;

    function formatTime(sec) {
        if (isNaN(sec)) return '00:00';
        const m = Math.floor(sec / 60);
        const s = Math.floor(sec % 60);
        return m.toString().padStart(2,'0') + ':' + s.toString().padStart(2,'0');
    }
    
    function updateMarkers() {
        const dur = audio.duration;
        if (!dur || isNaN(dur)) return;
        markersLayer.innerHTML = '';
        tracks.forEach((track, index) => {
            const pct = (track.seconds / dur) * 100;
            const marker = document.createElement('div');
            marker.className = 'timeline-marker';
            marker.style.left = pct + '%';
            
            // Structure HTML de l'infobulle modifiée avec conteneurs d'événements distincts
            marker.innerHTML = `
                <div class="marker-tooltip">
                    <div class="tooltip-thumb-wrapper" data-url="${track.url}">
                        <img src="${track.thumbnail}">
                    </div>
                    <div class="tooltip-title">${track.title}</div>
                </div>
            `;
            
            // CLIC SUR LE MARQUEUR (TRAIT DE LA TIMELINE) -> CHANGE LE TEMPS DANS LE LECTEUR
            marker.addEventListener('click', (e) => {
                // Si on clique sur la vignette, on ne change pas le temps de lecture
                if (e.target.closest('.tooltip-thumb-wrapper')) return;
                audio.currentTime = track.seconds; 
                audio.play(); 
            });
            
            // CLIC SUR LA VIGNETTE DANS L'INFOBULLE -> REDIRECTION YOUTUBE
            const thumb = marker.querySelector('.tooltip-thumb-wrapper');
            thumb.addEventListener('click', (e) => {
                e.stopPropagation(); // Évite les conflits de clics
                window.open(track.url, '_blank');
            });
            
            markersLayer.appendChild(marker);
        });
    }
    
    function updateProgress() {
        if (audio.duration) {
            progressFill.style.width = (audio.currentTime / audio.duration) * 100 + '%';
            let activeIndex = -1;
            for (let i = 0; i < tracks.length; i++) {
                if (audio.currentTime >= tracks[i].seconds) activeIndex = i;
            }
            if (activeIndex !== currentTrackIndex && activeIndex !== -1) {
                currentTrackIndex = activeIndex;
                document.querySelectorAll('.track-row').forEach((row, idx) => {
                    if (idx === activeIndex) row.classList.add('active'); else row.classList.remove('active');
                });
                marqueeSpan.textContent = tracks[activeIndex].artist.toUpperCase() + ' — ' + tracks[activeIndex].title;
            }
        }
        currentTimeSpan.textContent = formatTime(audio.currentTime);
    }
    
    function buildUI() {
        tracklistGrid.innerHTML = '';
        tracks.forEach((track) => {
            const row = document.createElement('div');
            row.className = 'track-row';
            row.addEventListener('click', () => { audio.currentTime = track.seconds; audio.play(); });
            row.innerHTML = `<div class="track-vignette" style="background-image: url('${track.thumbnail}');"></div><div class="track-details"><div class="track-artist-name">${track.artist}</div><div class="track-song-title">${track.title}</div></div><div><a href="${track.url}" target="_blank" class="track-link" onclick="event.stopPropagation()">Source</a></div>`;
            tracklistGrid.appendChild(row);
        });
    }
    
    playBtn.addEventListener('click', () => audio.play());
    pauseBtn.addEventListener('click', () => audio.pause());
    volumeSlider.addEventListener('input', () => { audio.volume = volumeSlider.value / 100; volumePercent.textContent = volumeSlider.value + '%'; });
    audio.addEventListener('timeupdate', updateProgress);
    audio.addEventListener('loadedmetadata', () => { durationSpan.textContent = formatTime(audio.duration); updateMarkers(); });
    
    buildUI();
</script>
<audio id="audio" src="./latest.mp3" preload="auto" crossorigin="anonymous"></audio>
</body>
</html>
